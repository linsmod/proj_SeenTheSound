        const vw = window.innerWidth || 1024, vh = window.innerHeight || 768;
        menuEl.style.left = Math.max(4, Math.min(vw - menuEl.offsetWidth - 4, r.right - menuEl.offsetWidth)) + 'px';
        menuEl.style.top = (r.bottom + 4 + menuEl.offsetHeight > vh ? Math.max(4, r.top - menuEl.offsetHeight - 4) : r.bottom + 4) + 'px';
    }
    window.addEventListener('click', (ev) => { if (!menuEl.hidden && !menuEl.contains(ev.target)) closeMenu(); });
    window.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeMenu(); });
    window.addEventListener('resize', closeMenu);
    // 整块重建网格 + 文件树：增删格 / 复制 / 载入新文档会改 DOC 的格数与顺序，序号按位置算，必须重排。
    // 只摘 cellCharts 里的格子，右栏输出图与逐级卡继续留在 charts 里（它们的 DOM 不在 grid 内）。
    // 实验台（LAB_ID）也是普通一格（模板）：右栏现在是纯编辑器，"自由探索"既然是 DOC 里的一条，就该能被点到、能新建副本。
    function buildGrid() {
        grid.innerHTML = '';
        for (const ch of cellCharts) { const i = charts.indexOf(ch); if (i >= 0) charts.splice(i, 1); }
        cellCharts.length = 0;
        cellCharts.push(buildCell(READONLY_ENTRY, 0));      // 0 号输入：所有图的共同起点，排在矩阵最前
        DOC.charts.forEach((e, i) => cellCharts.push(buildCell(e, i + 1)));
        buildTree();
        setGridVisible(OPEN.viewer === 'grid');   // 重建后的格子要按当前视图决定参与不参与绘制
    }
    function cellOf(id) { return cellCharts.find((c) => c.entry && c.entry.id === id) || null; }
    // ---------- 播放控制：暂停 = 冻结画面（停止 compute+draw，画布保持最后一帧） ----------
    // 暂停那一刻把画布存成 base64 PNG 写进 DOC.view.shots，并顺手存一次盘（不提交任何草稿）。
    // 载入时按 DOC.view 还原：暂停的画布不再参与绘制，并把存档里的快照画回画布（尺寸变化后也重画）。
    // 暂停的粒度是"一块画布的身份 key"：格子的 key = entry.id，模板条目的 key = 文件路径。
    // 两者共用同一份 view.paused / view.shots —— 模板条目也要能暂停，与格子没有区别。
    function keyOf(ch) { return ch.file || (ch.entry && ch.entry.id) || ''; }
    function isPaused(key) { return !!key && !!(DOC.view && DOC.view.paused.includes(key)); }
    function viewOf() { if (!DOC.view) DOC.view = emptyView(); return DOC.view; }
    function chartsOfKey(key) {
        const out = [];
        if (!key) return out;
        for (const ch of charts) if (keyOf(ch) === key) out.push(ch);
        return out;                                  // 同一 key 可能有两块画布（列表小图 + 单文件大图）
    }
    function captureShot(ch) {
        const k = keyOf(ch);
        if (!k) return false;
        try {
            const url = ch.cv.toDataURL('image/png');
            if (url.length <= MAX_SHOT) { viewOf().shots[k] = url; return true; }
        } catch (e) { /* toDataURL 失败（极端情况下画布不可导出）就不存，只保留暂停状态 */ }
        return false;
    }
    function paintShot(ch) {
        const k = keyOf(ch);
        const u = k && DOC.view && DOC.view.shots[k];
        if (!u) return false;
        ch.ctx.clearRect(0, 0, ch.w, ch.h);
        const img = new Image();
        img.onload = () => { ch.ctx.drawImage(img, 0, 0, ch.w, ch.h); };
        img.src = u;
        ch.shotPainted = true;
        return true;
    }
    // 同一 key 可能对应多块画布（列表小图 / 单文件大图 / 格子），一起冻结；快照各存各的
    // 右栏是编辑器，跟左栏的播发状态无关：它永远实时跑，不受这里的暂停影响
    function setPaused(key, on, opts) {
        if (!key) return;
        const clean = !archiveDirty();   // 同上：先取，改 view 之后就取不到了
        const v = viewOf();
        v.paused = v.paused.filter((x) => x !== key);
        if (on) v.paused.push(key);
        else delete v.shots[key];     // 恢复播放 = 这张快照作废；清掉，免得存档里越攒越多陈旧图
        for (const ch of chartsOfKey(key)) {
            ch.paused = on;
            if (on) captureShot(ch);
            renderPlayBtn(ch);
        }
        syncGlobalPlay();      // 单个暂停也影响"是不是全部暂停" → 全局按钮文案要跟着变
        refreshDirty();
        // 暂停/恢复都顺手存一次：播放状态与快照都在存档里（不提交任何草稿）
        if (!opts || !opts.silent) viewAutoSave(clean);
    }
    // 全部暂停 = 当前视野里所有"有身份的画布"：矩阵各格 + 模板视图里的各条
    function pauseKeys() {
        const out = [];
        for (const c of cellCharts) if (c.entry) out.push(c.entry.id);
        for (const ch of viewCharts) if (ch.file) out.push(ch.file);
        return out;
    }
    function allPaused() {
        const ks = pauseKeys();
        return ks.length > 0 && ks.every(isPaused);
    }
    function setAllPaused(on) {
        const clean = !archiveDirty();
        for (const k of pauseKeys()) setPaused(k, on, { silent: true });
        syncGlobalPlay();
        viewAutoSave(clean);
    }
    // 播放按钮就地刷：格子把 paused 打在 .cell 上，模板条目打在自己的卡片上（共用 .paused 的压暗样式）
    function renderPlayBtn(ch) {
        if (!ch.playBtn) return;
        const on = isPaused(keyOf(ch));
        ch.playBtn.textContent = on ? '▶' : '⏸';
        ch.playBtn.title = on ? '继续播放（快照会一起清掉）' : '暂停（画面停住，并存一张快照到存档）';
        const box = ch.cell || ch.card;
        if (box) box.classList.toggle('paused', on);
    }
    // 载入 / adoptDoc 之后：把暂停状态贴到各块画布上，并把存档里的快照画回来
    function applyView() {
        for (const ch of charts) {
            const k = keyOf(ch);
            if (!k) continue;                  // 右栏输出图 / 逐级卡没有身份，不参与
            ch.paused = isPaused(k);
            if (ch.paused) paintShot(ch);
            renderPlayBtn(ch);
        }
        labOut.paused = false;    // 右栏是编辑器，始终实时（与左栏的播发/暂停无关）
        syncGlobalPlay();
    }
    function syncGlobalPlay() {
        const b = document.getElementById('gPlay');
        const all = allPaused();
        b.textContent = all ? '▶ 全部播放' : '⏸ 全部暂停';
        b.title = all ? '恢复所有画布播放' : '暂停所有画布（各存一张快照到存档）';
    }
    buildGrid();

    // 全局参数：平坦度时间窗（影响所有图的数据源 sfmLines）
    const gState = {};
    buildParams(document.getElementById('globalBar'),
        [{ key: 'win', label: '平坦窗(秒)', type: 'range', min: 0.02, max: 1, step: 0.02, def: 0.2, dst: gState }],
        () => { sfmWinK = Math.max(1, Math.round(gState.win * CHART_HZ)); });

    // ---------- 级联存档的清洗（供文档模型 sanitizeDoc / defaultLabEntry 调用） ----------
    // 存的是纯数据（id/on/p），非法 id 与越界参数在这里就地纠正。
    // 判存在必须用 hasOwnProperty：OPS 是普通对象，OPS['__proto__'] 会沿原型链拿到 Object.prototype（truthy），
    // 用真值判断会让脏存档里的 '__proto__'/'constructor' 混进来，随后取 .params 抛错、白屏。
    function sanitizeStages(raw) {
        if (!Array.isArray(raw)) return null;
        const out = [];
        for (const s of raw) {
            if (!s || typeof s !== 'object' || !Object.prototype.hasOwnProperty.call(OPS, s.id)) continue;
            const op = OPS[s.id];
            const p = (s.p && typeof s.p === 'object') ? { ...s.p } : {};
            for (const sp of op.params) {
                let v = p[sp.key];
                if (typeof v !== 'number' || !isFinite(v)) v = sp.def;
                if (sp.min != null) v = Math.max(sp.min, v);
                if (sp.max != null) v = Math.min(sp.max, v);
                p[sp.key] = v;
            }
            out.push({ id: s.id, on: s.on !== false, p, collapsed: typeof s.collapsed === 'boolean' ? s.collapsed : undefined });
            if (out.length >= MAX_STAGES) break;   // 存档里塞了超长链：截断，不给页面无限渲染的机会
        }
        return out;
    }
    // 反相曾经写死在管道里（旧版每条链都隐含 1-v），现在是可选算子。
    // 旧存档里不可能有 inv 这一级，补在最前面以保持原语义；幂等（已有就不再补）。
    // 空链例外：那只能是用户主动清空的结果（清空按钮在 inv 出现之前也存在），
    // 补一级等于推翻用户的操作，所以原样尊重。
    function ensureInv(list) {
        if (!list.length) return list;
        if (!list.some((s) => s.id === 'inv')) list.unshift({ id: 'inv', on: true, p: {}, collapsed: true });
        return list;
    }
    // 收起态缺省：只展开末级，其余中间级全部收起。已有明确布尔值的一律沿用（尊重用户改过的）。
    // 输入级(k=0)不属于"级"，它的收起态不落盘、随会话保留在卡片 class 上。
    function labDefaultCollapse(list) {
        const last = list.length - 1;
        list.forEach((s, i) => { if (typeof s.collapsed !== 'boolean') s.collapsed = i !== last; });
        return list;
    }

    // ---------- 右栏编辑器：每格一份关联草稿，保存才写回左格 ----------
    // 关键约定：右栏碰的对象永远不是 DOC 里的那一份。
    //   drafts   id → { d: 该格的深拷贝, base: 克隆那一刻 DOC 的快照 JSON }。按需建、切换不清，
    //            所以可以在 ② 和 ③ 之间来回切，两边的改动各自留着（各自都有 ✎ 角标）
    //   DRAFT    只是"当前选中格那一份草稿"的引用，省得逐级卡/输入框到处按 id 取
    // 「保存」= 一次性把所有草稿深拷贝回各自 DOC 格 + 落盘；右上 ✕ = 关掉当前这一格（脏的先问保存/丢弃/取消）。
    // 与网格各图共用 OPS / computeChart / buildParams，同一条执行路径 —— 右栏只是"换了个编辑入口"。
    // 左格参数条走另一条路：直接写 DOC（成品可就地调参、实时生效）。有未保存草稿的格子会把参数条锁掉
    //（见 renderCell），同一个参数不会被两边各写一次。
    const labEl = document.getElementById('lab');
    const labPipeEl = document.getElementById('labPipe');
    const labTitleEl = document.getElementById('labTitle');
    const labDescEl = document.getElementById('labDesc');
    const labOrdEl = document.getElementById('labOrd');
    const labDirtyEl = document.getElementById('labDirty');
    const labRoHintEl = document.getElementById('labRoHint');
    const labCloseEl = document.getElementById('labClose');
    const labSaveEl = document.getElementById('labSave');
    const dlg = document.getElementById('closeDlg');
    const dlgTitleEl = document.getElementById('dlgTitle');
    const dlgBodyEl = document.getElementById('dlgBody');
    function entryOf(id) { return DOC.charts.find((c) => c.id === id) || (id === INPUT_ID ? READONLY_ENTRY : null); }
    function ordOf(id) { return isReadonly(id) ? '原' : ordLabel(Math.max(0, DOC.charts.findIndex((c) => c.id === id)) + 1); }
    function archiveDirty() { return entryDocJson(DOC) !== lastSaved; }   // 成品侧：参数调参 / 增删格还没存进服务端
    function pendingIds() { const out = []; for (const id of drafts.keys()) if (draftDirty(id)) out.push(id); return out; }
    // 未保存提示按格归属：只报"当前这一格"的草稿状态。
    // 之前是一盏全局灯：改完 ② 再去点 ③，右边还挂着"未保存"，读起来像是 ③ 没保存 —— 其实脏的是 ②。
    // 别的格的待写回状态各有各的位置：卡片上是 ✎、树上是 ✎；右栏在空态时补一句"N 格待写回"当提醒。
    // 成品侧（卡片调参 / 增删格，内存里已生效但磁盘上没有）单独用"未落盘"区分开。
    function refreshDirty() {
        const ro = !!selected && isLocked(selected);
        const mine = !!selected && !ro && draftDirty(selected);
        const others = pendingIds().filter((id) => id !== selected);
        const n = pendingIds().length;
        const unsaved = entryDocJson(DOC) !== lastSaved;      // 成品侧没存进服务端（草稿不算：那是"未保存"）
        labDirtyEl.textContent = storeState === 'error' ? '存盘失败'
            : storeState === 'offline' ? '离线'
            : saving ? '保存中…'
            : !selected ? (n ? `${n} 格待写回` : (unsaved ? '未落盘' : ''))
            : mine ? `${ordOf(selected)} 未保存` : (unsaved ? '未落盘' : '');
        labDirtyEl.hidden = !labDirtyEl.textContent;
        labDirtyEl.title = storeMsg || (mine && others.length
            ? `另有 ${others.length} 格待写回：${others.map(ordOf).join(' ')}（点那些格子上带 ✎ 的格子继续处理）`
            : (!selected && n ? '点左侧格子上带 ✎ 的那格继续处理' : ''));
        labCloseEl.hidden = !selected;        // 空态没有"正在编辑的东西"可关
        labSaveEl.hidden = ro;               // 模板/只读格没有草稿可写回，也就不给保存
        for (const ch of cellCharts) {       // 各格 ✎ 角标跟随草稿状态（在右栏改草稿时卡片没重渲染过）
            if (ch.entry) ch.pmarkEl.style.display = !ch.ro && draftDirty(ch.entry.id) ? '' : 'none';
        }
        syncTree();                          // 树上的选中高亮 / 标题 / ✎● 也跟着刷（它不随 buildGrid 重建）
    }
    // 草稿 → 输入框。正在输入的那一格跳过，避免打字时被回写打断
    function syncEditorInputs() {
        if (!DRAFT) return;
        const ro = isLocked(DRAFT.id);        // 模板/只读格：文本仍可选中复制，但改不了
        labOrdEl.textContent = ordOf(DRAFT.id);
        labTitleEl.readOnly = ro;
        labDescEl.readOnly = ro;
        if (document.activeElement !== labTitleEl) labTitleEl.value = DRAFT.title;
        if (document.activeElement !== labDescEl) labDescEl.value = DRAFT.desc;
    }
    // 点格子即开始编辑。每格的草稿存在 drafts 里，切走切回都不丢
    function selectChart(id) {
        if (id === selected || !entryOf(id)) return;
        const clean = !archiveDirty();   // 必须先取：改 openedTabs 本身就会让 DOC 与基线不等
        selected = id;
        viewOf().openedTabs = [id];      // 右栏当前开着哪个标签，跟着存档走
        bindDraft();
        for (const ch of cellCharts) renderCell(ch);      // 刷新各格的 ✎ 角标 / 参数条锁
        syncEditorInputs();
        labSync(true);
        viewAutoSave(clean);
    }
    // 视图状态（暂停 / 快照 / 开着的标签）就在 DOC 里，这类改动本身也算"未落盘"。
    // 成品侧此刻没有别的待落盘改动时顺手写盘；有的话留着 —— 不能替用户把待保存的删格/调参一起交了。
    function viewAutoSave(clean) { if (clean) saveDoc(false); }
    // 关闭当前编辑 = 关掉这个"标签"。有未保存先问，语义照搬 VSCode 关标签：保存 / 丢弃 / 取消
    function closeEditor() {
        if (!selected) return;
        if (!draftDirty(selected)) { commitClose(); return; }
        dlgTitleEl.textContent = `${ordOf(selected)} 未保存`;
        dlgBodyEl.textContent = `「${DRAFT.title}」还有没保存的改动。\n保存 = 写回左格并落盘；丢弃 = 只丢掉这一格的草稿，左格不动。`
            + (archiveDirty() ? '\n另外成品侧还有改动没落盘（参数调整 / 增删格），保存会一并写盘。' : '');
        dlg.showModal();
    }
    function commitClose() {
        const clean = !archiveDirty();
        selected = '';
        viewOf().openedTabs = [];        // 关掉了，存档里也不留
        bindDraft();                 // → null，右栏回到空态
        for (const ch of cellCharts) renderCell(ch);
        syncEditorInputs();
        labSync(true);
        viewAutoSave(clean);
    }
    // 提交：把所有待写回的草稿一次性深拷贝回各自 DOC 格（左格此刻才变），再整份存到服务端。
    // 存盘失败不吞：lastSaved 保持旧值 → 状态位继续报"未落盘"，并把原因挂在 title 上。
    async function saveDoc(commitDrafts) {
        const commit = commitDrafts !== false;      // 播放控制触发的存盘只写视图状态，不动右栏的草稿
        if (commit) {
            for (const [id, r] of drafts) {
                const e = entryOf(id);
                if (!e || isLocked(id)) continue;              // 格子被删了 / 模板只读，没有草稿可写回
                e.title = r.d.title.trim().slice(0, 60) || '未命名';
                e.desc = r.d.desc.slice(0, 400);
                e.stages = r.d.stages.slice(0, MAX_STAGES).map(cloneStage);
            }
            drafts.clear();                                // 写回后草稿与成品同形，没必要留着
            bindDraft();
            for (const ch of cellCharts) renderCell(ch);   // 标题 / 管道摘要 / 参数条（按新算子重建）
            syncEditorInputs(); labSync(true);
        }
        const prev = lastSaved;
        lastSaved = entryDocJson(DOC);                     // 先乐观置为已存：界面立刻干净
        refreshDirty();
        const ok = await saveDocToServer(DOC, !commit);     // 只写视图的后台存盘，不亮"保存中…"
        lastSaved = ok ? entryDocJson(DOC) : prev;         // 失败就把基线退回去，状态位重新亮起来
        refreshDirty();
    }
    // 恢复出厂（成品侧操作，立即生效）：回到"出厂来源"那一份快照 ——
    //   模板 → 它自己的内置出厂状态（只有内置 ①–⑧ 有快照，实验台/输入没有）
    //   「我的图」 → 它 from 指向的那个模板（从模板新建时记下的）
    // 这一格的草稿一起丢掉：它本来就是"改这一格"，改回出厂后没什么可保留的
    function resetToDefault(id) {
        const e = entryOf(id);
        const p = e && originPristine(e);
        if (!e || !p) return;
        e.title = p.title; e.desc = p.desc;
        e.stages = p.stages.map(cloneStage);
        drafts.delete(id);
        if (id === selected) bindDraft();
        const ch = cellOf(id);
        if (ch) renderCell(ch);
        syncEditorInputs(); labSync(true); refreshDirty();
    }
    function newChartId() { let i = 1; while (DOC.charts.some((c) => c.id === 'u' + i)) i++; return 'u' + i; }
    // 新建一份「我的图」：套模板内容（可编辑），from 记下来源模板 → 以后能「恢复出厂」回那一天。
    // 标题同名就加"副本"，免得树里两行一模一样的字。
    function newFromTemplate(tplId) {
        const t = entryOf(tplId);
        if (!t || !isTemplate(tplId)) return;
        const dup = DOC.charts.some((c) => !isTemplate(c.id) && c.title === t.title);
        addUserChart({
            title: t.title + (dup ? ' 副本' : ''),
            desc: t.desc,
            stages: t.stages,
            from: PRISTINE.has(tplId) ? tplId : undefined,   // 有出厂快照才记来源（实验台/输入没有 → 不记）
        });
    }
    // 复制：把来源深克隆一份成新的「我的图」，并跳到该副本接着编辑。来源那一份不动。
    // srcId 缺省 = 用当前草稿（"把右栏这条链固化成一张图"）。
    function cloneAsNew(srcId) {
        const src = srcId ? entryOf(srcId) : DRAFT;
        if (!src) return;
        addUserChart({
            title: src.title.replace(/ 副本( \d+)?$/, '') + ' 副本',
            desc: src.desc,
            stages: src.stages,
            from: src.from || (PRISTINE.has(src.id) ? src.id : undefined),
        });
    }
    // 落一份新的用户图（插在实验台之前 → 树里"我的图"按新建顺序排）：深克隆，与来源没有任何共享引用
    function addUserChart(spec) {
        const e = { id: newChartId(), title: spec.title, desc: spec.desc, stages: spec.stages.map(cloneStage) };
        if (spec.from) e.from = spec.from;
        const at = DOC.charts.findIndex((c) => c.id === LAB_ID);
        DOC.charts.splice(at < 0 ? DOC.charts.length : at, 0, e);
        selectChart(e.id);
        buildGrid(); labSync(true); refreshDirty();
    }
    // 删除（成品侧操作，由格子的 ⋯ 菜单触发）：从 DOC 摘掉，它自己的草稿跟着一起消失，
    // 别的格的草稿不受影响。删除只是成品改动，按「保存」才落盘；本页刷新就恢复。
    function deleteChart(id) {
        const i = DOC.charts.findIndex((c) => c.id === id);
        if (i < 0) return;
        if (!confirm(`删除「${DOC.charts[i].title}」？\n删除后按「保存」才落盘；本页刷新就恢复。`)) return;
        const lostDraft = draftDirty(id) ? '\n（这一格还有未保存的草稿，会一起丢掉）' : '';
        DOC.charts.splice(i, 1);
        drafts.delete(id);
        if (id === selected) commitClose();   // 删的就是正在编辑的那格 → 右栏直接空态（VSCode 关标签）
        buildGrid();
        syncEditorInputs(); labSync(true); refreshDirty();
        if (lostDraft) alert('已删除，该格未保存的草稿一并丢弃' + lostDraft.trim());
    }
    // 备好第一份草稿：右栏所有画布（输出图 / 逐级卡）都从 DRAFT 取数据，必须早于它们建对象
    bindDraft();

    // 输出图：就是右栏上半身那块画布（HTML 里已就位，高度与左格画布一致）。
    // 数值上必然等于末级卡（都是跑完全部 N 级），但它不随逐级收起/展开，也不随滚动移出视野，
    // 所以单独留在上半身当"当前这一格的最终结果"。不需要卡片包裹，也没有额外标签。
    const labOut = { stages: [], out: new Float32Array(SFM_PC * CHART_N), w: 0, h: CH, hidden: false };
    labOut.cv = document.getElementById('labCanvas');
    labOut.ctx = labOut.cv.getContext('2d');
    labOut.stages = DRAFT ? DRAFT.stages.slice() : [];   // 空态下没有草稿，逐级卡与画布都空转
    labOut.w = fitCanvas(labOut.cv, CH);
    charts.push(labOut);
    // 逐级出图 + 级联操作合到同一张卡片：一张卡 = 一级 = 一张图。
    // 第 k 张图的 stages = 前 k 级。k=0 即输入（1-v 后、任何变换前），共 N+1 张。
    // 复用 computeChart 而不做增量快照：每张就是"只跑前 k 级"的独立计算，
    // 与单独建一张同款图完全等价 —— 各中间值天然一致，不会与主链路分叉。
    //
    // 卡片分工：
    //   头部（收起也可见）= 身份与编排：caret 收起 / 启用 / 选算子 / 参数 hint / 上移下移删除
    //   身体（收起隐藏）  = 作用与结果：参数控件 + 该级输出画布
    // 收起时头部足以判断"这是第几级、什么算子、参数多少、在链上什么位置"，且仍可编排。
    const labCharts = [];
    function rebuildLabCharts() {
        const S = DRAFT ? DRAFT.stages : [];     // 草稿副本的级联；空态下没有草稿，逐级卡清空
        labOut.stages = S.slice();               // 输出图跟着最新级联走（元素同引用，参数改动即时生效）
        for (const c of labCharts) { const i = charts.indexOf(c); if (i >= 0) charts.splice(i, 1); }
        labCharts.length = 0;
        const host = document.getElementById('labCharts');
        host.innerHTML = '';
        const last = S.length;                  // 末级索引 = 最后一张图
        // 只画第 1..N 级（输入是 grid 的 0 号格，不在这里重复出图）
        for (let k = 1; k <= last; k++) {
            const st = S[k - 1];
            const collapsed = !!st.collapsed;    // 缺省见 labDefaultCollapse：只展开末级
            const card = document.createElement('div');
            card.className = 'lcard' + (collapsed ? ' collapsed' : '');

            const hd = document.createElement('div');
            hd.className = 'lcard-hd';
            const caret = document.createElement('button');
            caret.type = 'button';
            caret.className = 'caret';
            caret.textContent = '▾';
            caret.title = '收起/展开这一级（收起后仍保留标题、参数与全部编排按钮）';
            hd.appendChild(caret);

            const en = document.createElement('input');
            en.type = 'checkbox';
            en.className = 'en';
            en.checked = st.on;
            en.title = '启用/停用这一级（停用不参与执行，出图与上一级相同）';
            en.addEventListener('change', () => { st.on = en.checked; labSync(false); });
            hd.appendChild(en);

            const sel = document.createElement('select');
            sel.className = 'sel';
            sel.title = OPS[st.id].kind === 'vector' ? '整条 12 音级一起算（跨音级上下文）' : '逐音级独立映射';
            for (const key of Object.keys(OPS)) {
                const o = document.createElement('option');
                o.value = key;
                o.textContent = (OPS[key].kind === 'vector' ? '⧉ ' : '') + OPS[key].label;
                sel.appendChild(o);
            }
            sel.value = st.id;
            sel.addEventListener('change', () => {
                st.id = sel.value; st.p = {};      // 换算子 → 参数回到该算子的默认值
                labSync(true);
            });
            hd.appendChild(sel);

            // 参数 hint：收起后唯一能看到参数的地方
            const opEl = document.createElement('span');
            opEl.className = 'op';
            hd.appendChild(opEl);

            const ops = document.createElement('span');
            ops.className = 'sops';
            const mkBtn = (txt, title, fn, cls) => {
                const b = document.createElement('button');
                b.type = 'button'; b.textContent = txt; b.title = title;
                if (cls) b.className = cls;
                b.addEventListener('click', fn);
                ops.appendChild(b);
                return b;
            };
            mkBtn('↑', '上移一级（改变执行顺序）', () => {
                if (k <= 1) return;
                [S[k - 2], S[k - 1]] = [S[k - 1], S[k - 2]];
                labSync(true);
            }).disabled = k === 1;
            mkBtn('↓', '下移一级（改变执行顺序）', () => {
                if (k > last) return;
                [S[k], S[k - 1]] = [S[k - 1], S[k]];
                labSync(true);
            }).disabled = k === last;
            mkBtn('✕', '删除这一级', () => { S.splice(k - 1, 1); labSync(true); }, 'del');
            hd.appendChild(ops);

            const body = document.createElement('div');
            body.className = 'lcard-body';
            // 参数跟图走：控件在本级卡片里、画布正上方，改完立刻看结果
            const ctl = document.createElement('div');
            ctl.className = 'lctl';
            body.appendChild(ctl);
            // 只刷 hint 不重建卡片，否则拖动滑杆时焦点/拖拽会被打断
            buildParams(ctl, OPS[st.id].params.map((s) => ({ ...s, dst: st.p })), () => labSync(false));
            const cv = document.createElement('canvas');
            cv.className = 'mx';
            body.appendChild(cv);
            card.appendChild(hd); card.appendChild(body);
            host.appendChild(card);

            const ch = {
                stages: S.slice(0, k),             // 前 k 级；元素是同一批对象引用，改参数即时生效
                stagesRef: S,                      // 记住建卡时的级联数组：折叠/hint 刷新只读它，不依赖当前选中项
                out: new Float32Array(SFM_PC * CHART_N),
                w: 0, h: LAB_C_H,
                cv, ctx: cv.getContext('2d'),
                card, caret, opEl, enEl: en, selEl: sel, labK: k,
                hidden: collapsed,                 // 主循环跳过收起的图
            };
            caret.addEventListener('click', () => {
                st.collapsed = !st.collapsed;
                applyCollapse(ch);
                refreshDirty();                                    // 折叠态也是存档内容，跟着草稿走
                if (!ch.hidden) ch.w = fitCanvas(cv, LAB_C_H);   // 收起时 display:none 无布局宽度，展开必须重量
                labelLabCharts();                                 // 收起后头部仍要显示 title + 参数 hint
            });
            if (!collapsed) ch.w = fitCanvas(cv, LAB_C_H);        // 收起的不测宽，留 0 等展开时重测
            else cv.style.height = LAB_C_H + 'px';                // 但 CSS 高照样定死，避免展开瞬间被 132px 撑一下
            charts.push(ch);      // 塞进同一个列表：主循环自动 compute + draw，无需特判
            labCharts.push(ch);
        }
        labelLabCharts();
    }
    // 收起态只由各级的 collapsed 决定。
    // 越界保护：labCharts 与当前级联由 rebuildLabCharts 保持同长，
    // 这里再兜一层，避免任何漏 rebuild 的路径把整页打挂（标题刷新是纯展示，不该抛异常）
    function applyCollapse(ch) {
        const st = ch.stagesRef[ch.labK - 1];
        if (!st) { ch.hidden = true; return; }
        ch.card.classList.toggle('collapsed', !!st.collapsed);
        ch.hidden = ch.card.classList.contains('collapsed');
    }
    // 只刷新 hint / 勾选 / skip 标记，不重建 DOM（拖参数滑杆、启停切换时用）
    function labelLabCharts() {
        labOut.stages = DRAFT ? DRAFT.stages.slice() : [];
        for (const ch of labCharts) {
            applyCollapse(ch);
            const st = ch.stagesRef[ch.labK - 1];
            if (!st) continue;
            const fp = Object.entries(st.p).map(([key, v]) => `${key}=${(+v).toFixed(1)}`).join(',');
            ch.opEl.textContent = fp ? `(${fp})` : '—';
            ch.enEl.checked = st.on;
            ch.card.classList.toggle('skip', !st.on);
        }
    }
    // 唯一的编辑收口：空态切换 + 刷管道摘要 + 刷"未保存" + 重建或只刷标签
    function labSync(rebuild) {
        labEl.classList.toggle('idle', !DRAFT);
        labEl.classList.toggle('ro', !!(DRAFT && isLocked(DRAFT.id)));   // 只读态：模板/输入格 —— 不给保存、不给级联编排
        if (DRAFT && isLocked(DRAFT.id)) {
            labRoHintEl.textContent = isReadonly(DRAFT.id)
                ? '0 号输入：原始 SFM，只读（原始量本身没有可改字段）。反相 1-v 是各图自己挑的可选算子。'
                : '模板（非用户创建）：只读。要改成你自己的图 → 在左栏这一行上右键「从模板新建」一份副本。';
        }
        labPipeEl.textContent = DRAFT ? pipeSummary({ stages: DRAFT.stages }) : '';
        labOut.hidden = !DRAFT;               // 空态时画布不参与绘制（display:none 画了也白画）
        refreshDirty();
        if (rebuild) rebuildLabCharts();
        else labelLabCharts();
    }

    // ---- 工具条接线（全部写草稿；左格要等「保存」才动） ----
    labTitleEl.addEventListener('input', () => {
        if (!DRAFT || isLocked(DRAFT.id)) return;      // 模板/只读格：输入框本就不可编辑，这里再挡一次（防粘贴/程序化赋值）
        DRAFT.title = labTitleEl.value.slice(0, 60);
        refreshDirty();                       // 左格标题不动 —— 保存时才写回
    });
    labDescEl.addEventListener('input', () => {
        if (!DRAFT || isLocked(DRAFT.id)) return;
        DRAFT.desc = labDescEl.value.slice(0, 400);
        refreshDirty();
    });
    document.getElementById('labSave').addEventListener('click', saveDoc);
    document.getElementById('labAdd').addEventListener('click', () => {
        if (!DRAFT || isLocked(DRAFT.id)) return;
        const S = DRAFT.stages;
        if (S.length >= MAX_STAGES) return;               // 12 音级 × 250 点，8 级已远超需要
        const pick = S.length ? S[S.length - 1].id : 'pow';
        // 新增的一级默认收起：它在链中间/末尾但不是"末级默认展开"那条，除非整条链只有它
        S.push({ id: pick, on: true, p: {}, collapsed: S.length !== 0 });
        labSync(true);
    });
    document.getElementById('labClear').addEventListener('click', () => { if (DRAFT && !isLocked(DRAFT.id)) { DRAFT.stages.length = 0; labSync(true); } });
    // 关闭：干净就直接关，脏的先弹 dialog（原生 dialog 自带 Esc = 取消、点遮罩不关）
    labCloseEl.addEventListener('click', closeEditor);
    // 全局播放控制
    document.getElementById('gPlay').addEventListener('click', () => setAllPaused(!allPaused()));
    document.getElementById('dlgSave').addEventListener('click', () => { dlg.close(); saveDoc(); commitClose(); });
    document.getElementById('dlgDrop').addEventListener('click', () => { dlg.close(); drafts.delete(selected); commitClose(); });
    document.getElementById('dlgCancel').addEventListener('click', () => dlg.close());
    syncEditorInputs();
    rebuildLabCharts();
    labSync(true);
    applyView();          // 起手就按存档里的播放状态冻结（并把快照画回来）

    function drawChart(ch) {
        const c = ch.ctx, W = ch.w, H = ch.h;
        c.clearRect(0, 0, W, H);
        c.fillStyle = '#0a1022';
        c.fillRect(0, 0, W, H);
        const padL = 14, padR = 4, padT = 5, padB = 12;
        const iw = W - padL - padR, ih = H - padT - padB;
        c.font = '9px sans-serif';
        c.textAlign = 'left';
        for (let v = 0; v <= 1.001; v += 0.25) {
            const y = Math.round(padT + ih * (1 - v)) + 0.5;
            c.beginPath(); c.moveTo(padL, y); c.lineTo(W - padR, y);
            c.strokeStyle = (v === 0 || v === 1) ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.06)';
            c.lineWidth = 1; c.stroke();
            if (v === 0 || v === 0.5 || v === 1) {
                c.fillStyle = 'rgba(114,134,173,0.65)';
                c.fillText(v.toFixed(1), 2, y + 3);
            }
        }
        // X 轴分辨率自适应：可用宽 iw 决定能分辨几个时间片。
        // 每个像素列装不下一个采样点时（窄画布），按列取 min/max 画竖向包络：
        //   直接连线会因欠采样丢峰，丝带的上下缘（重缩放图永远贴边）会被抹平，包络则如实保留。
        // 画得够宽时（每列 ≥1 个采样点）仍逐点连线，不做任何降采样。
        const cols = Math.max(1, Math.round(iw));
        const step = chartCount / cols;          // 每像素列平均装几个采样点
        const decimated = step > 1.5;
        const xOf = (p) => padL + iw * p / (CHART_N - 1);
        const yOf = (v) => padT + ih * (1 - Math.max(0, Math.min(1, v)));
        for (let pc = 0; pc < SFM_PC; pc++) {
            const base = pc * CHART_N, col = SEMI_RGB[pc];
            c.beginPath();
            if (decimated) {
                for (let ci = 0; ci < cols; ci++) {
                    const p0 = Math.floor(ci * step), p1 = Math.min(chartCount, Math.floor((ci + 1) * step));
                    if (p1 <= p0) continue;
                    let mn = Infinity, mx = -Infinity;
                    for (let p = p0; p < p1; p++) { const v = ch.out[base + p]; if (v < mn) mn = v; if (v > mx) mx = v; }
                    const x = padL + ci;           // 整数 x：列与像素对齐，逐帧不抖
                    c.moveTo(x, yOf(mn));
                    c.lineTo(x, yOf(mx));
                }
            } else {
                for (let p = 0; p < chartCount; p++) c.lineTo(xOf(p), yOf(ch.out[base + p]));
            }
            c.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},0.85)`;
            c.lineWidth = 1;
            c.stroke();
        }
    }

    // ---------- 主循环 ----------
    function loop(ts) {
        if (isRunning) {
            if (!lastTs) lastTs = ts;
            const dt = Math.min((ts - lastTs) / 1000, 0.25);
            lastTs = ts;
            updateBuffers(dt);
        }
        sfmFillLines();
        // hidden = 右栏里收起的级：画布 display:none，画了也看不见，白算白画
        // paused = 用户按了暂停：冻结在这最后一帧上，连 compute 都省了
        for (const ch of charts) { if (ch.hidden || ch.paused) continue; computeChart(ch, sfmLines); drawChart(ch); }
        requestAnimationFrame(loop);
    }
    // 所有画布的逻辑宽都随容器实测（含右栏），窗口/缩放变化时逐块重量。
    // 重量会重建位图（位图一重建，上一帧就没了）→ 暂停中的画布要把存档里的快照重画回来。
    function refitAll() {
        for (const ch of charts) { if (ch.hidden) continue; ch.w = fitCanvas(ch.cv, ch.h); }
        for (const ch of charts) {
            if (ch.hidden || !ch.paused) continue;
            paintShot(ch);      // 暂停中的画布把存档里的快照重画回位图
        }
    }
    window.addEventListener('resize', refitAll);
    // 系统缩放变化 / 跨屏拖动（dpr 变化）时重建位图，否则位图按旧 dpr 拉伸 → 文字发虚
    if (window.matchMedia) {
        const mq = window.matchMedia(`(resolution: ${(window.devicePixelRatio || 1)}dppx)`);
        if (mq.addEventListener) mq.addEventListener('change', refitAll);
        else if (mq.addListener) mq.addListener(refitAll);   // 旧版 Safari
    }
    connectSSE();
    // 文档从服务端拉（异步）：先用出厂配置把 UI 立起来，拿到再整块换掉。
    // 服务端还没有文档时，把浏览器里的旧 localStorage 存档顶上去（迁移只发生一次）。
    (async () => {
        const { doc, migrate } = await loadDocFromServer();
        if (JSON.stringify(doc) !== JSON.stringify(DOC)) adoptDoc(doc);
        if (migrate) {
            storeState = 'load';
            const ok = await saveDocToServer(migrate);
            if (ok) adoptDoc(migrate);
        }
        await loadTemplates();     // templates/ 的清单：树里的目录组 + 中间两个视图都靠它
        renderCenter();            // 起手是矩阵视图（顺带把面包屑画出来）
        refreshDirty();
    })();
    // 调试入口：控制台里 open({ file: 'templates/inv+zscore.json' }) 可直接切视图
    window.matrixOpen = open;
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
