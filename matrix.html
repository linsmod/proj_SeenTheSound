<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>参数化矩阵 · 管道位置 × 变换函数</title>
<style>
    body { margin: 0; background: #070c1a; color: #bcc8e8; font-family: 'Segoe UI', sans-serif; }
    .topbar {
        display: flex; align-items: center; gap: 16px; padding: 8px 12px;
        background: #0b1226; border-bottom: 1px solid rgba(255,255,255,0.08);
        font-size: 12px; flex-wrap: wrap;
    }
    .topbar .t { font-weight: 700; }
    .topbar a { color: #8fa2c8; font-size: 12px; }
    .status { color: #8fa2c8; font-size: 12px; }
    /* 参数条与控件（可复用：buildParams 按 spec 渲染，图表不手写控件） */
    .pbar { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
    .ctl { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #8fa2c8; white-space: nowrap; }
    .ctl input[type=range] { width: 90px; accent-color: #4ae0ff; }
    .ctl select { background: #0a1022; color: #bcc8e8; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; font-size: 12px; }
    .ctl .v { min-width: 36px; color: #e8eefc; font-variant-numeric: tabular-nums; }
    /* 全局图例：12 音级配色只画一次，各图不再逐线渲染音名（否则 8×12 个小字互相压叠） */
    .legend-row { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 6px 12px; background: #0b1226; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: #8fa2c8; }
    .legend-row .sw { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
    /* 图表矩阵单元格：高度写死 + 参数条移到画布下方并 margin-top:auto
       → 各格画布 y 坐标完全一致，横向逐行比对。宽度不写死，由 grid 列宽自适应 */
    /* 主体三栏：左 = 文件树（templates/ + 我的图），中 = 可换视图的面板（矩阵 / 模板列表 / 单文件链路），右 = 编辑器。
       左树是导航 + 右键管理入口；中间默认放"画布网格"，也可以 open() 切成模板列表或某条链路的详情。
       窄屏（手机等）放不下三栏时靠 flex-wrap 依次换行，不维护断点。 */
    .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; padding: 10px 12px 16px; }
    /* 左栏文件树：宽度固定，长了自己滚（它是导航，不该跟着 grid 一起长） */
    .tree { flex: 0 0 216px; box-sizing: border-box; padding: 4px 4px 6px; background: #0e1630; border: 1px solid rgba(255,255,255,0.22); border-radius: 8px; }
    .tree .th { display: flex; align-items: center; gap: 6px; padding: 6px 6px 3px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #8fa2c8; }
    .tree .th .cnt { flex: none; font-weight: 400; color: #5a6c94; }
    .tree .th .hint { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; font-weight: 400; color: #45557a; }
    .tree .tnode { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 5px; font-size: 12px; color: #bcc8e8; cursor: pointer; }
    .tree .tnode:hover { background: #17223f; }
    .tree .tnode.sel { background: rgba(74,224,255,0.14); box-shadow: inset 0 0 0 1px rgba(74,224,255,0.45); color: #cbeeff; }
    .tree .tnode .to { flex: none; width: 15px; color: #4ae0ff; }
    .tree .tnode .tn { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree .tnode .tk { flex: none; font-size: 10px; color: #ffb347; }        /* ● 与出厂不同 */
    .tree .tnode .tk.p { color: #4ae0ff; }                                   /* ✎ 有未保存草稿 */
    /* 模板行：非用户创建，只能「从模板新建」出自己的副本，所以整行压暗一档以示只读 */
    .tree .tnode.tpl .tn { color: #9fb0d6; }
    .tree .tnode.tpl .to { color: #6d7fa6; }
    .tree .empty { padding: 3px 6px 6px; font-size: 11px; color: #45557a; }
    /* 中间：grid 预览区。用 auto-fill 的 1fr 列，列宽一致 → 跨行也能对齐 */
    .mid { flex: 1 1 420px; min-width: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; align-content: start; }
    /* 卡片外壳：网格各格（.cell）与右栏编辑器（.lab）共用同一套外观 —— 背景/圆角/描边/纵向流。
       .lab 里 .etop/.erow/.dsc 是编辑头（选目标、改标题说明），画布是"这一格的最终结果"，
       再往下是工具条与逐级卡 —— 与一个 cell 的"标题 + 画布 + 底部一条参数带"同构，只是多了编辑控件。 */
    .cell, .lab { box-sizing: border-box; background: #0e1630; border-radius: 8px; border: 1px solid rgba(255,255,255,0.22); display: flex; flex-direction: column; padding: 6px 8px 8px; }
    /* 高度从 210 加到 238：底部多一条播放器按钮行。各格仍然等高 → 画布 y 依旧对齐 */
    .cell { height: 238px; }
    .lab { flex: 0 1 372px; min-width: 0; max-width: 372px; align-self: flex-start; }
    /* 吸附 + 栏内滚动只在三栏并排时启用：阈值 ≈ 216 + 420 + 372 + 两个 gap + padding = 1064 */
    @media (min-width: 1064px) {
        .lab, .tree { position: sticky; top: 10px; max-height: calc(100vh - 24px); overflow-y: auto; scrollbar-gutter: stable; }
    }
    /* 标题 / 副标题：cell 与编辑器共用 */
    .cell .hd { flex: none; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: #bcc8e8; cursor: pointer; }
    /* 标题行三段分开：序号徽标 / 标题文本 / 已改标记。序号不进标题文本 ——
       标题可改、还能「从模板新建」，序号必须由位置算，改名与增删格都不会打乱编号。
       .ttl 吃掉剩余宽度（flex:1 + min-width:0）：标题过长时自己截断，
       后面的 ● ✎ 始终被顶到这一行最右端。 */
    .cell .hd .ord { flex: none; margin-right: 4px; color: #4ae0ff; }
    .cell .hd .ttl { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cell .hd .mark { flex: none; margin-left: 4px; color: #ffb347; font-size: 10px; }
    .cell .hd .pmark { flex: none; margin-left: 4px; color: #4ae0ff; font-size: 11px; }   /* ✎ = 该格有未保存草稿 */
    .cell canvas.mx { cursor: pointer; }
    /* 这一格正在右栏被编辑且草稿已脏 → 锁住左格参数条：状态在右栏手里，左格再改就成两份了 */
    .cell .pbar.locked { opacity: 0.35; pointer-events: none; }
    /* .sel = 正在被右栏编辑的这一格。tabindex + Enter/Space 让键盘也能选中（focus-visible 出虚线框） */
    .cell.sel { border-color: #4ae0ff; box-shadow: 0 0 0 1px rgba(74,224,255,0.45); }
    .cell:focus-visible { outline: 1px dashed #4ae0ff; outline-offset: 1px; }
    .cell .pipe, .lab .pipe { flex: none; margin: 2px 0 4px; font-size: 11px; color: #8fa2c8; font-family: Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    canvas.mx { flex: none; display: block; width: 100%; height: 132px; background: #0a1022; border-radius: 6px; }
    /* 参数条贴单元格底部：有无参数都占同一条带（选择器收窄到 .cell，避免影响顶栏的 #globalBar） */
    .cell .foot { flex: none; margin-top: auto; }      /* 参数条 + 播放器按钮行合成一个底部块，整体贴底 */
    /* 底部播放器按钮组：右对齐。⏸/▶ = 该格冻结 / 继续播放（恢复播放时快照随之清掉） */
    .cell .prow { display: flex; justify-content: flex-end; gap: 4px; margin-top: 3px; }
    .cell .prow button { flex: none; min-width: 22px; height: 18px; padding: 0 5px; background: #141d34; color: #8fa2c8; border: 1px solid rgba(255,255,255,0.10); border-radius: 5px; font-size: 11px; line-height: 1; cursor: pointer; }
    .cell .prow button:hover:not(:disabled) { background: #263a60; color: #fff; }
    .cell .prow button:disabled { opacity: 0.3; cursor: default; }
    .cell.paused canvas.mx { opacity: 0.55; }
    .cell.paused .hd .ttl { color: #7d8db3; }
    /* 顶栏的全局播放控制：与全局参数条同族，放在它们右边 */
    .gctl { display: inline-flex; align-items: center; gap: 4px; }
    .gctl button { background: #141d34; color: #8fa2c8; border: 1px solid rgba(255,255,255,0.10); border-radius: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer; }
    .gctl button:hover { background: #263a60; color: #fff; }
    /* 下半身的工具条（保存 / 级联编排 / 复制 / 导入导出；删除与恢复出厂在格子的 ⋯ 菜单里） */
    .ltools { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
    .lbtn.primary { border-color: rgba(74,224,255,0.45); color: #cbeeff; }
    .lbtn:disabled { opacity: 0.35; cursor: default; }
    .lbtn { background: #141d34; color: #8fa2c8; border: 1px solid rgba(255,255,255,0.10); border-radius: 6px; font-size: 12px; padding: 3px 12px; cursor: pointer; }
    .lbtn:hover { background: #263a60; color: #fff; }
    /* 级联逐级出图，且每张卡自带全部编排控件（收起也可用）：
       头部 = 收起 / 启用 / 选算子 / 参数 hint / 上移下移删除；身体 = 参数控件 + 该级输出画布 */
    .lcharts { display: flex; flex-direction: column; gap: 6px; }
    .lcharts:empty::after { content: '（暂无级联，点上方"+ 加一级"开始）'; font-size: 12px; color: #5a6c94; }
    .lcard { background: #0a1022; border-radius: 6px; padding: 4px 6px 6px; border: 1px solid rgba(255,255,255,0.22); }
    .lcard-hd { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8fa2c8; }
    .lcard-hd .caret { flex: none; width: 16px; height: 18px; padding: 0; background: none; border: 0; color: #8fa2c8; font-size: 11px; line-height: 1; cursor: pointer; transition: transform 0.12s; }
    .lcard.collapsed .lcard-hd .caret { transform: rotate(-90deg); }
    .lcard-hd .en { flex: none; margin: 0; width: 13px; height: 13px; accent-color: #4ae0ff; cursor: pointer; }
    .lcard-hd .sel { flex: 0 1 auto; min-width: 0; max-width: 128px; background: #070c1a; color: #bcc8e8; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; font-size: 11px; padding: 1px 2px; cursor: pointer; }
    .lcard-hd .ord { flex: none; font-weight: 700; color: #e8eefc; }
    .lcard-hd .op { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: Consolas, monospace; color: #5a6c94; }
    .lcard.skip .lcard-hd .op { text-decoration: line-through; }
    .lcard.skip { opacity: 0.5; }                          /* 该级已停用：出图与上一级相同 */
    .lcard-hd .sops { flex: none; display: flex; gap: 3px; }
    .lcard-hd .sops button { width: 22px; height: 20px; padding: 0; background: #141d34; color: #8fa2c8; border: 1px solid rgba(255,255,255,0.10); border-radius: 4px; font-size: 11px; line-height: 1; cursor: pointer; }
    .lcard-hd .sops button:hover:not(:disabled) { background: #263a60; color: #fff; }
    .lcard-hd .sops button:disabled { opacity: 0.3; cursor: default; }
    .lcard-hd .sops button.del:hover { background: #6b2440; }
    .lcard-body { margin-top: 4px; }
    .lcard.collapsed .lcard-body { display: none; }
    .lctl { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-bottom: 4px; }
    /* 右栏编辑器头部：状态位 + 关闭按钮（关掉就回到"没在编辑任何一格"的空态） */
    .lab .etop { flex: none; display: flex; gap: 6px; align-items: center; margin-bottom: 4px; font-size: 11px; color: #8fa2c8; }
    .lab .dirty { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ffb347; }
    .lab .xbtn { flex: none; width: 20px; height: 18px; padding: 0; background: none; border: 1px solid transparent; border-radius: 4px; color: #8fa2c8; font-size: 12px; line-height: 1; cursor: pointer; }
    .lab .xbtn:hover { background: #263a60; color: #fff; border-color: rgba(255,255,255,0.15); }
    /* 空态：没有选中任何一格时只留这句提示，其余控件全部收起 */
    .lab .idle { display: none; padding: 22px 12px; font-size: 12px; line-height: 1.8; color: #5a6c94; text-align: center; }
    .lab.idle .idle { display: block; }
    .lab.idle .erow, .lab.idle .dsc, .lab.idle .pipe, .lab.idle .mx, .lab.idle .ltools, .lab.idle .lcharts { display: none; }
    /* 只读态（模板 / 原始输入格）：不给保存、不给级联编排，标题/说明仍可选中复制。
       编排按钮一并藏掉，是为了把"只读"这条约定钉死 —— 将来若出现带级的只读条目也不会漏出编辑入口。 */
    .lab.ro .edit-only, .lab.ro .lcard-hd .en, .lab.ro .lcard-hd .sel, .lab.ro .lcard-hd .sops { display: none; }
    .lab.ro input.ttl, .lab.ro textarea.dsc { opacity: 0.72; }
    .lab.ro .lcharts:empty::after { content: '（原始输入没有级联：什么都不做）'; }
    /* 只读提示：告诉用户"这一条不能改，要改就从模板新建一份"，否则会以为界面坏了 */
    .lab .rohint { display: none; flex: none; margin: 2px 0 4px; padding: 4px 6px; background: #17223f; border-left: 2px solid #4ae0ff; border-radius: 4px; font-size: 11px; line-height: 1.6; color: #9fb0d6; }
    .lab.ro .rohint { display: block; }
    .lab .erow { flex: none; display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
    .lab .erow .ord { flex: none; color: #4ae0ff; font-size: 14px; font-weight: 700; }
    .lab input.ttl { flex: 1 1 auto; min-width: 0; box-sizing: border-box; background: #0a1022; color: #e8eefc; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; font-size: 13px; font-weight: 700; padding: 2px 4px; }
    .lab textarea.dsc { flex: none; width: 100%; box-sizing: border-box; margin-bottom: 4px; background: #0a1022; color: #8fa2c8; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; font-size: 11px; padding: 2px 4px; resize: vertical; }
    /* 关闭时的未保存询问（原生 dialog，语义与 VSCode 关标签一致：保存 / 丢弃 / 取消） */
    dialog { background: #0e1630; color: #bcc8e8; border: 1px solid rgba(255,255,255,0.22); border-radius: 8px; padding: 14px 16px 12px; min-width: 340px; max-width: 460px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
    dialog::backdrop { background: rgba(4,8,18,0.62); }
    .dlg-t { font-size: 14px; font-weight: 700; color: #e8eefc; margin-bottom: 6px; }
    .dlg-b { font-size: 12px; line-height: 1.7; color: #8fa2c8; white-space: pre-line; margin-bottom: 12px; }
    .dlg-f { display: flex; gap: 8px; justify-content: flex-end; }
    /* 格子右上角 ⋯ 弹出的格级菜单：编辑 / 另存为 / 删除。挂在 body 上（格内浮层会被 grid 行布局挤变形），
       position:fixed + getBoundingClientRect 用视口坐标，不用管滚动量 */
    .cmenu { position: fixed; z-index: 30; min-width: 132px; padding: 4px; background: #0e1630; border: 1px solid rgba(255,255,255,0.22); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.55); }
    .cmenu button { display: block; width: 100%; padding: 4px 8px; background: none; border: 0; border-radius: 4px; color: #bcc8e8; font-size: 12px; text-align: left; cursor: pointer; }
    .cmenu button:hover { background: #263a60; color: #fff; }
    .cmenu button.danger:hover { background: #6b2440; }
    /* 中心面板的视图切换：面包屑 + 三块互斥视图（grid / dsplistview / dspview），由 open() 决定装哪块 */
    .crumb { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 8px; font-size: 12px; color: #8fa2c8; }
    .crumb .seg { padding: 1px 7px; background: #141d34; border: 1px solid rgba(255,255,255,0.10); border-radius: 5px; color: #8fa2c8; cursor: pointer; }
    .crumb .seg:hover { background: #263a60; color: #fff; }
    .crumb .seg.now { cursor: default; color: #cbeeff; background: rgba(74,224,255,0.10); border-color: rgba(74,224,255,0.45); }
    .crumb .sp { color: #45557a; }
    /* 播放按钮行与参数条：格子（.cell）与模板条目（.tcard / .dspview）共用同一套，
       结构也照格子来 —— 标题 → 管道 → 画布 → 参数条+播放按钮，画面 y 对齐 */
    .prow { display: flex; justify-content: flex-end; gap: 4px; margin-top: 3px; }
    .prow button { flex: none; min-width: 22px; height: 18px; padding: 0 5px; background: #141d34; color: #8fa2c8; border: 1px solid rgba(255,255,255,0.10); border-radius: 5px; font-size: 11px; line-height: 1; cursor: pointer; }
    .prow button:hover { background: #263a60; color: #fff; }
    .foot { margin-top: auto; }          /* 参数条 + 播放按钮贴底，各卡画布位置一致 */
    .tcard.paused canvas.mx, .dspview.paused canvas.mx { opacity: 0.55; }
    .tcard.paused .ttitle { color: #7d8db3; }
    /* dsplistview：templates/ 目录的列表视图，一格一个模板文件，小画布即取即看 */
    .dsplist { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; align-content: start; }
    .dsplist .tcard { box-sizing: border-box; display: flex; flex-direction: column; background: #0e1630; border: 1px solid rgba(255,255,255,0.22); border-radius: 8px; padding: 6px 8px 8px; cursor: pointer; }
    .dsplist .tcard:hover { border-color: rgba(74,224,255,0.45); }
    .dsplist .tcard.sel { border-color: #4ae0ff; box-shadow: 0 0 0 1px rgba(74,224,255,0.45); }
    /* 三块视图互斥：[hidden] 只靠 UA 样式挡不住 .grid/.dsplist 自己的 display，这里显式压掉 */
    .grid[hidden], .dsplist[hidden], .dspview[hidden] { display: none; }
    /* 树里的模板目录：目录行平齐、文件行缩进一档，看得出是同一目录下的条目 */
    .tree .tnode.dir { font-weight: 700; }
    .tree .tnode.file { margin-left: 14px; }
    .tfile, .dspview .vfile { font-family: Consolas, monospace; font-size: 11px; color: #4ae0ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dsplist .ttitle { font-size: 14px; font-weight: 700; color: #bcc8e8; margin: 2px 0; }
    .dsplist .tdesc { margin-top: 4px; font-size: 11px; line-height: 1.6; color: #8fa2c8; }
    .dsplist .pipe, .dspview .pipe { margin: 2px 0 4px; font-size: 11px; color: #8fa2c8; font-family: Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* dspview：单个模板文件的预览视图 —— 大画布 + 逐级算子 + 入口按钮（只读，要改就新建副本） */
    .dspview { background: #0e1630; border: 1px solid rgba(255,255,255,0.22); border-radius: 8px; padding: 8px 10px 10px; }
    .dspview .vh { font-size: 15px; font-weight: 700; color: #e8eefc; }
    .dspview .vdesc { margin: 4px 0 6px; font-size: 11px; line-height: 1.7; color: #8fa2c8; }
    .dspview .stages { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .dspview .st { padding: 3px 8px; background: #0a1022; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; font-size: 11px; color: #8fa2c8; font-family: Consolas, monospace; }
    .dspview .st.off { opacity: 0.45; text-decoration: line-through; }
    .dspview .vtools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tpl-empty { padding: 14px 2px; font-size: 12px; color: #5a6c94; }
</style>
</head>
<body>
<div class="topbar">
    <span class="t">参数化矩阵 · 管道位置 × 变换函数</span>
    <span class="pbar" id="globalBar"></span>
    <span class="gctl">
        <button id="gPlay" type="button" title="全局播放 / 暂停（暂停时每格各存一张快照到存档）">⏸ 全部暂停</button>

    <aside class="tree" id="tree"></aside>
    <div class="mid">

    <div class="lab" id="lab">
        <div class="etop">
            <span class="dirty" id="labDirty"></span>
            <button class="xbtn" id="labClose" type="button" title="关闭当前编辑（未保存会先问，走 VSCode 关闭标签那套：保存 / 丢弃 / 取消）">✕</button>
        </div>
        <div class="idle">左栏点一行、或中间点一张卡片，即可编辑<br/>管理动作（从模板新建 / 复制 / 删除 / 恢复出厂）在左栏那行的右键菜单里</div>
        <div class="erow">
            <span class="ord" id="labOrd"></span>
            <input class="ttl" id="labTitle" type="text" maxlength="60" placeholder="标题"/>
        </div>

            <button class="lbtn primary" id="labSave" type="button" title="把所有格子待写回的草稿一次性写回中间卡片，并存到服务端 matrix-doc.json">💾 保存</button>
            <button class="lbtn edit-only" id="labAdd" type="button" title="在链尾追加一级（上限 8 级，12 音级 × 250 点远超够用）">+ 加一级</button>
            <button class="lbtn edit-only" id="labClear" type="button" title="清空级联 = 不做任何变换（保存后该格将与 0 号输入同图）">清空</button>

        <button class="lbtn primary" id="dlgSave" type="button">保存并关闭</button>

<script>
(function () {
    'use strict';

    // ---------- 常量（与主面板同一数据口径） ----------
    const CHART_SEC = 5, CHART_HZ = 50, CHART_N = CHART_SEC * CHART_HZ, SFM_PC = 12;
    const KEY_LO = 21, KEY_HI = 108;
    // A4 音准参考：以主面板的 localStorage['a4Ref'] 为准（同源跨页共享），本页不重复提供切换控件。
    // 主面板改 A4 后 storage 事件在同源其他页面触发 → 跟随；pcBins 缓存键含 A4，下一帧自动重建映射。
    let A4 = (() => { try { return parseFloat(localStorage.getItem('a4Ref')) || 440; } catch (e) { return 440; } })();
    window.addEventListener('storage', (ev) => {
        if (ev.key !== 'a4Ref') return;
        const v = parseFloat(ev.newValue) || 440;
        if (v !== A4) A4 = v;
    });
    const SFM_SPAN = 70;   // 字节→dB 映射跨度（MIN_DB -100 / MAX_DB -30）
    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    // 十二音级配色（OKLCH 等亮度，逐字复制自主面板）
    const SEMI_L = 0.75, SEMI_C = 0.13;
    function oklchRgb(L, C, Hdeg) {
        const h = Hdeg * Math.PI / 180;
        const A = C * Math.cos(h), B = C * Math.sin(h);
        const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3;
        const m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3;
        const s = (L - 0.0894841775 * A - 1.2914855480 * B) ** 3;
        const gm = (x) => { x = Math.max(0, Math.min(1, x)); return x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055; };
        return [
            Math.round(gm(+4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s) * 255),
            Math.round(gm(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s) * 255),
            Math.round(gm(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s) * 255)
        ];
    }
    const SEMI_RGB = Array.from({ length: SFM_PC }, (_, i) => oklchRgb(SEMI_L, SEMI_C, i * 30));
    // ---------- 管道计算（纯函数区，可独立数值测试） ----------
    // 管道：1-v（反相）→ 按序执行 ch.stages 的每一级 → OUTPUT
    // 变换注册表 OPS，两种 kind：
    //   scalar：逐音级独立映射 f(x,p)→x'（幂/log/tanh…）
    //   vector：拿整条 12 音级向量 f(a,p)→a（就地改写）。min/max、μ/σ、排秩这类必须跨音级看全貌的
    //           归一化只有靠跨音级上下文才能算，通用链装不下，所以显式区分而不是硬塞进 scalar。
    // 每级自带 params spec（{key,label,type,min,max,step,def}），由 buildParams 统一渲染成控件。
    // 一级 = { id, on, p }：id 指向 OPS，on=false 跳过，p 存该级实参（默认值由 buildParams 填）。
    const OPS = {
        // 反相：原本写死在 computeChart 里的固定第一步，现在降级为普通可选算子（可删、可换序、可重复）。
        inv:  { label: '1-v 反相', kind: 'scalar', f: (x) => 1 - x, params: [] },
        id:    { label: '恒等', kind: 'scalar', f: (x) => x, params: [] },
        pow:   { label: '幂', kind: 'scalar', f: (x, p) => Math.pow(Math.max(0, x), p.n),
                 params: [{ key: 'n', label: 'n', type: 'range', min: 0.1, max: 4, step: 0.1, def: 2 }] },
        log:   { label: 'log', kind: 'scalar', f: (x) => Math.log(Math.max(0, x) + 1e-3), params: [] },
        tanh:  { label: 'tanh', kind: 'scalar', f: (x, p) => 0.5 + 0.5 * Math.tanh(p.k * (x - 0.5)) / Math.tanh(p.k / 2),
                 params: [{ key: 'k', label: 'k', type: 'range', min: 1, max: 20, step: 0.5, def: 6 }] },
        // log01：0~1 上做 log 后线性重映射回 0~1（0→0、1→1）
        log01: { label: 'log(0~1)', kind: 'scalar', f: (x) => { const e = 1e-3; return (Math.log(e + (1 - e) * x) - Math.log(e)) / -Math.log(e); }, params: [] },
        rescale: { label: '重缩放', kind: 'vector', f: (a) => {
            let mn = Infinity, mx = -Infinity;
            for (let i = 0; i < SFM_PC; i++) { const v = a[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
            const rg = mx - mn;
            for (let i = 0; i < SFM_PC; i++) a[i] = rg > 1e-9 ? (a[i] - mn) / rg : 0.5;   // 极差≈0 → 居中
        }, params: [] },
        zscore: { label: 'z-score', kind: 'vector', f: (a, p) => {
            let sum = 0;
            for (let i = 0; i < SFM_PC; i++) sum += a[i];
            const mean = sum / SFM_PC;
            let q = 0;
            for (let i = 0; i < SFM_PC; i++) { const d = a[i] - mean; q += d * d; }
            const sd = Math.sqrt(q / SFM_PC), zm = p.zMax || 2;
            for (let i = 0; i < SFM_PC; i++) {          // 均值/σ 先算完再写，避免边写边读
                const z = sd > 1e-9 ? (a[i] - mean) / sd : 0;
                a[i] = (Math.max(-zm, Math.min(zm, z)) + zm) / (2 * zm);
            }
        }, params: [{ key: 'zMax', label: '±z', type: 'range', min: 1, max: 4, step: 0.1, def: 2 }] },
        rank: { label: '分位秩', kind: 'vector', f: (a) => {
            let mn = Infinity, mx = -Infinity;
            for (let i = 0; i < SFM_PC; i++) { const v = a[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
            if (mx - mn <= 1e-9) { for (let i = 0; i < SFM_PC; i++) a[i] = 0.5; return; }
            for (let i = 0; i < SFM_PC; i++) rankTmp[i] = a[i];   // 排秩要读原值：先快照再写回
            for (let i = 0; i < SFM_PC; i++) {
                const x = rankTmp[i];
                let less = 0, equal = 0;
                for (let q = 0; q < SFM_PC; q++) {
                    if (rankTmp[q] < x - 1e-12) less++;
                    else if (rankTmp[q] <= x + 1e-12) equal++;
                }
                a[i] = (less + (equal - 1) / 2) / (SFM_PC - 1);   // 并列取平均秩
            }
        }, params: [] },
    };
    // 一级工厂：id + 启用位；参数默认值由 buildParams 按 spec 填进 p
    const stage = (id) => ({ id, on: true, p: {} });
    // 图表矩阵定义：8 条内置级联，标题写"为什么选它"（想看清什么特征），
    // 机制（哪一级、什么算子、什么顺序）由下方 .pipe 摘要实时显示，悬停格子显示 desc。
    // id 是稳定身份（存档 key、另存为/删除/选中都靠它）——标题可改，所以绝不能拿标题当 key。
    // 标题里不写 ①…⑳：序号由格子位置算出来（见 ordLabel），改名和增删格都不会打乱编号。
    const CHART_DEFS = [
        { id: 'c1', title: '看瞬时动态范围', desc: '重缩放基线：逐时刻用 12 音级的 min/max 拉伸到 0~1，丝带上下缘始终贴边 —— 每个时刻都能一眼读出"最平坦与最不坦平的音级差多少"。数据为满窗 K 点写入时冻结；主面板极差图走每帧滚动窗，仅最左 K−1 个点的窗口不满，两者其余点一致', stages: [stage('inv'), stage('rescale')] },
        { id: 'c2', title: '聚焦强音级', desc: '先 x^n（默认 n=2）再重缩放：平方让高值主导 min/max，弱音级被压成贴底的一条窄带。想看"此刻谁最强"用这个；代价是丢掉了动态范围本身。n>1 更极端，n<1（<1 即开方）反过来把弱音级拉开', stages: [stage('inv'), stage('pow'), stage('rescale')] },
        { id: 'c3', title: '让弱音级显形', desc: '先 log(x+1e-3) 再重缩放：先压缩动态范围，弱音级才拿得到画布上的空间。音频 dBFS 的标准思路，也是主面板反平坦度曲线在做的事 —— 与②相反，②牺牲弱音级换峰值对比，③牺牲峰值对比换弱音级可见', stages: [stage('inv'), stage('log'), stage('rescale')] },
        { id: 'c4', title: '看偏离均值几个 σ', desc: 'z-score：逐时刻算 12 音级的 μ 与 σ，按 ±zMax 夹紧后线性映射 0~1。看的是"相对偏离"而非绝对平坦度 —— 整体音量涨落会在 μ/σ 里被约掉，所以对音量变化免疫', stages: [stage('inv'), stage('zscore')] },
        { id: 'c5', title: '只看强弱次序', desc: '分位秩：逐时刻按 12 音级大小排秩 0~1（并列取平均秩），完全丢弃幅度信息。强制均匀分布、抗异常值；只看谁排在前面，不看差多少', stages: [stage('inv'), stage('rank')] },
        { id: 'c6', title: '锐化强弱对比', desc: '先重缩放再 x^n：输入已经是均匀分布，平方把 0~0.5 一段压到 0.25 以下，峰值保持。概率锐化 / 注意力权重的做法 —— 与②同为"平方"，但②在归一化前、⑥在归一化后', stages: [stage('inv'), stage('rescale'), stage('pow')] },
        { id: 'c7', title: '拉开中间档位', desc: '先重缩放再 tanh：0 与 1 两个端点不动，中段被展开（k 越大中段越陡）。想强调"不上不下"的那批音级、又不让两端溢出时用', stages: [stage('inv'), stage('rescale'), stage('tanh')] },
        { id: 'c8', title: '轻抬低位、留住高端', desc: '先重缩放再 log 并映回 0~1：0→0、1→1 端点不动，低段被温和抬起。比③温和得多 —— ③是在归一化之前压缩动态范围（幅度大），⑧是在归一化之后微调（幅度小）', stages: [stage('inv'), stage('rescale'), stage('log01')] },
    ];

    // ---------- 文档模型：一份可序列化 JSON = 整页真相（草稿） ----------
    // { v, charts: [ {id, title, desc, stages:[{id,on,p,collapsed}]}] }
    //   id      稳定身份：'c1'…'c8' 内置 8 图，LAB_ID 实验台，'uN' 复制出来的新图。标题可改，不能拿来当 key
    //   stages  按 id 查 OPS 注册表；非法 id / 越界参数在 sanitizeStages 里就地纠正
    // DOC 是当前工作副本（页面所见即 DOC：改标题、改说明、增删级、拖参数都直接写它，没有第二份副本要同步）
    // lastSaved 是最近一次存进服务端的 JSON；两者不等 = 状态位报"未落盘"。左格参数条也写 DOC —— 成品可就地调参
    // PRISTINE 存内置 8 图的出厂快照：供「恢复出厂」和"是否改过(●)"角标用
    // 0 号输入格不进 DOC：它没有任何可改字段，是所有图的共同起点
    const DOC_V = 1, LAB_ID = 'lab', LEGACY_LAB_KEY = 'labStages', LEGACY_BROWSER_KEY = 'matrixDoc';
    const MAX_STAGES = 8;                        // 与"加一级"上限一致
    const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
    function ordLabel(n) { return n >= 1 && n <= 20 ? CIRCLED[n - 1] : '(' + n + ')'; }
    const cloneStage = (s) => ({ id: s.id, on: s.on, p: { ...s.p }, collapsed: s.collapsed });
    // 存档比对用的规范形式：p 的键排序，避免同一份数据仅因键序不同被误判成"改过"
    function sortObj(o) { const r = {}; for (const k of Object.keys(o).sort()) r[k] = o[k]; return r; }
    // 内容（不含身份）：判"与出厂/模板是否同一份"只看这些。from 只是溯源标签，不能算进内容，
    // 否则刚从模板新建的副本立刻就被判成"改过"（副本带 from、出厂快照不带）
    function contentJson(e) {
        return JSON.stringify({
            title: e.title, desc: e.desc,
            stages: e.stages.map((s) => ({ id: s.id, on: s.on, p: sortObj(s.p), collapsed: !!s.collapsed })),
        });
    }
    function entryJson(e) {
        return JSON.stringify({
            id: e.id, title: e.title, desc: e.desc, from: e.from,
            stages: e.stages.map((s) => ({ id: s.id, on: s.on, p: sortObj(s.p), collapsed: !!s.collapsed })),
        });
    }
    // 首次访问时实验台的默认级联：反相 → scalar → vector → scalar，演示三种 kind 的位置差异。
    // 声明放在这里而不是编辑器段：loadDoc() 在模块初始化时就可能调用 defaultLabEntry()，放到后面会撞 TDZ
    const LAB_DEFAULT_STAGES = [{ id: 'inv', on: true, p: {} }, { id: 'pow', on: true, p: {} }, { id: 'rescale', on: true, p: {} }, { id: 'log01', on: true, p: {} }];
    function defaultLabEntry() {
        const stages = labDefaultCollapse((sanitizeStages(LAB_DEFAULT_STAGES) || []).map((s) => ({ ...s })));
        return { id: LAB_ID, title: '自由探索 · 级联', desc: '随手拼一条链看效果；不改动左侧任何一格，只存在浏览器本地', stages };
    }
    function defaultDoc() {
        return {
            v: DOC_V,
            // 过一遍 sanitizeStages：它会把每级 params 的缺省补全，DOC 落盘前就是完整的一份，
            // 不然 buildParams 后补的默认值会让"已保存基线"立刻对不上（● 未保存 / ● 已改 误亮）
            charts: CHART_DEFS.map((d) => ({ id: d.id, title: d.title, desc: d.desc, stages: sanitizeStages(d.stages) || [] }))
                .concat([defaultLabEntry()]),
            view: emptyView(),
        };
    }
    // 视图状态独立于内容：暂停名单 + 每块画布的画面快照（base64 PNG）+ 右栏开着哪些标签。
    // 放在根上而不是每格里 —— 只读的原始输入格与模板条目也归它管，而且它跟标题/级联这种"内容"不是一回事。
    // 暂停/快照的 key 有两种：格子 id（input / c1… / uN）与模板文件路径（templates/x.json），
    // 模板条目也能暂停、也存快照，所以两种 key 都要在清洗时留下。
    // 模板清单是异步拉的，清洗那一刻 TPLS 可能还是空的 → 只能按形态认：templates/ 下、单层、.json 结尾。
    const TPL_FILE_RE = /^templates\/[^/]+\.json$/;
    function isTplFileKey(k) { return typeof k === 'string' && TPL_FILE_RE.test(k); }
    function emptyView() { return { paused: [], shots: {}, openedTabs: [] }; }
    function sanitizeView(raw, ids) {
        const v = emptyView();
        if (!raw || typeof raw !== 'object') return v;
        const set = new Set(ids);
        const known = (k) => set.has(k) || isTplFileKey(k);
        if (Array.isArray(raw.paused)) {
            v.paused = raw.paused.filter(known).slice(0, 64);
        }
        if (Array.isArray(raw.openedTabs)) {
            const seen = new Set();
            v.openedTabs = raw.openedTabs.filter((id) => set.has(id) && !seen.has(id) && seen.add(id)).slice(0, 8);
        }
        if (raw.shots && typeof raw.shots === 'object') {
            for (const [k, url] of Object.entries(raw.shots)) {
                // 只收本项目认得的 key + 像 dataURL 的字符串；超长的直接丢，别让存档膨胀
                if (known(k) && typeof url === 'string' && url.startsWith('data:image/png') && url.length <= MAX_SHOT) {
                    v.shots[k] = url;
                }
            }
        }
        return v;
    }
    const MAX_SHOT = 200000;   // 单张快照上限（约 150KB PNG）；超了就不存，只留播放状态
    // 整份存档的入口校验：非对象 / charts 非数组 → 判无效（退回默认）。
    // 单格：title 空 → "未命名"、超长截断；desc 非字符串 → 空串；id 缺失或重复 → 丢这一格（宁可少一格也不错配）
    function sanitizeDoc(raw) {
        if (!raw || typeof raw !== 'object' || !Array.isArray(raw.charts)) return null;
        const seen = new Set(), charts = [];
        for (const c of raw.charts) {
            if (!c || typeof c !== 'object') continue;
            if (typeof c.id !== 'string' || !c.id || seen.has(c.id)) continue;
            seen.add(c.id);
            const title = typeof c.title === 'string' ? c.title.trim().slice(0, 60) : '';
            // from 只认模板 id：它决定「恢复出厂」回到哪一份出厂快照，指到不存在的地方就当没有
            const from = typeof c.from === 'string' && TEMPLATE_IDS.has(c.from) ? c.from : undefined;
            charts.push({
                id: c.id,
                title: title || '未命名',
                desc: typeof c.desc === 'string' ? c.desc.slice(0, 400) : '',
                stages: (sanitizeStages(c.stages) || []).slice(0, MAX_STAGES),
                from,
            });
        }
        if (!charts.length) return null;
        const ids = charts.map((c) => c.id).concat([INPUT_ID]);
        return { v: DOC_V, charts, view: sanitizeView(raw.view, ids) };
    }
    function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    // ---------- 存档：走后端 /api/doc，落点是项目目录下的 matrix-doc.json ----------
    // 左栏 = 带预览的文件列表，右栏 = 编辑器标签页；文档本体只有一份，跟着项目走。
    // 这里是异步的，所以页面先用出厂配置把 UI 立起来，拿到文档再整块重建（buildGrid 会重来一次）。
    let DOC = defaultDoc();
    let lastSaved = entryDocJson(DOC);   // 已存盘基线；出厂配置先当基线，避免刚进来就报"未落盘"
    let storeState = 'load';              // load → ok | offline | error，用于状态位与提示
    let storeMsg = '';
    function entryDocJson(d) { return JSON.stringify({ v: DOC_V, charts: d.charts, view: d.view || emptyView() }); }
    async function loadDocFromServer() {
        let res;
        try {
            res = await fetch('/api/doc', { cache: 'no-store' });
        } catch (e) {
            storeState = 'offline'; storeMsg = '连不上后端，本次改动只在内存里';
            return { doc: legacyOrDefault(), migrate: null };
        }
        let body = null;
        try { body = await res.json(); } catch (e) { body = null; }
        if (res.ok && body && body.exists && body.doc) {
            const doc = sanitizeDoc(body.doc);
            if (doc) {
                if (!doc.charts.some((c) => c.id === LAB_ID)) doc.charts.push(defaultLabEntry());
                storeState = 'ok';
                return { doc, migrate: null };
            }
            storeState = 'error'; storeMsg = '服务端文档结构不对，已退回出厂配置';
            return { doc: defaultDoc(), migrate: null };
        }
        if (res.ok && body && body.exists === false) {
            // 服务端还没有文档：把浏览器里旧版本地存档顶上去（迁移只做一次），没有就用出厂配置
            const legacy = legacyOrDefault();
            const fromBrowser = sanitizeDoc(parseMaybe(safeGet(LEGACY_BROWSER_KEY)));
            storeState = 'ok';
            return { doc: legacy, migrate: fromBrowser || null };
        }
        storeState = 'error';
        storeMsg = (body && body.error) ? String(body.error).slice(0, 80) : `服务端返回 ${res.status}`;
        return { doc: legacyOrDefault(), migrate: null };
    }
    function parseMaybe(s) { try { return JSON.parse(s || 'null'); } catch (e) { return null; } }
    // 老版本地存档：matrixDoc → 旧到不能再旧的 labStages → 出厂配置
    function legacyOrDefault() {
        const d = defaultDoc();
        const fromBrowser = sanitizeDoc(parseMaybe(safeGet(LEGACY_BROWSER_KEY)));
        if (fromBrowser) {
            if (!fromBrowser.charts.some((c) => c.id === LAB_ID)) fromBrowser.charts.push(defaultLabEntry());
            return fromBrowser;
        }
        const legacy = sanitizeStages(parseMaybe(safeGet(LEGACY_LAB_KEY)));
        if (legacy && legacy.length) d.charts[d.charts.length - 1].stages = labDefaultCollapse(ensureInv(legacy));
        return d;
    }
    // 保存：整份覆盖写到服务端。先落内存基线（界面立刻变干净），失败再退回"未落盘"并说明原因。
    // quiet：后台顺手写的视图状态（暂停 / 开着的标签）——不动"保存中…"这个给用户按保存看的状态位
    let saving = false;
    async function saveDocToServer(doc, quiet) {
        if (!quiet) { saving = true; refreshDirty(); }
        try {
            const res = await fetch('/api/doc', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(doc),
            });
            const body = await res.json().catch(() => null);
            if (!res.ok) throw new Error((body && body.error) || `HTTP ${res.status}`);
            storeState = 'ok'; storeMsg = '';
            return true;
        } catch (e) {
            storeState = 'error';
            storeMsg = `保存失败：${(e && e.message ? e.message : e).toString().slice(0, 80)}`;
            return false;
        } finally {
            saving = false;
            refreshDirty();
        }
    }
    function adoptDoc(doc) {
        DOC = doc;
        lastSaved = entryDocJson(DOC);
        drafts.clear();
        const want = ((doc.view && doc.view.openedTabs) || [])[0];   // 还原上次开着的标签（格子若已被删就退回空态）
        selected = want && entryOf(want) ? want : '';
        bindDraft();
        buildGrid();
        syncEditorInputs();
        labSync(true);
        applyView();          // 还原播放状态 + 把存档里的快照画回画布
        refreshDirty();
    }
    // 出厂快照（同样过 sanitizeStages，缺省参数补全后才和运行态同形）→ 供「恢复出厂」与"● 已改"角标比
    const PRISTINE = new Map(CHART_DEFS.map((d) => [d.id, { id: d.id, title: d.title, desc: d.desc, stages: sanitizeStages(d.stages) || [] }]));
    function isEdited(e) { const p = PRISTINE.get(e.id); return !!p && entryJson(e) !== entryJson(p); }

    // ---------- 每格一份待写回的草稿（右栏的 editingObject） ----------
    // drafts: id → { d: 该格的深拷贝, base: 克隆那一刻 DOC 的快照 JSON }
    //   按需建（没点过的格子不占内存）、切换目标不清（在 ② ③ 之间来回切，两边改动各自留着）
    //   每份草稿连各级 p 都是新对象 —— 右栏永远碰不到 DOC 里的原始对象
    // 声明放在这里（网格构建之前）：renderCell 要用 draftDirty() 决定参数条锁不锁、✎ 角标显不显示
    const drafts = new Map();
    let DRAFT = null;             // 当前选中格那一份草稿的引用，省得逐级卡/输入框到处按 id 取
    function cloneEntry(e) { return { id: e.id, title: e.title, desc: e.desc, from: e.from, stages: e.stages.map(cloneStage), readonly: !!e.readonly }; }
    function draftOf(id) {
        let r = drafts.get(id);
        if (!r) {
            const e = entryOf(id);          // 走 entryOf 而不是 DOC.charts：只读的原始输入格也在其中
            if (!e) return null;
            r = { d: cloneEntry(e), base: entryJson(e) };   // 基线也走 entryJson：cloneEntry 带了 readonly 标记，
                                                           // 直接 JSON.stringify 两边键集不同 → 每格恒判为脏
            drafts.set(id, r);
        }
        return r;
    }
    function bindDraft() { const r = draftOf(selected); DRAFT = r ? r.d : null; }
    function draftDirty(id) { const r = drafts.get(id || selected); return !!r && entryJson(r.d) !== r.base; }
    function pendingIds() { const out = []; for (const id of drafts.keys()) if (draftDirty(id)) out.push(id); return out; }

    const chartCount = CHART_N;   // 固定满窗（滚动示波器式，与主面板一致）
    const pipeTmp = new Float64Array(SFM_PC);   // 单点 12 音级工作区（computeChart 同步调用，不可跨图复用）
    const rankTmp = new Float64Array(SFM_PC);   // rank 就地改写前先快照原值

    // 单图管道计算：sfmLines（12×CHART_N 滑窗合成的 SFM）→ ch.out（同布局，0~1 归一值）
    // stages 是唯一事实来源：网格各格与右栏逐级卡共用同一条执行路径。
    // 反相不再写死在这里 —— 它是 OPS 里的普通算子 inv，由各图自己的 stages 决定要不要、放在哪。
    function computeChart(ch, sfmLines) {
        const out = ch.out, stages = ch.stages;
        for (let p = 0; p < chartCount; p++) {
            // 1) 取原始 SFM（不再预反相）
            for (let pc = 0; pc < SFM_PC; pc++) pipeTmp[pc] = sfmLines[pc * CHART_N + p];
            // 2) 按序执行各级：scalar 逐音级映射，vector 整条一起看
            for (let s = 0; s < stages.length; s++) {
                const st = stages[s];
                if (!st.on) continue;
                const op = OPS[st.id];
                if (op.kind === 'scalar') for (let pc = 0; pc < SFM_PC; pc++) pipeTmp[pc] = op.f(pipeTmp[pc], st.p);
                else op.f(pipeTmp, st.p);
            }
            // 3) 夹到 0~1 上屏（归一化后变换也在此之前跑完，与旧实现同序）
            for (let pc = 0; pc < SFM_PC; pc++) out[pc * CHART_N + p] = Math.max(0, Math.min(1, pipeTmp[pc]));
        }
    }
    // ---------- 参数控件工厂（可复用：fn/norm 只声明 params spec 即得控件，防代码膨胀） ----------
    // specs: [{key,label,type:'range'|'number'|'select',min,max,step,def,options,dst}]
    //   dst = 参数写入的目标对象（如某一级 stage.p）；onChg 修改后回调（刷新管道摘要等）
    function buildParams(container, specs, onChg) {
        container.innerHTML = '';
        for (const spec of specs) {
            // 幂等：只在缺键时填默认值。实验台每次重绘都会重跑本函数，
            // 若每次都重置，用户调好的参数会被旁路的改动（停用/换序）冲掉。
            if (!(spec.key in spec.dst)) spec.dst[spec.key] = spec.def;
            const lab = document.createElement('label');
            lab.className = 'ctl';
            lab.textContent = spec.label + ' ';
            let input;
            if (spec.type === 'select') {
                input = document.createElement('select');
                for (const o of spec.options) {
                    const op = document.createElement('option');
                    op.value = o.v; op.textContent = o.t; input.appendChild(op);
                }
            } else {
                input = document.createElement('input');
                input.type = spec.type === 'number' ? 'number' : 'range';
                if (spec.min != null) input.min = spec.min;
                if (spec.max != null) input.max = spec.max;
                if (spec.step != null) input.step = spec.step;
            }
            // 控件初值取 dst 里已有的值（存档 / 上一轮编辑），不是 spec.def：
            // 一律写 def 会让"存档里 n=3.5"的滑杆显示 2，而管道里跑的是 3.5 —— 控件与实际不符
            const initV = spec.dst[spec.key];
            input.value = initV;
            const valEl = document.createElement('span');
            valEl.className = 'v';
            valEl.textContent = typeof initV === 'number' ? (+initV).toFixed(2) : String(initV);
            input.addEventListener('input', () => {
                let v = input.value;
                if (spec.type !== 'select') {
                    v = parseFloat(v);
                    if (spec.min != null) v = Math.max(spec.min, v);
                    if (spec.max != null) v = Math.min(spec.max, v);
                }
                spec.dst[spec.key] = v;
                valEl.textContent = typeof v === 'number' ? (+v).toFixed(2) : String(v);
                if (onChg) onChg();
            });
            lab.appendChild(input);
            lab.appendChild(valEl);
            container.appendChild(lab);
        }
    }
    // 某图的全部参数 spec：按 stages 顺序把每级的 params 摊平（级位由顺序表达，不再加位置前缀）
    function chartParamSpecs(ch) {
        const specs = [];
        for (const st of ch.stages) {
            for (const s of OPS[st.id].params) specs.push({ ...s, dst: st.p, label: s.label });
        }
        return specs;
    }
    // 管道摘要（图标题下方等宽小字，参数/顺序/启用状态改动即时刷新）
    // vector 级加花括号标出（整条链的跨音级断点），停用级用删除线标出（不参与执行）
    function pipeSummary(ch) {
        if (!ch.stages.length) return '原始 SFM → OUTPUT';   // 0 号输入：stages 为空 = 不做任何变换
        const parts = [];
        for (const st of ch.stages) {
            const op = OPS[st.id];
            const fp = Object.entries(st.p).map(([k, v]) => `${k}=${(+v).toFixed(1)}`).join(',');
            const txt = fp ? `${op.label}(${fp})` : op.label;
            const wrapped = op.kind === 'vector' ? `{${txt}}` : `[${txt}]`;
            parts.push(st.on ? wrapped : `~~${txt}~~`);
        }
        return parts.join(' → ') + ' → OUTPUT';
    }
    // ---------- 数据源：与主面板相同的 SSE 流（/stream），逐音级 SFM 滑窗合成 ----------
    const statusEl = document.getElementById('status');
    let freqData = null, binFreqs = null;
    let pcBins = null, pcBinsKey = '';
    function ensurePcBins() {
        if (!freqData || !binFreqs) return;
        const key = binFreqs.length + ':' + A4;
        if (pcBinsKey === key && pcBins) return;
        pcBinsKey = key;
        // 统一按"bin → 最近的音 → 音级"分拣（与后端 OnsetGate / 主面板 CQT 口径一致）
        pcBins = Array.from({ length: SFM_PC }, () => []);
        for (let i = 0; i < binFreqs.length; i++) {
            const note = Math.round(69 + 12 * Math.log2(binFreqs[i] / A4));
            if (note < KEY_LO || note > KEY_HI) continue;
            pcBins[((note % 12) + 12) % 12].push(i);
        }
    }
    // 每采样逐音级 SFM 统计量（Σln m / Σm / n）环形缓冲；显示端按窗 K 滑窗合成 SFM
    const sfmSl = new Float64Array(SFM_PC * CHART_N);
    const sfmSa = new Float64Array(SFM_PC * CHART_N);
    const sfmN  = new Float32Array(SFM_PC * CHART_N);
    const sfmLines = new Float32Array(SFM_PC * CHART_N);   // 显示序缓存 = 冻结的 sfmDisp 重排
    const sfmDisp = new Float32Array(SFM_PC * CHART_N);    // 写入时冻结的显示 SFM（通道主序，下标 pc*CHART_N+idx）
    let sfmWinK = 10;                 // 平坦度时间窗（采样数，50Hz；由全局控件改秒数；写入时冻结，改窗只影响新采样）
    let chartWrite = 0, chartAccum = 0, isRunning = false, lastTs = 0;
    // 写入时冻结合成：idx 采样的显示 SFM 按当时窗 K 算一次，此后永不变。
    // 旧的显示端滑窗在左边界截断（最左 K−1 个点窗口不满、随点左移窗口继续变短 →
    // 历史值被改写、左端图像变形），且老样本的历史槽位已被新数据覆盖、显示端无法补算，故移除。
    function freezeSfmDisp(idx) {
        const K = Math.max(1, Math.min(CHART_N, sfmWinK));
        for (let pc = 0; pc < SFM_PC; pc++) {
            let sl = 0, sa = 0, n = 0;
            const base = pc * CHART_N;
            for (let k = 0; k < K; k++) {
                const o = base + ((idx - k + CHART_N) % CHART_N);
                sl += sfmSl[o]; sa += sfmSa[o]; n += sfmN[o];
            }
            sfmDisp[base + idx] = n ? Math.exp(sl / n) / (sa / n) : 0;
        }
    }
    function updateBuffers(dt) {
        if (!freqData || !binFreqs) return;
        ensurePcBins();
        chartAccum = Math.min(chartAccum + dt, 1 / CHART_HZ * 4);   // 防切页回来突发补写
        while (chartAccum >= 1 / CHART_HZ) {
            chartAccum -= 1 / CHART_HZ;
            for (let pc = 0; pc < SFM_PC; pc++) {
                let sl = 0, sa = 0, n = 0;
                const bins = pcBins[pc];
                for (let k = 0; k < bins.length; k++) {
                    const ln = freqData[bins[k]] * (SFM_SPAN / 255) * (Math.LN10 / 20);
                    sl += ln; sa += Math.exp(ln); n++;
                }
                const o = pc * CHART_N + chartWrite;
                sfmSl[o] = sl; sfmSa[o] = sa; sfmN[o] = n;
            }
            freezeSfmDisp(chartWrite);   // 显示 SFM 写入时冻结（窗恒为满窗，历史值不随窗口滑动改变）
            chartWrite = (chartWrite + 1) % CHART_N;
        }
    }
    function sfmFillLines() {
        // 显示序重排：只读写入时冻结的 sfmDisp（历史值永不重算）
        for (let pc = 0; pc < SFM_PC; pc++) {
            const base = pc * CHART_N;
            for (let p = 0; p < chartCount; p++) {
                sfmLines[base + p] = sfmDisp[base + ((chartWrite + p) % CHART_N)];
            }
        }
    }
    function connectSSE() {
        const es = new EventSource('/stream');
        es.onopen = () => { isRunning = true; lastTs = 0; statusEl.textContent = '接收中'; };
        es.onmessage = (ev) => {
            const msg = JSON.parse(ev.data);
            if (msg.err) { statusEl.textContent = '❌ ' + msg.err; isRunning = false; return; }
            const bin = atob(msg.s);
            if (!freqData || freqData.length !== bin.length) freqData = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) freqData[i] = bin.charCodeAt(i);
            if (msg.freqs) {
                if (!binFreqs || binFreqs.length !== msg.freqs.length) binFreqs = new Float64Array(msg.freqs.length);
                for (let i = 0; i < msg.freqs.length; i++) binFreqs[i] = msg.freqs[i];
            } else {
                if (!binFreqs || binFreqs.length !== bin.length) binFreqs = new Float64Array(bin.length);
                for (let i = 0; i < bin.length; i++) binFreqs[i] = (i + 0.5) * msg.binHz;
            }
            statusEl.textContent = `${(msg.kind || 'fft').toUpperCase()} · ${binFreqs.length}bin · ${msg.fps}fps`;
        };
        es.onerror = () => { isRunning = false; statusEl.textContent = '⚠️ 断开，重连中…'; };
    }
    // ---------- 图表矩阵：构建 DOM + 绘制 ----------
    // 画布尺寸不写死：CSS 侧由 grid 列宽自适应，这里实测每块画布的 CSS 宽当逻辑宽，
    // 位图 = 实测宽 × dpr → CSS 尺寸与位图永远 1:1，任何宽度下文字都不发虚。
    const CH = 132, LAB_C_H = 112;   // 网格各格 / 右栏输出图 / 右栏逐级图各自的画布高
    const grid = document.getElementById('grid');
    const charts = [];              // 参与主循环绘制的全部画布（网格格 + 右栏输出图 + 右栏逐级卡）
    const cellCharts = [];          // 仅网格格：重建网格时按这张表摘除，右栏那两类画布留在 charts 里
    let selected = '';              // 正在右栏编辑的格子 id；'' = 空态（没打开任何一格，同 VSCode 没开标签）
    // 全局图例：12 音级色块 + 音名，各图共用（画线不再逐条标音名）
    (function buildLegend() {
        const box = document.getElementById('legend');
        for (let pc = 0; pc < SFM_PC; pc++) {
            const col = SEMI_RGB[pc];
            const item = document.createElement('span');
            const sw = document.createElement('span');
            sw.className = 'sw';
            sw.style.borderColor = `rgb(${col[0]},${col[1]},${col[2]})`;
            item.appendChild(sw);
            item.appendChild(document.createTextNode(NOTE_NAMES[pc]));
            box.appendChild(item);
        }
    })();
    // 实测 CSS 宽 → 重建位图。返回逻辑宽（= CSS 宽），调用方存进 ch.w 供绘制用。
    // 不锁 CSS 宽度：锁了就没法自适应（index 的主画布锁宽是因为它尺寸固定，这里不需要）。
    function fitCanvas(cv, h) {
        const w = Math.max(80, Math.round(cv.getBoundingClientRect().width));
        cv.style.height = h + 'px';            // CSS 高必须跟着逻辑高走：写死 132 会把 112 的位图纵向拉伸变形
        const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
        const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
        if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
        const ctx = cv.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.textRendering = 'geometricPrecision';   // 文本按几何精度渲染（不支持的浏览器自动忽略）
        return w;
    }
    // 0 号：输入（逐音级原始 SFM，未反相、未做任何变换）。放在 grid 最前面，
    // 是下面所有可编辑图与右侧级联的共同起点。
    // 它是**只读**的：原始量没有可改字段，反相（1-v）是 OPS 里的可选算子 inv，由各图自己的 stages 决定要不要。
    // 只读格照样能点开看（标题 / 管道 / 画布都出得来），但不给保存、不给级联编排。
    // 它不进 DOC —— 不是成品、不落盘，只是数据源。给一个常驻的只读条目，右栏才有东西可显示。
    const INPUT_ID = 'input';
    const INPUT_TITLE = '输入 · 原始 SFM';
    const INPUT_DESC = '0 号输入：逐音级原始 SFM，未经反相也未经任何变换。只读（原始量没有可改字段）—— 反相 1-v 是可选算子，由各图/各级自己决定要不要。';
    const READONLY_ENTRY = { id: INPUT_ID, title: INPUT_TITLE, desc: INPUT_DESC, stages: [], readonly: true };
    function isReadonly(id) { return id === INPUT_ID; }
    // ---------- 模板 vs「我的图」 ----------
    // 模板 = 非用户创建的那批：内置 ①–⑧、实验台、0 号输入（数据源）。它们**只读**：
    // 想改就「从模板新建」克隆一份出来，那份 id 形如 uN，进「我的图」，才可改可删。
    // 判定走代码里的 id 白名单而不是存档里的标记：存档改不动白名单，而用户图永远拿不到 c3 这种 id
    //（newChartId 只发 uN），所以"模板"这个身份伪造不了。
    const TEMPLATE_IDS = new Set(CHART_DEFS.map((d) => d.id).concat([LAB_ID, INPUT_ID]));
    function isTemplate(id) { return TEMPLATE_IDS.has(id); }
    function isLocked(id) { return isTemplate(id); }    // 只读 = 模板（0 号输入也在白名单里）
    // 建一格：entry = DOC 里的一格（模板或「我的图」）或 READONLY_ENTRY（0 号输入）
    // 顺序固定为 标题 → 管道摘要 → 画布 → 参数条（参数在画布下方，格子高度写死，各格画布 y 对齐）
    // 卡片只负责"看"：预览 + 播放按钮。管理动作（从模板新建 / 复制 / 删除 / 恢复出厂）在左栏文件树的右键菜单里。
    function buildCell(entry, ord) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const ro = isLocked(entry.id);
        // 标题行逐节点写（textContent）：title/desc 来自用户输入且会进 localStorage，
        // 走 innerHTML 会被引号/尖括号截断属性甚至塞进标签（旧代码用 innerHTML 是因为标题是可信常量）
        const hd = document.createElement('div');
        hd.className = 'hd';
        const ordEl = document.createElement('span'); ordEl.className = 'ord';
        const ttlEl = document.createElement('span'); ttlEl.className = 'ttl';
        const markEl = document.createElement('span'); markEl.className = 'mark';
        markEl.textContent = '●'; markEl.title = '这一条已被改过（与出厂不同）';
        const pmarkEl = document.createElement('span'); pmarkEl.className = 'pmark';
        pmarkEl.textContent = '✎'; pmarkEl.title = '这一格有未保存的草稿（点它回来接着改）';
        hd.append(ordEl, ttlEl, markEl, pmarkEl);
        const pipeEl = document.createElement('div'); pipeEl.className = 'pipe';
        const cv = document.createElement('canvas'); cv.className = 'mx';
        const pbar = document.createElement('div'); pbar.className = 'pbar';
        // 底部 = 参数条 + 播放器按钮（⏸/▶），合成一块贴底，右对齐
        const foot = document.createElement('div'); foot.className = 'foot';
        const prow = document.createElement('div'); prow.className = 'prow';
        const mkP = (txt, title, fn) => {
            const b = document.createElement('button');
            b.type = 'button'; b.textContent = txt; b.title = title;
            b.addEventListener('click', (ev) => { ev.stopPropagation(); fn(); });
            prow.appendChild(b);
            return b;
        };
        const playBtn = mkP('⏸', '暂停这一格（画面停住；暂停时会存一张快照到存档里）', () => setPaused(entry.id, !isPaused(entry.id)));
        foot.append(pbar, prow);
        cell.append(hd, pipeEl, cv, foot);
        grid.appendChild(cell);
        const ch = {
            entry, ord, ro, cell, ordEl, ttlEl, markEl, pmarkEl, pbar, pipeEl, playBtn,
            paused: false, shotPainted: false,
            stages: entry.stages,                    // 与 DOC 里同一批 stage 对象：卡片参数条改的就是成品
            title: entry.title,
            out: new Float32Array(SFM_PC * CHART_N),
            w: 0, h: CH,
            cv, ctx: cv.getContext('2d'), isCell: true,
        };
        cell.tabIndex = 0;                           // 每格都能点开（含只读的模板与输入格）
        const pick = () => selectChart(entry.id);
        cell.addEventListener('click', pick);
        cell.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(); } });
        // 卡片上也能右键呼出同一套管理菜单（不必绕回左栏）：浮层锚在卡片上
        cell.addEventListener('contextmenu', (ev) => { ev.preventDefault(); openRowMenu(cell, entry.id); });
        charts.push(ch);
        ch.w = fitCanvas(cv, CH);
        renderCell(ch);
        return ch;
    }
    // 格子刷新：序号 / 标题 / 悬停说明 / 管道摘要 / 参数条。
    // 结构变更（保存写回、增删格、导入）之后必须重跑，否则参数条还按旧算子的 spec 渲染，
    // 控件与实际算子对不上。参数条回调只刷摘要与"未保存"，不重建（避免打断正在拖的滑杆）。
    function renderCell(ch) {
        const e = ch.entry;
        ch.ordEl.textContent = ch.ord ? ordLabel(ch.ord) : '原';   // 0 号输入没有圈号，给个"原"
        ch.stages = e.stages;                        // 保存写回时 DOC.stages 被换成新数组，这里跟着重新指向
        ch.ttlEl.textContent = e.title;
        ch.title = e.title;
        ch.cell.title = e.desc || '';
        ch.markEl.style.display = isEdited(e) ? '' : 'none';
        ch.cell.classList.toggle('sel', e.id === selected);
        // 锁参数条两种情形：① 模板/只读格 —— 本来就不许改，只能从模板新建副本；
        // ② 这一格在右栏有未写回的草稿 —— 同一个参数不能两边各写一次（解锁后照样能在右栏逐级卡里调）。
        const pending = !ch.ro && draftDirty(e.id);
        const lock = ch.ro || pending;
        ch.pmarkEl.style.display = pending ? '' : 'none';
        ch.pbar.classList.toggle('locked', lock);
        ch.pbar.title = ch.ro ? '模板（非用户创建）：只读。要改就在左栏这一行上右键「从模板新建」'
            : pending ? '这一格有未保存的改动（✎），先保存或关掉它，再从左调皮参' : '';
        ch.pipeEl.textContent = pipeSummary(ch);
        buildParams(ch.pbar, chartParamSpecs(ch), () => {
            ch.pipeEl.textContent = pipeSummary(ch);
            // 左格调参 = 成品改动，直接写 DOC。把这一格的草稿丢掉（锁着的时候它不可能是脏的），
            // 当前编辑目标的话重新克隆一份，两边不会分叉。
            drafts.delete(e.id);
            if (e.id === selected) { bindDraft(); labSync(true); }
            refreshDirty();
        });
    }
    // ---------- 左栏文件树：templates/ + 我的图 ----------
    // 两组条目：
    //   templates/  = 磁盘上的模板文件（目录行 → 列表视图，文件行 → 预览视图；右键「从模板新建」）
    //   我的图       = DOC 里用户自己的图（左键 → 打开右栏编辑，右键 复制 / 恢复出厂 / 删除）
    // 内置 ①–⑧ / 实验台 / 0 号输入不再单独成组：它们都在矩阵里有卡片，卡片点得到、右键也有同一套菜单。
    const treeEl = document.getElementById('tree');
    const treeNodes = new Map();         // id → { row, to, tn, tk }，给 syncTree 就地刷（不重建 DOM）
    function isUserChart(id) { return !isTemplate(id); }
    // 一条记录的"出厂来源"：模板就是它自己，「我的图」看 from（从哪个模板新建的）
    function originId(e) { return isTemplate(e.id) ? e.id : (e.from || ''); }
    function originPristine(e) { return PRISTINE.get(originId(e)) || null; }
    // 「恢复出厂」只在"有出厂快照可回 + 现在确实不一样"时才有意义（比较只看内容，不看 from）
    function canReset(id) {
        const e = entryOf(id);
        if (!e) return false;
        const p = originPristine(e);
        return !!p && contentJson(e) !== contentJson(p);
    }
    function treeRow(id) {
        const row = document.createElement('div');
        row.className = 'tnode' + (isTemplate(id) ? ' tpl' : '');
        const to = document.createElement('span'); to.className = 'to';
        const tn = document.createElement('span'); tn.className = 'tn';
        const tk = document.createElement('span'); tk.className = 'tk';
        row.append(to, tn, tk);
        row.title = isTemplate(id)
            ? '模板（非用户创建，只读）：左键打开看，右键「从模板新建」一份可编辑的副本'
            : '我的图：左键打开编辑，右键「复制 / 删除 / 恢复出厂」';
        row.tabIndex = 0;
        // 点的是 DOC 里的条目（不是磁盘文件）→ 中间面板先回到矩阵，那张卡片才在视野里
        const back = () => { if (OPEN.viewer !== 'grid') open({ file: '' }); };
        row.addEventListener('click', () => { back(); selectChart(id); scrollCardIntoView(id); });
        row.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); back(); selectChart(id); } });
        row.addEventListener('contextmenu', (ev) => { ev.preventDefault(); openRowMenu(row, id); });
        treeNodes.set(id, { row, to, tn, tk });
        return row;
    }
    function treeGroup(title, ids, hint) {
        const box = document.createElement('div');
        const th = document.createElement('div'); th.className = 'th';
        const t = document.createElement('span'); t.textContent = title;
        const cnt = document.createElement('span'); cnt.className = 'cnt'; cnt.textContent = String(ids.length);
        const h = document.createElement('span'); h.className = 'hint'; h.textContent = hint;
        th.append(t, cnt, h);
        box.appendChild(th);
        if (!ids.length) {
            const em = document.createElement('div'); em.className = 'empty';
            em.textContent = title === '我的图' ? '（空：在上面 templates/ 的某一行上右键「从模板新建」）' : '（无）';
            box.appendChild(em);
        }
        for (const id of ids) box.appendChild(treeRow(id));
        return box;
    }
    // 重建整棵树：只在结构变化（增删格 / 载入新文档）时调用；选中/标题/角标由 syncTree 就地刷。
    // 树只剩两组：磁盘上的 templates/（模板库）与「我的图」。
    // 原先那组「模板」（内置 ①–⑧ / 实验台 / 0 号输入）已并进 templates/：它们在矩阵里各有一张卡片，
    // 点卡片照样打开右栏、右键照样「从模板新建」，不必在树里再列一遍（树只留"能新建出图的来源"）。
    function buildTree() {
        treeNodes.clear();
        treeEl.innerHTML = '';
        const user = [];
        for (const c of DOC.charts) if (!isTemplate(c.id)) user.push(c.id);
        treeEl.appendChild(treeGroupTplFiles());      // 磁盘上的 templates/：目录 → 列表，文件 → 单视图
        treeEl.appendChild(treeGroup('我的图', user, '右键：复制/删除'));
        syncTree();
    }
    function syncTree() {
        for (const [id, n] of treeNodes) {
            const e = entryOf(id);
            if (!e) continue;
            n.row.classList.toggle('sel', id === selected);
            n.to.textContent = ordOf(id);
            n.tn.textContent = e.title;
            const pending = isUserChart(id) && draftDirty(id);
            const edited = isEdited(e);
            n.tk.textContent = (pending ? '✎' : '') + (edited ? '●' : '');
            n.tk.className = 'tk' + (pending ? ' p' : '');
        }
        syncTreeFiles();          // 模板文件行的选中态跟着 OPEN.file 走
    }
    function scrollCardIntoView(id) {
        const ch = cellOf(id);
        if (ch && ch.cell.scrollIntoView) ch.cell.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    // ---------- 中心面板路由：open({ file, panel, viewer }) ----------
    // 中间区域不再是"永远是矩阵"，它是一块可换视图的面板，装什么由 open() 决定：
    //   open({ file: 'templates/inv+zscore.json' }) → viewer=dspview     单个模板文件的预览视图
    //   open({ file: 'templates/' })               → viewer=dsplistview  模板目录的列表视图
    //   open({ file: '' })                         → viewer=grid         默认：整张图表矩阵
    // viewer 可显式传（校验白名单）；不传就按 file 形态推：以 / 结尾 = 目录 → 列表，否则 = 文件 → 单视图。
    // panel 目前只认 'center'（左栏是树、右栏是编辑器，都不走这套路由），传别的直接忽略。
    const TPL_DIR_FILE = 'templates/';
    const VIEWS = ['grid', 'dsplistview', 'dspview'];
    const LIST_C_H = 76, ONE_C_H = 200;      // 列表卡片预览 / 单文件大图各自的画布高
    let OPEN = { file: '', panel: 'center', viewer: 'grid' };
    const viewCharts = [];                   // 本视图自建的画布（grid 的格子归 cellCharts，不在这里）
    const TPLS = [];                         // /api/templates 拉回来的模板文件清单
    const tplCache = new Map();              // file → 模板（单文件接口取回的，列表里没有的那些）
    const treeFileNodes = new Map();         // file → 树里那一行，给 syncTreeFiles 就地刷选中态
    const crumbEl = document.getElementById('crumb');
    const listEl = document.getElementById('dsplist');
    const oneEl = document.getElementById('dspview');
    function viewerOf(file) { return !file ? 'grid' : (file.endsWith('/') ? 'dsplistview' : 'dspview'); }
    function fileNameOf(file) { const i = file.lastIndexOf('/'); return i < 0 ? file : file.slice(i + 1); }
    // 唯一的路由入口：改 OPEN → 重画中间面板 → 同步树上的选中态
    function open(spec) {
        const s = spec || {};
        const file = typeof s.file === 'string' ? s.file.trim() : '';
        if ((s.panel || 'center') !== 'center') return;          // 目前只有中间面板参与
        let v = s.viewer || viewerOf(file);
        if (VIEWS.indexOf(v) < 0) v = viewerOf(file);            // viewer 名不认识 → 按 file 重推
        OPEN = { file, panel: 'center', viewer: v };
        renderCenter();
    }
    function renderCenter() {
        clearViewCharts();
        grid.hidden = true; listEl.hidden = true; oneEl.hidden = true;
        if (OPEN.viewer === 'dsplistview') renderList();
        else if (OPEN.viewer === 'dspview') renderOne(OPEN.file);
        else setGridVisible(true);
        renderCrumb();
        syncTreeFiles();
        syncGlobalPlay();        // 换视图 = 换了一批可暂停的画布，全局按钮文案要重算
    }
    // 视图自建的画布要跟着视图一起消失：主循环只认 charts 一张表，不摘就会一直空算
    function clearViewCharts() {
        for (const ch of viewCharts) { const i = charts.indexOf(ch); if (i >= 0) charts.splice(i, 1); }
        viewCharts.length = 0;
    }
    // 矩阵视图进出：隐藏时把格子标成 hidden（主循环跳过，画布 display:none 算不出宽度），
    // 回来时逐块重量（隐藏期间宽度是 0，不重量会拿到 80 的最小宽画一帧变形图）
    function setGridVisible(on) {
        grid.hidden = !on;
        for (const ch of cellCharts) ch.hidden = !on;
        if (!on) return;
        for (const ch of cellCharts) {
            ch.w = fitCanvas(ch.cv, ch.h);
            if (ch.paused) paintShot(ch);          // 暂停的格子画的是存档快照，重建位图后要补回来
        }
    }
    // 面包屑：矩阵 › templates/ › 某文件。点前面任一段 = 往上一级（最后一段是当前位置，不可点）
    function renderCrumb() {
        crumbEl.textContent = '';
        const seg = (txt, file, now, title) => {
            const b = document.createElement('span');
            b.className = 'seg' + (now ? ' now' : '');
            b.textContent = txt;
            b.title = title || '';
            if (!now) b.addEventListener('click', () => open({ file }));
            crumbEl.appendChild(b);
            return b;
        };
        const sp = () => { const s = document.createElement('span'); s.className = 'sp'; s.textContent = '›'; crumbEl.appendChild(s); };
        seg('矩阵', '', OPEN.viewer === 'grid', '整张图表矩阵（默认视图）');
        if (OPEN.viewer === 'grid') { seg('📁 templates/', TPL_DIR_FILE, false, '打开模板目录的列表视图'); return; }
        sp();
        seg('templates/', TPL_DIR_FILE, OPEN.viewer === 'dsplistview', '模板目录的列表视图');
        if (OPEN.viewer === 'dspview') { sp(); seg(fileNameOf(OPEN.file), OPEN.file, true, OPEN.file); }
    }
    // 模板条目的"底部一条"= 参数条 + 播放按钮（与矩阵格子完全同构：画面在上、控件在下）。
    // 参数只改内存里这一条链的预览值，不落盘 —— 模板是磁盘上的只读文件，要固化就「从模板新建」。
    function buildTplFoot(host, t, ch) {
        const foot = document.createElement('div'); foot.className = 'foot';
        const pbar = document.createElement('div'); pbar.className = 'pbar';
        pbar.title = '调的是内存里的预览参数，不写回 templates/ 里的文件';
        // 参数条上的点击不该冒泡成"打开这条"（卡片整体可点 = 打开链路视图）
        pbar.addEventListener('click', (ev) => ev.stopPropagation());
        const prow = document.createElement('div'); prow.className = 'prow';
        const playBtn = document.createElement('button');
        playBtn.type = 'button'; playBtn.className = 'pb';
        playBtn.addEventListener('click', (ev) => { ev.stopPropagation(); setPaused(t.file, !isPaused(t.file)); });
        const rstBtn = document.createElement('button');
        rstBtn.type = 'button'; rstBtn.className = 'pb'; rstBtn.textContent = '↺';
        rstBtn.title = '把调过的参数还原成文件里写的那些';
        rstBtn.addEventListener('click', (ev) => { ev.stopPropagation(); resetTplParams(t); });
        prow.append(playBtn, rstBtn);
        foot.append(pbar, prow);
        host.appendChild(foot);
        ch.pbar = pbar; ch.playBtn = playBtn;
        buildParams(pbar, chartParamSpecs(ch), () => { ch.pipeEl.textContent = pipeSummary(ch); });
        renderPlayBtn(ch);
        return foot;
    }
    // 丢掉内存里改过的那份 stages，下一次 tplStages 会重新按文件内容建一份
    function resetTplParams(t) { delete t._stages; renderCenter(); }
    // 视图重建出来的画布要接回存档里的暂停状态：置 paused（主循环跳过）+ 把快照画回位图
    function bindViewPause(ch) {
        ch.paused = isPaused(keyOf(ch));
        if (ch.paused) paintShot(ch);
        renderPlayBtn(ch);
    }
    // dsplistview：templates/ 目录的列表。一格 = 一个模板文件，小画布用实时数据跑同一条链
    function renderList() {
        listEl.hidden = false;
        listEl.textContent = '';
        if (!TPLS.length) {
            const e = document.createElement('div'); e.className = 'tpl-empty';
            e.textContent = 'templates/ 下没有模板文件（后端 /api/templates 也没读到）';
            listEl.appendChild(e);
            return;
        }
        for (const t of TPLS) {
            const stages = tplStages(t);
            const card = document.createElement('div');
            card.className = 'tcard' + (t.file === OPEN.file ? ' sel' : '');
            const nf = document.createElement('div'); nf.className = 'tfile'; nf.textContent = t.file;
            const tt = document.createElement('div'); tt.className = 'ttitle'; tt.textContent = t.title;
            const pp = document.createElement('div'); pp.className = 'pipe'; pp.textContent = pipeSummary({ stages });
            const cv = document.createElement('canvas'); cv.className = 'mx';
            const ds = document.createElement('div'); ds.className = 'tdesc';
            ds.textContent = t.desc || '（无说明）';
            card.append(nf, tt, pp, cv);
            card.title = '打开 ' + t.file;
            card.addEventListener('click', () => open({ file: t.file }));
            listEl.appendChild(card);
            const ch = {
                file: t.file, stages, out: new Float32Array(SFM_PC * CHART_N), w: 0, h: LIST_C_H,
                cv, ctx: cv.getContext('2d'), pipeEl: pp, card, isView: true,
            };
            buildTplFoot(card, t, ch);
            card.appendChild(ds);
            ch.w = fitCanvas(cv, LIST_C_H);
            bindViewPause(ch);
            charts.push(ch); viewCharts.push(ch);
        }
    }
    // dspview：单个模板文件的预览视图 —— 大画布 + 参数条/播放按钮 + 逐级算子 + 三个入口按钮。
    // 只读（模板是磁盘上的文件，不进 DOC）：要固化就「从模板新建」克隆一份进「我的图」。
    async function renderOne(file) {
        oneEl.hidden = false;
        oneEl.textContent = '';
        const load = document.createElement('div'); load.className = 'tpl-empty'; load.textContent = '读取 ' + file + ' …';
        oneEl.appendChild(load);
        const t = await getTemplate(file);
        // 期间用户又点了别的 → 这次渲染作废（renderCenter 已经把视图切成新的了）
        if (!t || OPEN.file !== file || OPEN.viewer !== 'dspview') return;
        const stages = tplStages(t);
        oneEl.textContent = '';
        const nf = document.createElement('div'); nf.className = 'vfile'; nf.textContent = file;
        const vh = document.createElement('div'); vh.className = 'vh'; vh.textContent = t.title;
        const vd = document.createElement('div'); vd.className = 'vdesc'; vd.textContent = t.desc || '（无说明）';
        const pp = document.createElement('div'); pp.className = 'pipe'; pp.textContent = pipeSummary({ stages });
        const cv = document.createElement('canvas'); cv.className = 'mx';
        const stbox = document.createElement('div'); stbox.className = 'stages';
        stages.forEach((s, i) => {
            const chip = document.createElement('span');
            chip.className = 'st' + (s.on ? '' : ' off');
            const op = OPS[s.id];
            const fp = Object.entries(s.p).map(([k, v]) => `${k}=${(+v).toFixed(1)}`).join(',');
            chip.textContent = `${ordLabel(i + 1)} ${op.label}${fp ? '(' + fp + ')' : ''}${op.kind === 'vector' ? ' ⧉' : ''}`;
            chip.title = (op.kind === 'vector' ? '整条 12 音级一起算（跨音级上下文）' : '逐音级独立映射') + (s.on ? '' : ' · 这一级已停用');
            stbox.appendChild(chip);
        });
        const tools = document.createElement('div'); tools.className = 'vtools';
        const mk = (txt, title, fn) => {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'lbtn'; b.textContent = txt; b.title = title;
            b.addEventListener('click', fn);
            tools.appendChild(b);
            return b;
        };
        mk('从模板新建', '按当前这份（含你调过的参数）克隆一份可编辑的「我的图」，并回到矩阵', () => newFromStagesFile(t));
        mk('← 模板列表', '回到 templates/ 的列表视图', () => open({ file: TPL_DIR_FILE }));
        mk('✕ 回到矩阵', '关掉视图，回到整张图表矩阵', () => open({ file: '' }));
        const ch = {
            file, stages, out: new Float32Array(SFM_PC * CHART_N), w: 0, h: ONE_C_H,
            cv, ctx: cv.getContext('2d'), pipeEl: pp, card: oneEl, isView: true,

        oneEl.append(nf, vh, vd, pp, cv);
        buildTplFoot(oneEl, t, ch);       // 参数条 + 播放/还原：与列表卡片、矩阵格子同一套
        oneEl.append(stbox, tools);

        bindViewPause(ch);
        charts.push(ch); viewCharts.push(ch);
    }
    // 模板的 stages 过一遍 sanitizeStages 再进管道：磁盘文件是手写的，非法 id / 越界参数在这里纠正
    function tplStages(t) { if (!t._stages) t._stages = sanitizeStages(t.stages) || []; return t._stages; }
    async function getTemplate(file) {
        const hit = TPLS.find((t) => t.file === file) || tplCache.get(file);
        if (hit) return hit;
        const name = file.indexOf('/') >= 0 ? file.slice(file.lastIndexOf('/') + 1) : file;
        try {
            const res = await fetch('/api/templates/' + encodeURIComponent(name), { cache: 'no-store' });
            if (!res.ok) return null;
            const b = await res.json().catch(() => null);
            const t = b && b.template;
            if (!t) return null;
            tplCache.set(t.file, t);
            return t;
        } catch (e) { return null; }
    }
    // 目录清单从后端拉（templates/ 在磁盘上，前端不内嵌）；失败就留空，树里显示"（无）"
    async function loadTemplates() {
        try {
            const res = await fetch('/api/templates', { cache: 'no-store' });
            const b = await res.json().catch(() => null);
            const list = (b && Array.isArray(b.templates)) ? b.templates : [];
            TPLS.length = 0;
            for (const t of list) if (t && typeof t.file === 'string') TPLS.push(t);
        } catch (e) { TPLS.length = 0; }
        buildTree();
    }
    // 这份文件的链若与某个内置出厂快照同形 → 返回那个 id：新建的副本记下 from，
    // 之后「恢复出厂」才有得可回（磁盘文件本身没有"出厂"概念，改了就是改了）
    function pristineIdForFile(t) {
        const key = JSON.stringify(tplStages(t).map((s) => ({ id: s.id, on: s.on, p: sortObj(s.p) })));
        for (const [id, p] of PRISTINE) {
            if (JSON.stringify(p.stages.map((s) => ({ id: s.id, on: s.on, p: sortObj(s.p) }))) === key) return id;
        }
        return '';
    }
    // 「从模板新建」的磁盘版：把这份文件的链克隆成一份「我的图」（文件本身不动），随后回矩阵看它
    function newFromStagesFile(t) {
        const stages = tplStages(t).map(cloneStage);
        const title = t.title || fileNameOf(t.file);
        const dup = DOC.charts.some((c) => !isTemplate(c.id) && c.title === title);
        addUserChart({
            title: title + (dup ? ' 副本' : ''), desc: t.desc || '', stages,
            from: pristineIdForFile(t) || undefined,

        open({ file: '' });

    // ---------- 树里的模板目录：目录行 → dsplistview，文件行 → dspview ----------
    function treeFileRow(file, label, cls) {

    function treeGroupTplFiles() {

    }
    function syncTreeFiles() {

    }
    // ---------- 右键菜单：模板与「我的图」两种菜单 ----------
    // 挂在 body 上：行/卡片在布局流里，浮层若作为它们的子元素会被行高/栅格布局挤压变形。
    const menuEl = document.createElement('div');
    menuEl.className = 'cmenu';
    menuEl.hidden = true;
    document.body.appendChild(menuEl);
    function closeMenu() { menuEl.hidden = true; }
    function menuItemsFor(id) {
        const e = entryOf(id);
        if (!e) return [];
        if (isTemplate(id)) {
            const items = [['从模板新建', '把这一条模板深克隆成一份可编辑的「我的图」，并跳到它', () => newFromTemplate(id), '']];
            if (canReset(id)) items.push(['恢复出厂', '把这一条恢复成内置出厂状态（改过的模板才有这一项）', () => resetToDefault(id), '']);
            return items;
        }
        const items = [['复制', '深克隆成一份新的「我的图」，并跳到该副本；本份不动', () => cloneAsNew(id), '']];
        if (canReset(id)) {
            items.push(['恢复出厂', `把这一份恢复成模板 ${ordOf(e.from)} 的出厂状态`, () => resetToDefault(id), '']);
        }
        items.push(['删除', '从「我的图」里移除（按保存才落盘，刷新可恢复）', () => deleteChart(id), 'danger']);
        return items;
    }
    function openRowMenu(anchor, id) { openMenuAt(anchor, menuItemsFor(id)); }
    // 模板文件行的菜单：打开视图 + 「从模板新建」—— 旧「模板」那组行的功能现在落在这一行上。
    // 目录行没有"从模板新建"（目录不是一条链），只有「打开列表」。
    function fileMenuItems(file) {
        const t = TPLS.find((x) => x.file === file);
        const isDir = file.endsWith('/');
        const items = [[isDir ? '打开列表' : '预览DSP',
            isDir ? 'templates/ 的列表视图（dsplistview）' : `打开 ${file} 的预览视图（dspview）`,
            () => open({ file }), '']];
        if (t) items.push(['从模板新建', '把这份模板克隆成一份可编辑的「我的图」', () => newFromStagesFile(t), '']);
        return items;
    }
    function openFileMenu(anchor, file) { openMenuAt(anchor, fileMenuItems(file)); }
    function openMenuAt(anchor, items) {
        if (!items || !items.length) return;
        menuEl.textContent = '';
        for (const [txt, tip, fn, cls] of items) {
            const b = document.createElement('button');
            b.type = 'button'; b.textContent = txt; b.title = tip;
            if (cls) b.className = cls;

        }
        menuEl.hidden = false;
