<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>参数化矩阵 · 管道位置 × 变换函数</title>
<style>
    body { margin: 0; background: #070c1a; color: #bcc8e8; font-family: 'Segoe UI', sans-serif; }
    .topbar {
        display: flex; align-items: center; gap: 16px; padding: 8px 12px;
        background: #0b1226; border-bottom: 1px solid rgba(255,255,255,0.08);
        font-size: 12px; flex-wrap: wrap;
    }
    .topbar .t { font-weight: 700; }
    .topbar a { color: #8fa2c8; font-size: 12px; }
    .status { color: #8fa2c8; font-size: 12px; }
    /* 参数条与控件（可复用：buildParams 按 spec 渲染，图表不手写控件） */
    .pbar { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
    .ctl { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #8fa2c8; white-space: nowrap; }
    .ctl input[type=range] { width: 90px; accent-color: #4ae0ff; }
    .ctl select { background: #0a1022; color: #bcc8e8; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; font-size: 12px; }
    .ctl .v { min-width: 36px; color: #e8eefc; font-variant-numeric: tabular-nums; }
    /* 全局图例：12 音级配色只画一次，各图不再逐线渲染音名（否则 8×12 个小字互相压叠） */
    .legend-row { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 6px 12px; background: #0b1226; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: #8fa2c8; }
    .legend-row .sw { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
    /* 图表矩阵单元格：高度写死 + 参数条移到画布下方并 margin-top:auto
       → 8 张图的画布 y 坐标完全一致，横向逐行比对。宽度不写死，由 grid 列宽自适应 */
    /* 主体左右分栏：左 grid（8 张固定图），右实验台。实验台不进 grid，
       8 图的固定高/对齐不变式不受影响。
       窄屏（手机等）放不下"grid 一列 + 实验台"时，靠 flex-wrap 自动把实验台换行到页面末尾，
       不需要维护断点：换行阈值 = grid 基准 280 + 实验台 372 + gap 10 + wrap padding 24 = 686px */
    .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; padding: 10px 12px 16px; }
    /* grid 用 auto-fill 的 1fr 列：列宽全局一致，末行不会被拉伸成另一批宽度 → 跨行也能对齐。
       minmax(280px,·) 让列数随可用宽度自适应。flex 基准取 280（= 一列的最小宽），
       基准和超过容器就换行，实验台自动落到末尾。min-width:0 允许被压到内容宽以下 */
    .grid { flex: 1 1 280px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; align-content: start; }
    /* 卡片外壳：8 张固定图（.cell）与实验台（.lab）共用同一套外观 —— 背景/圆角/描边/纵向流。
       实验台的"上半身"（标题 + 副标题 + 画布 = 输出结果）与一个 cell 的上半身完全同构，
       下半身是级联列表，对应 cell 里 .pbar 那条带所处的位置。 */
    .cell, .lab { box-sizing: border-box; background: #0e1630; border-radius: 8px; border: 1px solid rgba(255,255,255,0.22); display: flex; flex-direction: column; padding: 6px 8px 8px; }
    .cell { height: 210px; }
    .lab { flex: 1 1 372px; min-width: 0; max-width: 372px; align-self: flex-start; }
    /* 吸附 + 栏内滚动只在并排时启用：换行到下方后 sticky 会把整块钉在视口顶、max-height 又逼出内滚动，
       在手机上反而难用。阈值 686 与上面 flex 基准之和一致，两处数字要同步改 */
    @media (min-width: 686px) {
        .lab { position: sticky; top: 10px; max-height: calc(100vh - 24px); overflow-y: auto; scrollbar-gutter: stable; }
    }
    /* 标题 / 副标题：cell 与实验台上半身共用 */
    .cell .hd, .lab .hd { flex: none; font-size: 14px; font-weight: 700; color: #bcc8e8; }
    .cell .hd { cursor: help; }                              /* cell 标题带 title 说明，实验台标题没有 */
    .cell .pipe, .lab .pipe { flex: none; margin: 2px 0 4px; font-size: 11px; color: #8fa2c8; font-family: Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    canvas.mx { flex: none; display: block; width: 100%; height: 132px; background: #0a1022; border-radius: 6px; }
    /* 参数条贴单元格底部：有无参数都占同一条带（选择器收窄到 .cell，避免影响顶栏的 #globalBar） */
    .cell .pbar { margin-top: auto; }
    /* 下半身的工具条（加一级 / 清空）—— 与级联列表同属下半身，不进标题行 */
    .ltools { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    .lbtn { background: #141d34; color: #8fa2c8; border: 1px solid rgba(255,255,255,0.10); border-radius: 6px; font-size: 12px; padding: 3px 12px; cursor: pointer; }
    .lbtn:hover { background: #263a60; color: #fff; }
    /* 级联逐级出图，且每张卡自带全部编排控件（收起也可用）：
       头部 = 收起 / 启用 / 选算子 / 参数 hint / 上移下移删除；身体 = 参数控件 + 该级输出画布 */
    .lcharts { display: flex; flex-direction: column; gap: 6px; }
    .lcharts:empty::after { content: '（暂无级联，点上方"+ 加一级"开始）'; font-size: 12px; color: #5a6c94; }
    .lcard { background: #0a1022; border-radius: 6px; padding: 4px 6px 6px; border: 1px solid rgba(255,255,255,0.22); }
    .lcard-hd { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8fa2c8; }
    .lcard-hd .caret { flex: none; width: 16px; height: 18px; padding: 0; background: none; border: 0; color: #8fa2c8; font-size: 11px; line-height: 1; cursor: pointer; transition: transform 0.12s; }
    .lcard.collapsed .lcard-hd .caret { transform: rotate(-90deg); }
    .lcard-hd .en { flex: none; margin: 0; width: 13px; height: 13px; accent-color: #4ae0ff; cursor: pointer; }
    .lcard-hd .sel { flex: 0 1 auto; min-width: 0; max-width: 128px; background: #070c1a; color: #bcc8e8; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; font-size: 11px; padding: 1px 2px; cursor: pointer; }
    .lcard-hd .ord { flex: none; font-weight: 700; color: #e8eefc; }
    .lcard-hd .op { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: Consolas, monospace; color: #5a6c94; }
    .lcard.skip .lcard-hd .op { text-decoration: line-through; }
    .lcard.skip { opacity: 0.5; }                          /* 该级已停用：出图与上一级相同 */
    .lcard-hd .sops { flex: none; display: flex; gap: 3px; }
    .lcard-hd .sops button { width: 22px; height: 20px; padding: 0; background: #141d34; color: #8fa2c8; border: 1px solid rgba(255,255,255,0.10); border-radius: 4px; font-size: 11px; line-height: 1; cursor: pointer; }
    .lcard-hd .sops button:hover:not(:disabled) { background: #263a60; color: #fff; }
    .lcard-hd .sops button:disabled { opacity: 0.3; cursor: default; }
    .lcard-hd .sops button.del:hover { background: #6b2440; }
    .lcard-body { margin-top: 4px; }
    .lcard.collapsed .lcard-body { display: none; }
    .lctl { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="topbar">
    <span class="t">参数化矩阵 · 管道位置 × 变换函数</span>
    <span class="pbar" id="globalBar"></span>
    <span class="status" id="status">⏳ 连接后端…</span>
    <a href="/">← 主面板</a>
</div>
<div class="legend-row" id="legend"></div>
<div class="wrap">
    <div class="grid" id="grid"></div>
    <div class="lab">
        <div class="hd">⑨ 自由探索 · 级联</div>
        <div class="pipe" id="labPipe"></div>
        <canvas class="mx" id="labCanvas"></canvas>
        <div class="ltools">
            <button class="lbtn" id="labAdd" type="button">+ 加一级</button>
            <button class="lbtn" id="labClear" type="button">清空</button>
        </div>
        <div class="lcharts" id="labCharts"></div>
    </div>
</div>
<script>
(function () {
    'use strict';

    // ---------- 常量（与主面板同一数据口径） ----------
    const CHART_SEC = 5, CHART_HZ = 50, CHART_N = CHART_SEC * CHART_HZ, SFM_PC = 12;
    const KEY_LO = 21, KEY_HI = 108;
    // A4 音准参考：以主面板的 localStorage['a4Ref'] 为准（同源跨页共享），本页不重复提供切换控件。
    // 主面板改 A4 后 storage 事件在同源其他页面触发 → 跟随；pcBins 缓存键含 A4，下一帧自动重建映射。
    let A4 = (() => { try { return parseFloat(localStorage.getItem('a4Ref')) || 440; } catch (e) { return 440; } })();
    window.addEventListener('storage', (ev) => {
        if (ev.key !== 'a4Ref') return;
        const v = parseFloat(ev.newValue) || 440;
        if (v !== A4) A4 = v;
    });
    const SFM_SPAN = 70;   // 字节→dB 映射跨度（MIN_DB -100 / MAX_DB -30）
    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    // 十二音级配色（OKLCH 等亮度，逐字复制自主面板）
    const SEMI_L = 0.75, SEMI_C = 0.13;
    function oklchRgb(L, C, Hdeg) {
        const h = Hdeg * Math.PI / 180;
        const A = C * Math.cos(h), B = C * Math.sin(h);
        const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3;
        const m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3;
        const s = (L - 0.0894841775 * A - 1.2914855480 * B) ** 3;
        const gm = (x) => { x = Math.max(0, Math.min(1, x)); return x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055; };
        return [
            Math.round(gm(+4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s) * 255),
            Math.round(gm(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s) * 255),
            Math.round(gm(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s) * 255)
        ];
    }
    const SEMI_RGB = Array.from({ length: SFM_PC }, (_, i) => oklchRgb(SEMI_L, SEMI_C, i * 30));
    // ---------- 管道计算（纯函数区，可独立数值测试） ----------
    // 管道：1-v（反相）→ 按序执行 ch.stages 的每一级 → 屏幕
    // 变换注册表 OPS，两种 kind：
    //   scalar：逐音级独立映射 f(x,p)→x'（幂/log/tanh…）
    //   vector：拿整条 12 音级向量 f(a,p)→a（就地改写）。min/max、μ/σ、排秩这类必须跨音级看全貌的
    //           归一化只有靠跨音级上下文才能算，通用链装不下，所以显式区分而不是硬塞进 scalar。
    // 每级自带 params spec（{key,label,type,min,max,step,def}），由 buildParams 统一渲染成控件。
    // 一级 = { id, on, p }：id 指向 OPS，on=false 跳过，p 存该级实参（默认值由 buildParams 填）。
    const OPS = {
        // 反相：原本写死在 computeChart 里的固定第一步，现在降级为普通可选算子（可删、可换序、可重复）。
        inv:  { label: '1-v 反相', kind: 'scalar', f: (x) => 1 - x, params: [] },
        id:    { label: '恒等', kind: 'scalar', f: (x) => x, params: [] },
        pow:   { label: '幂', kind: 'scalar', f: (x, p) => Math.pow(Math.max(0, x), p.n),
                 params: [{ key: 'n', label: 'n', type: 'range', min: 0.1, max: 4, step: 0.1, def: 2 }] },
        log:   { label: 'log', kind: 'scalar', f: (x) => Math.log(Math.max(0, x) + 1e-3), params: [] },
        tanh:  { label: 'tanh', kind: 'scalar', f: (x, p) => 0.5 + 0.5 * Math.tanh(p.k * (x - 0.5)) / Math.tanh(p.k / 2),
                 params: [{ key: 'k', label: 'k', type: 'range', min: 1, max: 20, step: 0.5, def: 6 }] },
        // log01：0~1 上做 log 后线性重映射回 0~1（0→0、1→1）
        log01: { label: 'log(0~1)', kind: 'scalar', f: (x) => { const e = 1e-3; return (Math.log(e + (1 - e) * x) - Math.log(e)) / -Math.log(e); }, params: [] },
        rescale: { label: '重缩放', kind: 'vector', f: (a) => {
            let mn = Infinity, mx = -Infinity;
            for (let i = 0; i < SFM_PC; i++) { const v = a[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
            const rg = mx - mn;
            for (let i = 0; i < SFM_PC; i++) a[i] = rg > 1e-9 ? (a[i] - mn) / rg : 0.5;   // 极差≈0 → 居中
        }, params: [] },
        zscore: { label: 'z-score', kind: 'vector', f: (a, p) => {
            let sum = 0;
            for (let i = 0; i < SFM_PC; i++) sum += a[i];
            const mean = sum / SFM_PC;
            let q = 0;
            for (let i = 0; i < SFM_PC; i++) { const d = a[i] - mean; q += d * d; }
            const sd = Math.sqrt(q / SFM_PC), zm = p.zMax || 2;
            for (let i = 0; i < SFM_PC; i++) {          // 均值/σ 先算完再写，避免边写边读
                const z = sd > 1e-9 ? (a[i] - mean) / sd : 0;
                a[i] = (Math.max(-zm, Math.min(zm, z)) + zm) / (2 * zm);
            }
        }, params: [{ key: 'zMax', label: '±z', type: 'range', min: 1, max: 4, step: 0.1, def: 2 }] },
        rank: { label: '分位秩', kind: 'vector', f: (a) => {
            let mn = Infinity, mx = -Infinity;
            for (let i = 0; i < SFM_PC; i++) { const v = a[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
            if (mx - mn <= 1e-9) { for (let i = 0; i < SFM_PC; i++) a[i] = 0.5; return; }
            for (let i = 0; i < SFM_PC; i++) rankTmp[i] = a[i];   // 排秩要读原值：先快照再写回
            for (let i = 0; i < SFM_PC; i++) {
                const x = rankTmp[i];
                let less = 0, equal = 0;
                for (let q = 0; q < SFM_PC; q++) {
                    if (rankTmp[q] < x - 1e-12) less++;
                    else if (rankTmp[q] <= x + 1e-12) equal++;
                }
                a[i] = (less + (equal - 1) / 2) / (SFM_PC - 1);   // 并列取平均秩
            }
        }, params: [] },
    };
    // 一级工厂：id + 启用位；参数默认值由 buildParams 按 spec 填进 p
    const stage = (id) => ({ id, on: true, p: {} });
    // 图表矩阵定义：按文档"常用组合矩阵"挑选 位置 × 函数 的组合，统一表达为有序级联
    const CHART_DEFS = [
        { title: '① 基线 · 重缩放', desc: '取反后逐时刻用 12 音级 min/max 拉伸：丝带上下缘始终贴边（满窗 K 点写入时冻结；主面板极差图走每帧滚动窗，仅最左 K−1 个点的窗口不满，两者其余点一致）', stages: [stage('inv'), stage('rescale')] },
        { title: '② 归一化前 × 幂', desc: '先 x^n 再重缩放：n>1 放大高值差异（强调峰值），n<1 温和拉伸低值', stages: [stage('inv'), stage('pow'), stage('rescale')] },
        { title: '③ 归一化前 × log', desc: '先 log(x+1e-3) 再重缩放：强力拉伸低值、压缩高值（音频 dBFS 思路）', stages: [stage('inv'), stage('log'), stage('rescale')] },
        { title: '④ 归一化内 · z-score', desc: '逐时刻标准化 (x−μ)/σ，再按 ±zMax 夹紧线性映射 0~1：看偏离均值几个 σ', stages: [stage('inv'), stage('zscore')] },
        { title: '⑤ 归一化内 · 分位秩', desc: '逐时刻按 12 音级大小排秩 0~1（并列取平均秩）：强制均匀分布、抗异常值，只看相对位次', stages: [stage('inv'), stage('rank')] },
        { title: '⑥ 归一化后 × 幂', desc: '重缩放后再 x^n：锐化概率形状，低值压得更死、峰值保持', stages: [stage('inv'), stage('rescale'), stage('pow')] },
        { title: '⑦ 归一化后 × tanh', desc: '重缩放后过 tanh：0/1 端点不动、中段放大、两端压缩（k 越大中段越陡）', stages: [stage('inv'), stage('rescale'), stage('tanh')] },
        { title: '⑧ 归一化后 × log', desc: '重缩放后 log 并重映射回 0~1：温和拉伸低段（0→0、1→1）', stages: [stage('inv'), stage('rescale'), stage('log01')] },
    ];

    const chartCount = CHART_N;   // 固定满窗（滚动示波器式，与主面板一致）
    const pipeTmp = new Float64Array(SFM_PC);   // 单点 12 音级工作区（computeChart 同步调用，不可跨图复用）
    const rankTmp = new Float64Array(SFM_PC);   // rank 就地改写前先快照原值

    // 单图管道计算：sfmLines（12×CHART_N 滑窗合成的 SFM）→ ch.out（同布局，0~1 归一值）
    // stages 是唯一事实来源：固定图与下方实验台共用同一条执行路径。
    // 反相不再写死在这里 —— 它是 OPS 里的普通算子 inv，由各图自己的 stages 决定要不要、放在哪。
    function computeChart(ch, sfmLines) {
        const out = ch.out, stages = ch.stages;
        for (let p = 0; p < chartCount; p++) {
            // 1) 取原始 SFM（不再预反相）
            for (let pc = 0; pc < SFM_PC; pc++) pipeTmp[pc] = sfmLines[pc * CHART_N + p];
            // 2) 按序执行各级：scalar 逐音级映射，vector 整条一起看
            for (let s = 0; s < stages.length; s++) {
                const st = stages[s];
                if (!st.on) continue;
                const op = OPS[st.id];
                if (op.kind === 'scalar') for (let pc = 0; pc < SFM_PC; pc++) pipeTmp[pc] = op.f(pipeTmp[pc], st.p);
                else op.f(pipeTmp, st.p);
            }
            // 3) 夹到 0~1 上屏（归一化后变换也在此之前跑完，与旧实现同序）
            for (let pc = 0; pc < SFM_PC; pc++) out[pc * CHART_N + p] = Math.max(0, Math.min(1, pipeTmp[pc]));
        }
    }
    // ---------- 参数控件工厂（可复用：fn/norm 只声明 params spec 即得控件，防代码膨胀） ----------
    // specs: [{key,label,type:'range'|'number'|'select',min,max,step,def,options,dst}]
    //   dst = 参数写入的目标对象（如某一级 stage.p）；onChg 修改后回调（刷新管道摘要等）
    function buildParams(container, specs, onChg) {
        container.innerHTML = '';
        for (const spec of specs) {
            // 幂等：只在缺键时填默认值。实验台每次重绘都会重跑本函数，
            // 若每次都重置，用户调好的参数会被旁路的改动（停用/换序）冲掉。
            if (!(spec.key in spec.dst)) spec.dst[spec.key] = spec.def;
            const lab = document.createElement('label');
            lab.className = 'ctl';
            lab.textContent = spec.label + ' ';
            let input;
            if (spec.type === 'select') {
                input = document.createElement('select');
                for (const o of spec.options) {
                    const op = document.createElement('option');
                    op.value = o.v; op.textContent = o.t; input.appendChild(op);
                }
            } else {
                input = document.createElement('input');
                input.type = spec.type === 'number' ? 'number' : 'range';
                if (spec.min != null) input.min = spec.min;
                if (spec.max != null) input.max = spec.max;
                if (spec.step != null) input.step = spec.step;
            }
            input.value = spec.def;
            const valEl = document.createElement('span');
            valEl.className = 'v';
            valEl.textContent = typeof spec.def === 'number' ? (+spec.def).toFixed(2) : String(spec.def);
            input.addEventListener('input', () => {
                let v = input.value;
                if (spec.type !== 'select') {
                    v = parseFloat(v);
                    if (spec.min != null) v = Math.max(spec.min, v);

    // 某图的全部参数 spec：按 stages 顺序把每级的 params 摊平（级位由顺序表达，不再加位置前缀）
    function chartParamSpecs(ch) {
        const specs = [];
        for (const st of ch.stages) {

        }
        return specs;
    }
    // 管道摘要（图标题下方等宽小字，参数/顺序/启用状态改动即时刷新）
    // vector 级加花括号标出（整条链的跨音级断点），停用级用删除线标出（不参与执行）
    function pipeSummary(ch) {
        if (!ch.stages.length) return '原始 SFM → 屏幕';   // 0 号输入：stages 为空 = 不做任何变换
        const parts = [];
        for (const st of ch.stages) {
            const op = OPS[st.id];
            const fp = Object.entries(st.p).map(([k, v]) => `${k}=${(+v).toFixed(1)}`).join(',');
            const txt = fp ? `${op.label}(${fp})` : op.label;
            const wrapped = op.kind === 'vector' ? `{${txt}}` : `[${txt}]`;
            parts.push(st.on ? wrapped : `~~${txt}~~`);
        }

    // ---------- 数据源：与主面板相同的 SSE 流（/stream），逐音级 SFM 滑窗合成 ----------
    const statusEl = document.getElementById('status');
    let freqData = null, binFreqs = null;
    let pcBins = null, pcBinsKey = '';
    function ensurePcBins() {
        if (!freqData || !binFreqs) return;
        const key = binFreqs.length + ':' + A4;
        if (pcBinsKey === key && pcBins) return;
        pcBinsKey = key;
        // 统一按"bin → 最近的音 → 音级"分拣（与后端 OnsetGate / 主面板 CQT 口径一致）
        pcBins = Array.from({ length: SFM_PC }, () => []);
        for (let i = 0; i < binFreqs.length; i++) {
            const note = Math.round(69 + 12 * Math.log2(binFreqs[i] / A4));
            if (note < KEY_LO || note > KEY_HI) continue;
            pcBins[((note % 12) + 12) % 12].push(i);
        }
    }
    // 每采样逐音级 SFM 统计量（Σln m / Σm / n）环形缓冲；显示端按窗 K 滑窗合成 SFM
    const sfmSl = new Float64Array(SFM_PC * CHART_N);
    const sfmSa = new Float64Array(SFM_PC * CHART_N);
    const sfmN  = new Float32Array(SFM_PC * CHART_N);
    const sfmLines = new Float32Array(SFM_PC * CHART_N);   // 显示序缓存 = 冻结的 sfmDisp 重排
    const sfmDisp = new Float32Array(SFM_PC * CHART_N);    // 写入时冻结的显示 SFM（通道主序，下标 pc*CHART_N+idx）
    let sfmWinK = 10;                 // 平坦度时间窗（采样数，50Hz；由全局控件改秒数；写入时冻结，改窗只影响新采样）
    let chartWrite = 0, chartAccum = 0, isRunning = false, lastTs = 0;
    // 写入时冻结合成：idx 采样的显示 SFM 按当时窗 K 算一次，此后永不变。
    // 旧的显示端滑窗在左边界截断（最左 K−1 个点窗口不满、随点左移窗口继续变短 →
    // 历史值被改写、左端图像变形），且老样本的历史槽位已被新数据覆盖、显示端无法补算，故移除。
    function freezeSfmDisp(idx) {
        const K = Math.max(1, Math.min(CHART_N, sfmWinK));
        for (let pc = 0; pc < SFM_PC; pc++) {

            for (let k = 0; k < K; k++) {

            chartAccum -= 1 / CHART_HZ;

                for (let k = 0; k < bins.length; k++) {

    function sfmFillLines() {

            const base = pc * CHART_N;

            const msg = JSON.parse(ev.data);
            if (msg.err) { statusEl.textContent = '❌ ' + msg.err; isRunning = false; return; }
            const bin = atob(msg.s);
            if (!freqData || freqData.length !== bin.length) freqData = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) freqData[i] = bin.charCodeAt(i);
            if (msg.freqs) {
                if (!binFreqs || binFreqs.length !== msg.freqs.length) binFreqs = new Float64Array(msg.freqs.length);
                for (let i = 0; i < msg.freqs.length; i++) binFreqs[i] = msg.freqs[i];
            } else {
                if (!binFreqs || binFreqs.length !== bin.length) binFreqs = new Float64Array(bin.length);
                for (let i = 0; i < bin.length; i++) binFreqs[i] = (i + 0.5) * msg.binHz;

            statusEl.textContent = `${(msg.kind || 'fft').toUpperCase()} · ${binFreqs.length}bin · ${msg.fps}fps`;

    // 位图 = 实测宽 × dpr → CSS 尺寸与位图永远 1:1，任何宽度下文字都不发虚。
    const CH = 132, LAB_C_H = 112;   // 8 图 / 实验台输出图 / 实验台逐级图各自的画布高（输出图与 cell 同高）
    const grid = document.getElementById('grid');

    function fitCanvas(cv, h) {

        const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
        const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
        if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
        const ctx = cv.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    function labSanitize(raw) {

                applyCollapse(ch);
                labSave();
                if (!ch.hidden) ch.w = fitCanvas(cv, LAB_C_H);   // 收起时 display:none 无布局宽度，展开必须重量
                labelLabCharts();                                 // 收起后头部仍要显示 title + 参数 hint
            });
            if (!collapsed) ch.w = fitCanvas(cv, LAB_C_H);        // 收起的不测宽，留 0 等展开时重测
            else cv.style.height = LAB_C_H + 'px';                // 但 CSS 高照样定死，避免展开瞬间被 132px 撑一下
            charts.push(ch);      // 塞进同一个列表：主循环自动 compute + draw，无需特判
            labCharts.push(ch);
        }
        labelLabCharts();
    }
    // 收起态只由各级的 collapsed 决定。
    // 越界保护：labCharts 与 lab.stages 由 rebuildLabCharts 保持同长，
    // 这里再兜一层，避免任何漏 rebuild 的路径把整页打挂（标题刷新是纯展示，不该抛异常）
    function applyCollapse(ch) {
        const st = lab.stages[ch.labK - 1];
        if (!st) { ch.hidden = true; return; }
        ch.card.classList.toggle('collapsed', !!st.collapsed);
        ch.hidden = ch.card.classList.contains('collapsed');
    }
    // 只刷新 hint / 勾选 / skip 标记，不重建 DOM（拖参数滑杆、启停切换时用）
    function labelLabCharts() {
        labOut.stages = lab.stages.slice();
        for (const ch of labCharts) {
            applyCollapse(ch);
            const st = lab.stages[ch.labK - 1];
            if (!st) continue;
            const fp = Object.entries(st.p).map(([key, v]) => `${key}=${(+v).toFixed(1)}`).join(',');
            ch.opEl.textContent = fp ? `(${fp})` : '—';
            ch.enEl.checked = st.on;
            ch.card.classList.toggle('skip', !st.on);
        }
    }
    function labSync(rebuild) {
        labPipeEl.textContent = pipeSummary(lab);
        labSave();
        if (rebuild) rebuildLabCharts();
        else labelLabCharts();
    }

    document.getElementById('labAdd').addEventListener('click', () => {
        if (lab.stages.length >= 8) return;               // 12 音级 × 250 点，8 级已远超需要
        const pick = lab.stages.length ? lab.stages[lab.stages.length - 1].id : 'pow';
        // 新增的一级默认收起：它在链中间/末尾但不是"末级默认展开"那条，除非整条链只有它
        lab.stages.push({ id: pick, on: true, p: {}, collapsed: lab.stages.length !== 0 });
        labSync(true);
    });
    document.getElementById('labClear').addEventListener('click', () => { lab.stages = []; labSync(true); });
    rebuildLabCharts();
    labPipeEl.textContent = pipeSummary(lab);

    function drawChart(ch) {
        const c = ch.ctx, W = ch.w, H = ch.h;
        c.clearRect(0, 0, W, H);
        c.fillStyle = '#0a1022';
        c.fillRect(0, 0, W, H);
        const padL = 14, padR = 4, padT = 5, padB = 12;
        const iw = W - padL - padR, ih = H - padT - padB;
        c.font = '9px sans-serif';
        c.textAlign = 'left';
        for (let v = 0; v <= 1.001; v += 0.25) {
            const y = Math.round(padT + ih * (1 - v)) + 0.5;
            c.beginPath(); c.moveTo(padL, y); c.lineTo(W - padR, y);
            c.strokeStyle = (v === 0 || v === 1) ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.06)';
            c.lineWidth = 1; c.stroke();
            if (v === 0 || v === 0.5 || v === 1) {
                c.fillStyle = 'rgba(114,134,173,0.65)';
                c.fillText(v.toFixed(1), 2, y + 3);
            }
        }
        // X 轴分辨率自适应：可用宽 iw 决定能分辨几个时间片。
        // 每个像素列装不下一个采样点时（窄画布），按列取 min/max 画竖向包络：
        //   直接连线会因欠采样丢峰，丝带的上下缘（重缩放图永远贴边）会被抹平，包络则如实保留。
        // 画得够宽时（每列 ≥1 个采样点）仍逐点连线，不做任何降采样。
        const cols = Math.max(1, Math.round(iw));
        const step = chartCount / cols;          // 每像素列平均装几个采样点
        const decimated = step > 1.5;
        const xOf = (p) => padL + iw * p / (CHART_N - 1);
        const yOf = (v) => padT + ih * (1 - Math.max(0, Math.min(1, v)));
        for (let pc = 0; pc < SFM_PC; pc++) {
            const base = pc * CHART_N, col = SEMI_RGB[pc];
            c.beginPath();
            if (decimated) {
                for (let ci = 0; ci < cols; ci++) {
                    const p0 = Math.floor(ci * step), p1 = Math.min(chartCount, Math.floor((ci + 1) * step));
                    if (p1 <= p0) continue;
                    let mn = Infinity, mx = -Infinity;
                    for (let p = p0; p < p1; p++) { const v = ch.out[base + p]; if (v < mn) mn = v; if (v > mx) mx = v; }
                    const x = padL + ci;           // 整数 x：列与像素对齐，逐帧不抖
                    c.moveTo(x, yOf(mn));
                    c.lineTo(x, yOf(mx));
                }
            } else {
                for (let p = 0; p < chartCount; p++) c.lineTo(xOf(p), yOf(ch.out[base + p]));
            }
            c.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},0.85)`;
            c.lineWidth = 1;
            c.stroke();
        }
    }

    // ---------- 主循环 ----------
    function loop(ts) {
        if (isRunning) {
            if (!lastTs) lastTs = ts;
            const dt = Math.min((ts - lastTs) / 1000, 0.25);
            lastTs = ts;
            updateBuffers(dt);
        }
        sfmFillLines();
        // hidden = 实验台里收起的级：画布 display:none，画了也看不见，白算白画
        for (const ch of charts) { if (ch.hidden) continue; computeChart(ch, sfmLines); drawChart(ch); }
        requestAnimationFrame(loop);
    }
    // 所有画布的逻辑宽都随容器实测（含实验台），窗口/缩放变化时逐块重量
    function refitAll() {
        for (const ch of charts) { if (ch.hidden) continue; ch.w = fitCanvas(ch.cv, ch.h); }
    }
    window.addEventListener('resize', refitAll);
    // 系统缩放变化 / 跨屏拖动（dpr 变化）时重建位图，否则位图按旧 dpr 拉伸 → 文字发虚
    if (window.matchMedia) {
        const mq = window.matchMedia(`(resolution: ${(window.devicePixelRatio || 1)}dppx)`);
        if (mq.addEventListener) mq.addEventListener('change', refitAll);
        else if (mq.addListener) mq.addListener(refitAll);   // 旧版 Safari
    }
    connectSSE();
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
