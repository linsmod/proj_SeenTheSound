    let colAnchor = null, rowAnchor = null, cellAnchorB = null, cellAnchorPc = null;
    function toggleCol(pc) {
        let cols;
        if (selected && selected.type === 'multi' && selected.cols) cols = new Set(selected.cols);
        else if (selected && selected.type === 'col') cols = new Set([selected.pc]);
        else cols = new Set();
        if (cols.has(pc)) cols.delete(pc); else cols.add(pc);
        // 行列互斥：切换列维度清空行；cells 混选保留
        const cells = (selected && selected.type === 'multi' && selected.cells) ? new Set(selected.cells) : new Set();
        finishMulti({ type: 'multi', cols, rows: new Set(), cells }, false);   // Ctrl 切换：不画 border
    }
    function toggleRow(b) {
        let rows;
        if (selected && selected.type === 'multi' && selected.rows) rows = new Set(selected.rows);
        else if (selected && selected.type === 'row') rows = new Set([selected.b]);
        else rows = new Set();
        if (rows.has(b)) rows.delete(b); else rows.add(b);
        const cells = (selected && selected.type === 'multi' && selected.cells) ? new Set(selected.cells) : new Set();
        finishMulti({ type: 'multi', cols: new Set(), rows, cells }, false);   // Ctrl 切换：不画 border
    }
    function toggleCell(b, pc) {
        let cells;
        if (selected && selected.type === 'multi' && selected.cells) cells = new Set(selected.cells);
        else if (selected && selected.type === 'cell') cells = new Set([selected.b * SEMI_N + selected.pc]);
        else cells = new Set();
        const k = b * SEMI_N + pc;
        if (cells.has(k)) cells.delete(k); else cells.add(k);
        // 已选的列/行保留（bg 保留），但 border 移除：cell 操作后不应存在任何 border
        const cols = (selected && selected.type === 'multi' && selected.cols) ? selected.cols : new Set();
        const rows = (selected && selected.type === 'multi' && selected.rows) ? selected.rows : new Set();
        finishMulti({ type: 'multi', cols, rows, cells }, false);
    }
    function shiftCols(pc) {
        const a = colAnchor != null ? colAnchor : pc;
        const cols = new Set();
        for (let p = Math.min(a, pc); p <= Math.max(a, pc); p++) cols.add(p);
        const cells = (selected && selected.type === 'multi' && selected.cells) ? new Set(selected.cells) : new Set();
        finishMulti({ type: 'multi', cols, rows: new Set(), cells }, true);   // Shift 范围：画整体 outer border，锚点不动
    }
    function shiftRows(b) {
        const a = rowAnchor != null ? rowAnchor : b;
        const rows = new Set();
        for (let r = Math.min(a, b); r <= Math.max(a, b); r++) rows.add(r);
        const cells = (selected && selected.type === 'multi' && selected.cells) ? new Set(selected.cells) : new Set();
        finishMulti({ type: 'multi', cols: new Set(), rows, cells }, true);   // Shift 范围：画整体 outer border
    }
    function shiftCell(b, pc) {
        // 清除上一个 rect/border（cols/rows 一并清空），但沿用其起点位置：
        // 上次 rect 的 (b0,p0) > 行列范围的起点列/行 > cellAnchor > 点击格
        let ab = cellAnchorB, ap = cellAnchorPc;
        if (selected && selected.type === 'multi') {
            if (selected.rect) { ab = selected.rect.b0; ap = selected.rect.p0; }
            else if (selected.cols && selected.cols.size) {
                const pcs = [...selected.cols].sort((x, y) => x - y);
                ap = pcs[0];
                if (ab == null) ab = b;
            } else if (selected.rows && selected.rows.size) {
                const bs = [...selected.rows].sort((x, y) => x - y);
                ab = bs[0];
                if (ap == null) ap = pc;
            }
        }
        if (ab == null) ab = b;
        if (ap == null) ap = pc;
        const b0 = Math.min(ab, b), b1 = Math.max(ab, b);
        const p0 = Math.min(ap, pc), p1 = Math.max(ap, pc);
        const cells = new Set();
        for (let bb = b0; bb <= b1; bb++)
            for (let pp = p0; pp <= p1; pp++)
                cells.add(bb * SEMI_N + pp);
        // cols/rows 清空 → 上一个 border 移除，画面上只剩本次 rect
        finishMulti({ type: 'multi', cols: new Set(), rows: new Set(), cells, rect: { b0, p0, b1, p1 } }, true);
    }
    function finishMulti(sel, bordered) {
        const n = selCells(sel).length;
        if (!n) { closePanel(); return; }
        // bordered：Shift 范围 = true → 画整体 outer border；Ctrl 切换 = false → 不画；
        // 未显式给出（cell 操作）时沿用原状，避免 Shift 画的 border 意外消失
        sel.bordered = bordered === undefined ? !!(selected && selected.bordered) : !!bordered;
        selected = sel;
        const parts = [];
        if (sel.cols && sel.cols.size) parts.push('列 ' + [...sel.cols].map(p => NOTE_NAMES[p]).join(' '));
        if (sel.rows && sel.rows.size) parts.push('区 ' + [...sel.rows].map(b => ZONE_DEFS[b].name).join(' '));
        if (sel.cells && sel.cells.size) parts.push(`格 ${sel.cells.size}`);
        sideTitle.textContent = `多选 ${n} 键 · ${parts.join(' + ')}`;
    }
    function closePanel() {
        // 点击网格外 / 多选清空 → 取消选择（图表按全盘计算）
        selected = null;
        sideTitle.textContent = '未选择 · 按全盘计算';
    }

    // 点击主画布（Excel 选择模型，列/行/格子三态互斥）：
    //   单击 = 替换选择并设锚点；Ctrl+点击 = 加选/减选（锚点移到该项）；
    //   Shift+点击 = 从锚点到该项的连续范围（列/行/格子矩形框选，锚点不动）
    canvas.addEventListener('click', (ev) => {
        const rect = canvas.getBoundingClientRect();
        const x = (ev.clientX - rect.left) * (W / rect.width);
        const y = (ev.clientY - rect.top) * (H / rect.height);
        if (x < MARGIN_L && y < MARGIN_T) {
            colAnchor = rowAnchor = cellAnchorB = cellAnchorPc = null;
            selectAllCells(); return;
        }
        if (y < MARGIN_T) {
            const pc = Math.floor((x - MARGIN_L) / CELL_W);
            if (pc >= 0 && pc < SEMI_N) {
                // 列头锚点 = 该列最顶上的格子（不限制 88 键），
                // 之后 Shift 点内容格 = 从首格到点击格的矩形
                cellAnchorPc = pc;
                cellAnchorB = 0;
                rowAnchor = null;
                if (ev.ctrlKey) { colAnchor = pc; toggleCol(pc); }
                else if (ev.shiftKey) shiftCols(pc);
                else { colAnchor = pc; selectCol(pc); }
                return;
            }
        }
        if (x < MARGIN_L) {
            const b = Math.floor((y - MARGIN_T) / CELL_H);
            if (b >= 0 && b < ZONE_N) {
                // 行标锚点 = 该行最左边的格子（不限制 88 键）
                cellAnchorB = b;
                cellAnchorPc = 0;
                colAnchor = null;
                if (ev.ctrlKey) { rowAnchor = b; toggleRow(b); }
                else if (ev.shiftKey) shiftRows(b);
                else { rowAnchor = b; selectRow(b); }
                return;
            }
        }
        const pc = Math.floor((x - MARGIN_L) / CELL_W);
        const b = Math.floor((y - MARGIN_T) / CELL_H);
        if (pc >= 0 && pc < SEMI_N && b >= 0 && b < ZONE_N) {
            colAnchor = rowAnchor = null;
            if (ev.ctrlKey) { cellAnchorB = b; cellAnchorPc = pc; toggleCell(b, pc); }
            else if (ev.shiftKey) shiftCell(b, pc);
            else { cellAnchorB = b; cellAnchorPc = pc; selectCell(b, pc); }
        } else {
            colAnchor = rowAnchor = cellAnchorB = cellAnchorPc = null;
            closePanel();
        }
    });

    // 滚轮调整窗口周期（grid 与左侧周期瓦片均可）：按滑块步进（step，默认 0.01s），按住 Shift ×10
    // 向上滚 = 周期增大，向下滚 = 周期减小；同步滑块位置、瓦片数值与边缘闪光
    function periodWheel(ev) {
        ev.preventDefault();
        if (!ev.deltaY) return;
        const base = parseFloat(periodSlider.step) || 0.01;
        const mult = ev.shiftKey ? 10 : 1;                 // 按住 Shift 步长 ×10，对齐栅格不变
        const min = parseFloat(periodSlider.min), max = parseFloat(periodSlider.max);
        const dir = ev.deltaY < 0 ? 1 : -1;
        let np = Math.round((dials[0].period + dir * base * mult) / base) * base;
        np = Math.min(max, Math.max(min, Math.round(np * 100) / 100));
        if (np !== dials[0].period) {
            periodSlider.value = np;
            update(periodSlider);   // 复用滑块逻辑：改周期 + 刷标签/瓦片 + 清空缓冲时间累积
        }
    }
    canvas.addEventListener('wheel', periodWheel, { passive: false });
    const periodTileEl = document.getElementById('periodTile');
    periodTileEl.addEventListener('wheel', periodWheel, { passive: false });
    // 中键：恢复滑块出厂默认值（取 HTML 上的初始 value，不受运行时修改影响）
    periodTileEl.addEventListener('pointerdown', (ev) => {
        if (ev.button === 1) {
            const def = parseFloat(periodSlider.getAttribute('value')) || 0.05;
            periodSlider.value = def;
            update(periodSlider);
            ev.preventDefault();
        }
    });
    periodTileEl.addEventListener('mousedown', (ev) => { if (ev.button === 1) ev.preventDefault(); });
    selected = null;   // 启动默认不选：两个图表按全盘计算

    function drawChart() {
        chartCtx.clearRect(0, 0, CHART_W, CHART_H);
        chartCtx.fillStyle = '#0a1022';
        chartCtx.fillRect(0, 0, CHART_W, CHART_H);
        // 未选择（null）= 按全盘计算；单格走单格分支，其余走多格分支
        const isOne = !!selected && selected.type === 'cell';
        const cells = selCells(selected);   // null → keyCells（全盘）
        const color = (selected && selected.type === 'col') ? SEMI_COLORS[selected.pc] : '#4ae0ff';

        const padL = CPAD.L, padR = CPAD.R, padT = CPAD.T, padB = CPAD.B;
        const iw = CHART_W - padL - padR, ih = CHART_H - padT - padB;
        // 最新点贴右缘，旧点向左滚出（p = 0 最旧 … chartCount-1 最新）
        const xOf = (p) => padL + iw * (p - (chartCount - CHART_N)) / (CHART_N - 1);
        const yOf = (v) => padT + ih * (1 - Math.max(0, Math.min(1, v)));

        // 横向网格 + 刻度；0.25 = 盘面显示阈值（AMP_ROW.lo），高亮
        chartCtx.font = '9px sans-serif';
        chartCtx.textAlign = 'right';
        for (let v = 0; v <= 1.0001; v += 0.25) {
            const y = Math.round(yOf(v)) + 0.5;
            const isThr = Math.abs(v - AMP_ROW.lo) < 1e-6;
            chartCtx.beginPath();
            chartCtx.moveTo(padL, y);
            chartCtx.lineTo(CHART_W - padR, y);
            chartCtx.strokeStyle = isThr ? 'rgba(255,170,51,0.40)' : 'rgba(255,255,255,0.07)';
            chartCtx.setLineDash(isThr ? [4, 4] : []);
            chartCtx.lineWidth = 1;
            chartCtx.stroke();
            chartCtx.setLineDash([]);
            chartCtx.fillStyle = isThr ? 'rgba(255,170,51,0.8)' : 'rgba(114,134,173,0.9)';
            chartCtx.fillText(v.toFixed(2), padL - 4, y + 3);
        }
        // 纵向时间刻度（现在 / -1s … -5s）
        chartCtx.textAlign = 'center';
        for (let s = 0; s <= CHART_SEC; s++) {
            const p = chartCount - 1 - s * CHART_HZ;
            if (p < 0) continue;
            const x = Math.round(xOf(p)) + 0.5;
            chartCtx.beginPath();
            chartCtx.moveTo(x, padT);
            chartCtx.lineTo(x, CHART_H - padB);
            chartCtx.strokeStyle = 'rgba(255,255,255,0.05)';
            chartCtx.stroke();
            chartCtx.fillStyle = 'rgba(114,134,173,0.9)';
            chartCtx.fillText(s === 0 ? '现在' : `-${s}s`, x, CHART_H - 5);
        }

        // color_threshold 线（紫色虚线）：高于此显示高度的点在盘面显彩色；可在图上抓住上下拖动修改
        const thrY = padT + ih * (1 - Math.max(0, Math.min(1, AMP_ROW.color_threshold)));
        chartCtx.beginPath();
        chartCtx.moveTo(padL, Math.round(thrY) + 0.5);
        chartCtx.lineTo(CHART_W - padR, Math.round(thrY) + 0.5);
        chartCtx.strokeStyle = thrDrag ? '#c084ff' : 'rgba(192,132,252,0.8)';
        chartCtx.setLineDash([2, 3]);
        chartCtx.lineWidth = 1.5;
        chartCtx.stroke();
        chartCtx.setLineDash([]);
        chartCtx.fillStyle = 'rgba(192,132,252,0.95)';
        chartCtx.textAlign = 'right';
        chartCtx.fillText('T=' + AMP_ROW.color_threshold.toFixed(2), CHART_W - padR, thrY - 3);

        if (chartCount > 0 && isOne) {
            const b = selected.b, pc = selected.pc;
            const rawArr = chartRaw[b][pc], gateArr = chartGate[b][pc];
            const idxOf = (p) => (chartWrite + p) % CHART_N; // 写指针=最旧，p=0 最旧 … p=CHART_N-1 最新（窗口恒满）
            const gatedAt = (p) => rawArr[idxOf(p)] * gateArr[idxOf(p)];
            // 原始幅度（暗色）
            chartCtx.beginPath();
            for (let p = 0; p < chartCount; p++) chartCtx.lineTo(xOf(p), yOf(rawArr[idxOf(p)]));
            chartCtx.strokeStyle = 'rgba(214,222,238,0.35)';
            chartCtx.lineWidth = 1;
            chartCtx.stroke();
            // 门控后（音级色）：面积填充 + 微光描边
            chartCtx.beginPath();
            chartCtx.moveTo(xOf(0), yOf(gatedAt(0)));
            for (let p = 1; p < chartCount; p++) chartCtx.lineTo(xOf(p), yOf(gatedAt(p)));
            chartCtx.lineTo(xOf(chartCount - 1), yOf(0));
            chartCtx.lineTo(xOf(0), yOf(0));
            chartCtx.closePath();
            chartCtx.fillStyle = color;
            chartCtx.globalAlpha = 0.10;
            chartCtx.fill();
            chartCtx.globalAlpha = 1;
            chartCtx.beginPath();
            for (let p = 0; p < chartCount; p++) chartCtx.lineTo(xOf(p), yOf(gatedAt(p)));
            chartCtx.strokeStyle = color;
            chartCtx.lineWidth = 1.5;
            chartCtx.shadowBlur = 6;
            chartCtx.shadowColor = color;
            chartCtx.stroke();
            chartCtx.shadowBlur = 0;
        } else if (chartCount > 0 && cells.length > 0) {
            // 多格（列/行/全盘）：逐采样汇总门控后显示值 → 最大值 / 中位值 两条线
            const n = cells.length;
            const tmp = new Float32Array(n), srt = new Float32Array(n);
            const maxArr = new Float32Array(chartCount), medArr = new Float32Array(chartCount);
            for (let p = 0; p < chartCount; p++) {
                const idx = (chartWrite + p) % CHART_N;
                for (let k = 0; k < n; k++) {
                    const cb = cells[k][0], cp = cells[k][1];
                    tmp[k] = chartRaw[cb][cp][idx] * chartGate[cb][cp][idx];
                }
                let mx = 0;
                for (let k = 0; k < n; k++) if (tmp[k] > mx) mx = tmp[k];
                maxArr[p] = mx;
                srt.set(tmp); srt.sort();   // TypedArray.sort 默认数值升序
                medArr[p] = (n & 1) ? srt[n >> 1] : (srt[(n >> 1) - 1] + srt[n >> 1]) / 2;
            }
            chartValEl.textContent = `最大 ${maxArr[chartCount - 1].toFixed(2)} · 中位 ${medArr[chartCount - 1].toFixed(2)}`;
            // 中位值（暗灰细线）
            chartCtx.beginPath();
            for (let p = 0; p < chartCount; p++) chartCtx.lineTo(xOf(p), yOf(medArr[p]));
            chartCtx.strokeStyle = 'rgba(214,222,238,0.55)';
            chartCtx.lineWidth = 1;
            chartCtx.stroke();
            // 最大值（彩色，面积填充 + 微光描边）
            chartCtx.beginPath();
            chartCtx.moveTo(xOf(0), yOf(maxArr[0]));
            for (let p = 1; p < chartCount; p++) chartCtx.lineTo(xOf(p), yOf(maxArr[p]));
            chartCtx.lineTo(xOf(chartCount - 1), yOf(0));
            chartCtx.lineTo(xOf(0), yOf(0));
            chartCtx.closePath();
            chartCtx.fillStyle = color;
            chartCtx.globalAlpha = 0.10;
            chartCtx.fill();
            chartCtx.globalAlpha = 1;
            chartCtx.beginPath();
            for (let p = 0; p < chartCount; p++) chartCtx.lineTo(xOf(p), yOf(maxArr[p]));
            chartCtx.strokeStyle = color;
            chartCtx.lineWidth = 1.5;
            chartCtx.shadowBlur = 6;
            chartCtx.shadowColor = color;
            chartCtx.stroke();
            chartCtx.shadowBlur = 0;
        }   // 数据未到：静默，不画“等待数据”提示

        // 激活量（黄）：与全盘图同逻辑——点亮（含余晖）键才计入，未点亮为 0（写入时冻结）
        // 单格 = 该键点亮时的显示值；多选 = 点亮键中的最大贡献（与最大值线同尺度）
        if (chartCount > 0) {
            const actArr = new Float32Array(chartCount);
            for (let p = 0; p < chartCount; p++) {
                const idx = (chartWrite + p) % CHART_N;
                let m = 0;
                for (let k = 0; k < cells.length; k++) {
                    const ki = keyIdx[cells[k][0] * SEMI_N + cells[k][1]];
                    if (ki < 0 || !chartLit[idx * keyCells.length + ki]) continue;
                    const v = chartRaw[cells[k][0]][cells[k][1]][idx] * chartGate[cells[k][0]][cells[k][1]][idx];
                    if (v > m) m = v;
                }
                actArr[p] = m;
            }
            chartCtx.beginPath();
            for (let p = 0; p < chartCount; p++) chartCtx.lineTo(xOf(p), yOf(actArr[p]));
            chartCtx.strokeStyle = '#ffaa33';
            chartCtx.lineWidth = 1.0;
            chartCtx.shadowBlur = 4; chartCtx.shadowColor = '#ffaa33';
            chartCtx.stroke(); chartCtx.shadowBlur = 0;
        }

        // 图例切换（单格 / 多格两套，仅在模式变化时改 DOM）+ 紧凑读数 + mini bin 柱状图（仅单格）
        const lm = isOne ? 'one' : 'multi';
        if (lm !== chartLegendMode) {
            chartLegendMode = lm;
            legendOneEl.style.display = isOne ? '' : 'none';
            legendMultiEl.style.display = isOne ? 'none' : '';
        }
        if (isOne) {
            const raw = lastRaw[selected.b][selected.pc], g = lastGate[selected.b][selected.pc];
            chartValEl.textContent = `原始 ${raw.toFixed(2)} · 门控 ${g.toFixed(2)} · 显示 ${(raw * g).toFixed(2)}`;
            drawBinBars(chartCtx, selected.b, selected.pc);
        } else {
            chartValEl.textContent = `已选 ${cells.length} 键`;
        }
    }

    // ---------- 阈值线交互：hover 变抓手/上下箭头，按住上下拖动改 AMP_ROW.color_threshold ----------
    // color_threshold 是纯前端显示参数（盘面显色阈值），拖动即时生效；值存 localStorage 刷新保持
    let thrDrag = false;
    const THR_HIT_PX = 5;   // 命中容差（px）
    try {
        const ct = parseFloat(localStorage.getItem('colorThreshold'));
        if (isFinite(ct)) AMP_ROW.color_threshold = Math.max(AMP_ROW.lo, Math.min(1, ct));
    } catch (e) {}
    function chartEventY(ev) {
        const rect = chartCanvas.getBoundingClientRect();
        return (ev.clientY - rect.top) * (CHART_H / rect.height);
    }
    function thrLineY() {
        const ih = CHART_H - CPAD.T - CPAD.B;
        return CPAD.T + ih * (1 - Math.max(0, Math.min(1, AMP_ROW.color_threshold)));
    }
    chartCanvas.addEventListener('pointermove', (ev) => {
        const y = chartEventY(ev);
        if (thrDrag) {
            const ih = CHART_H - CPAD.T - CPAD.B;
            // 下限 = AMP_ROW.lo（盘面显示范围下限）：阈值不可低于 lo
            AMP_ROW.color_threshold = Math.max(AMP_ROW.lo, Math.min(1, 1 - (y - CPAD.T) / ih));
            try { localStorage.setItem('colorThreshold', String(AMP_ROW.color_threshold)); } catch (e) {}
            drawChart();
            return;
        }
        const near = Math.abs(y - thrLineY()) <= THR_HIT_PX;   // 未选择时图表按全盘绘制，阈值线常驻
        chartCanvas.style.cursor = near ? 'ns-resize' : 'default';
    });
    const THR_DEFAULT = 0.6;   // color_threshold 出厂默认（中键重置目标）
    function thrReset() {
        AMP_ROW.color_threshold = THR_DEFAULT;
        try { localStorage.setItem('colorThreshold', String(THR_DEFAULT)); } catch (e) {}
        drawChart();
    }
    chartCanvas.addEventListener('pointerdown', (ev) => {
        if (ev.button === 1) {
            // 中键：悬停在线上时重置为默认值（未选择状态下阈值线常驻，同样可用）
            if (Math.abs(chartEventY(ev) - thrLineY()) <= THR_HIT_PX) thrReset();
            ev.preventDefault();
            return;
        }
        if (Math.abs(chartEventY(ev) - thrLineY()) <= THR_HIT_PX) {
            thrDrag = true;
            try { chartCanvas.setPointerCapture(ev.pointerId); } catch (e) {}
            ev.preventDefault();
        }
    });
    // 屏蔽浏览器中键自动滚动
    chartCanvas.addEventListener('mousedown', (ev) => { if (ev.button === 1) ev.preventDefault(); });
    const thrDragEnd = (ev) => {
        if (!thrDrag) return;
        thrDrag = false;
        try { chartCanvas.releasePointerCapture(ev.pointerId); } catch (e) {}
    };
    chartCanvas.addEventListener('pointerup', thrDragEnd);
    chartCanvas.addEventListener('pointercancel', thrDragEnd);

    // 右上角超小 mini：当前选中音级拆成的各 bin 原始值（无背景，仅三个框；0 高度画空心框）
    function drawBinBars(c, b, pc) {
        if (!pitchClassBins || !freqData || !binFreqs) return;
        const bins = pitchClassBins[b][pc];
        if (!bins || !bins.length) return;
        const n = bins.length;
        const bw = 66, bh = 34;
        const bx = CHART_W - bw - 6, by = 6;
        c.save();
        // 仅三个框：有值填充、无值空心，无背景
        const padX = 5, top = by + 1, bottom = by + bh - 1;
        const areaH = bottom - top, innerW = bw - padX * 2;
        const gap = 2;
        const fixedBar = 15; // 单 bin 目标宽：1 个 bin 只占一格列，不拉伸占满
        const barW = n * fixedBar + (n - 1) * gap > innerW
            ? (innerW - gap * (n - 1)) / n   // bin 过多时缩小防溢出
            : fixedBar;
        const color = SEMI_COLORS[pc];
        for (let k = 0; k < n; k++) {
            const idx = bins[k];
            const v = Math.max(0, Math.min(1, freqData[idx] / 255));
            const x = bx + padX + k * (barW + gap);
            const h = v * areaH;
            if (h < 0.5) {
                c.strokeStyle = 'rgba(255,255,255,0.28)';
                c.lineWidth = 1;
                c.strokeRect(x, bottom - 3, barW, 3);
            } else {
                c.fillStyle = color;
                c.fillRect(x, bottom - h, barW, h);
            }
        }
        c.restore();
    }

    // 调试视图：把每个 bin 作为“频率中心”，按其真实中心频率 f 定位到 grid 的 2D 坐标上
    // （x = 音级列 + 半音内偏移，表达“一个八度内的频率高低”；y 只表示所属 zone 行，不重复编码频率）
    // 归属口径与 amp 归类、后端 OnsetGate 统一：每个 bin 归到"最近的音"（round(fm)），
    // 该音符同时决定列(pc)、行(zone)与点在格内的偏移 → 每格 3 颗点对称落在 -1/3 / 0 / +1/3
    function drawBinScatter(c) {
        if (!showBinDots) return;   // bin 圆点关闭：跳过叠加层
        if (!freqData || !binFreqs) return;   // 数据未到：静默，不画“等待频谱数据”提示
        const x0 = MARGIN_L, xSpan = W - MARGIN_L - PAD_R;
        // 每个 bin：换算 midi → 归到"最近的音"（round，中点），该音符决定所在行与所在列；
        // x = 该音符列中心 + (fm-note) 格 → 3 颗点对称落在列中心两侧（-1/3 / 0 / +1/3），不会越出格
        for (let i = 0; i < binFreqs.length; i++) {
            const fm = 69 + 12 * Math.log2(binFreqs[i] / A4);
            const note = Math.round(fm);
            if (note < KEY_LO || note > KEY_HI) continue;   // 88 键之外不画
            const b = noteRow[note];                        // 该音符所属 zone 行
            const y = MARGIN_T + (b + 0.5) * CELL_H;   // y 仅决定所属 zone 行（行内不再按频率细分）
            const pc = ((note % 12) + 12) % 12;
            const x = x0 + (pc + 0.5 + (fm - note)) / SEMI_N * xSpan; // 列中心 + 半音内偏移
            const v = (freqData[i] || 0) / 255;     // 当前能量
            const rad = 1.6 + 3.2 * v;
            c.beginPath();
            c.arc(x, y, rad, 0, 2 * Math.PI);
            // 颜色 = 音级（与列/小盘同色，统一感知亮度），一眼看出该 bin 属于哪个音级；透明度随能量
            const bc = SEMI_RGB[pc];
            c.fillStyle = `rgba(${bc[0]},${bc[1]},${bc[2]},${(0.25 + 0.7 * v).toFixed(3)})`;
            c.fill();
            c.lineWidth = 0.6;                       // 细暗描边，重叠时也能分辨
            c.strokeStyle = 'rgba(0,0,0,0.45)';
            c.stroke();
        }
    }

    function resetBuffers() {
        gateData = null; // 重连/复位时丢弃旧门增益，等新流第一帧
        semiBuffers.forEach(bufRow => bufRow.forEach(buf => {
            buf.data.fill(0);
            buf.writeIdx = 0;
            buf.accumTime = 0;
            buf.filled = false;
        }));
    }

    // ---------- 主循环 ----------
    let drawAccum = 0;
    function loop(timestamp) {
        if (!isRunning) {
            // 停止状态，继续绘制静态（含新增差值图）
            drawAll();
            drawSfmDelta();
            animationId = requestAnimationFrame(loop);
            return;
        }

        // 计算时间差 (秒)
        if (lastTimestamp === 0) lastTimestamp = timestamp;
        const delta = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        // 更新表盘数据（每帧都要累积，保证采样精度）
        updateBuffers(delta);

        // 绘制节流到 ~62fps：跟随后端 60fps 推送（原 1/50 会把 60fps 数据显成 50fps），
        // 同时避免 120Hz+ 高刷屏按显示刷新率过绘制（数据并没有更密）
        drawAccum += delta;
        if (drawAccum >= 1 / 62) {
            drawAccum = 0;
            drawAll();
            drawChart(); // 右侧栏常驻，每帧刷新线性图（无选中时显示占位）
            drawTotal(); // 总量走势（按所选范围）
            drawSfmPc(); // 十二音级谱平坦度
            drawSfmCurve(); // 十二音级平坦度曲线
            drawSfmDelta(); // 十二音级平坦度差值（相对参考基准）
        }

        animationId = requestAnimationFrame(loop);
    }

    // ---------- 输入源：连接 Python 后端 SSE ----------
    function connectSSE() {
        if (es) { es.close(); es = null; }
        setStatus('⏳ 连接 Python 后端 ...', true);   // 未就绪：整块屏蔽 grid
        es = new EventSource('/stream');
        es.onopen = () => {
            isRunning = true;
            lastTimestamp = 0;
            resetBuffers();
            setStatus('🎧 Python 频谱接收中 ...', false);   // 已就绪：只留内容区，放开 grid
        };
        es.onmessage = (ev) => {
            const msg = JSON.parse(ev.data);
            if (msg.err) {
                setStatus('❌ ' + msg.err, true);   // 后端报错：屏蔽 grid
                isRunning = false;
                return;
            }
            // base64 → Uint8Array（频谱字节）
            const bin = atob(msg.s);
            if (!freqData || freqData.length !== bin.length) freqData = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) freqData[i] = bin.charCodeAt(i);
            // 逐格 onset 门增益：base64 → 9×12 字节（行主序 z*12+pc）
            // 后端 --no-gate 时不下发该字段 → gateData=null，前端全通
            if (msg.gate) {
                const gb = atob(msg.gate);
                if (gb.length === ZONE_N * SEMI_N) { // 长度不符（异常帧）不更新，保留旧值
                    if (!gateData || gateData.length !== gb.length) gateData = new Uint8Array(gb.length);
                    for (let i = 0; i < gb.length; i++) gateData[i] = gb.charCodeAt(i);
                }
            } else {
                gateData = null;
            }
            // 每 bin 中心频率：CQT 后端直发对数等距表；FFT 后端只发 binHz，按线性重建
            specKind = msg.kind || 'fft';
            if (msg.freqs) {
                if (!binFreqs || binFreqs.length !== msg.freqs.length) binFreqs = new Float64Array(msg.freqs.length);
                for (let i = 0; i < msg.freqs.length; i++) binFreqs[i] = msg.freqs[i];
            } else {
                if (!binFreqs || binFreqs.length !== bin.length) binFreqs = new Float64Array(bin.length);
                for (let i = 0; i < bin.length; i++) binFreqs[i] = (i + 0.5) * msg.binHz;
            }
            const realFps = (msg.rfps != null) ? ` 实测${msg.rfps}fps` : '';
            srcInfo.textContent = specKind === 'cqt'
                ? `fs=${msg.fs}Hz · ${msg.fps}fps${realFps} · CQT ${binFreqs.length}bin @${msg.bpo}/oct ${binFreqs[0].toFixed(1)}–${binFreqs[binFreqs.length - 1].toFixed(0)}Hz`
                : `fs=${msg.fs}Hz · ${msg.fps}fps${realFps} · binHz=${msg.binHz.toFixed(2)} · FFT=${bin.length * 2}`;
        };
        es.onerror = () => {
            isRunning = false;
            gateData = null; // 断开即全通，避免残留增益把最后一次状态冻在板上
            setStatus('❌ 与 Python 后端断开，可点「重连」', true);   // 断开：屏蔽 grid
        };
    }
    document.getElementById('reconnectBtn').addEventListener('click', () => connectSSE());

    // 初始绘制
    drawAll();
    // 自动连接 Python 后端（输入源唯一区别：SSE 而非 Web Audio，无需用户授权点击）
    connectSSE();
    // 启动动画（即使未连上后端，也绘制静态）
    isRunning = false;
    requestAnimationFrame(loop);

    window.addEventListener('beforeunload', () => {
        if (es) es.close();
        if (animationId) cancelAnimationFrame(animationId);
    });

})();
</script>
</body>
</html>
