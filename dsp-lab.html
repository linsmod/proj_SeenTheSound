<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sound DSP</title>
<style>
    body { margin: 0; background: #070c1a; color: #bcc8e8; font-family: 'Segoe UI', sans-serif; }
    .topbar {
        display: flex; align-items: center; gap: 16px; padding: 8px 12px;
        background: #0b1226; border-bottom: 1px solid rgba(255,255,255,0.08);
        font-size: 12px; flex-wrap: wrap;
    }
    .topbar .t { font-weight: 700; }
    .topbar a { color: #8fa2c8; font-size: 12px; }
    .status { color: #8fa2c8; font-size: 12px; }
    /* 参数条与控件（可复用：buildParams 按 spec 渲染，图表不手写控件） */
    .pbar { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
    .ctl { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #8fa2c8; white-space: nowrap; }
    .ctl input[type=range] { width: 90px; accent-color: #4ae0ff; }
    .ctl select { background: #0a1022; color: #bcc8e8; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; font-size: 12px; }
    .ctl .v { min-width: 36px; color: #e8eefc; font-variant-numeric: tabular-nums; }
    /* 全局图例：12 音级配色只画一次，各图不再逐线渲染音名（否则 8×12 个小字互相压叠） */
    .legend-row { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 6px 12px; background: #0b1226; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: #8fa2c8; }
    .legend-row .sw { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
    /* 主体三栏：左 = 文件树（content/ 目录树），中 = 可换视图的面板（目录列表 / 单文件链路），右 = 编辑器（dspEditorView）。
       左树是导航 + 右键管理入口；中间装什么由 open() 决定（目录卡片列表或某条链路的详情）。
       窄屏（手机等）放不下三栏时靠 flex-wrap 依次换行，不维护断点。 */
    .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; padding: 10px 12px 16px; }
    /* 左栏文件树：宽度固定，长了自己滚（它是导航，不该跟着中间面板一起长） */
    .tree { flex: 0 0 var(--w-tree, 216px); box-sizing: border-box; padding: 4px 4px 6px; background: #0e1630; border: 1px solid rgba(255,255,255,0.22); border-radius: 8px; }
    /* 树 = 磁盘 content/ 的目录结构：每个目录一个 .grp（目录行 + .kids 内容容器），逐层嵌套缩进 */
    .tree > div + div { margin-top: 2px; }
    /* 目录行可展开/收起（VSCode 那套）：三角单独可点，收起时 .kids 整块隐藏（后代目录与文件一起收） */
    .tree .tnode .caret { flex: none; width: 13px; text-align: center; color: #8fa2c8; font-size: 10px; line-height: 1; cursor: pointer; user-select: none; }
    .tree .tnode .caret:hover { color: #fff; }
    .tree .tnode .caret.void { cursor: default; }        /* 空目录只有占位，不给展开/收起 */
    /* 就地重命名的行内输入框：与 .tn 同格，占用同一段可用宽度 */
    .tree .tnode .tn-edit { flex: 1 1 auto; min-width: 0; box-sizing: border-box; background: #0a1022; color: #e8eefc; border: 1px solid #4ae0ff; border-radius: 4px; font-size: 12px; padding: 1px 4px; }
    .tree .grp.collapsed > .kids { display: none; }
    .tree .kids { padding-left: 10px; }
    .tree .tnode { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 5px; font-size: 12px; color: #bcc8e8; cursor: pointer; user-select: none; }
    .tree .tnode:hover { background: #17223f; }
    .tree .tnode.sel { background: rgba(74,224,255,0.14); box-shadow: inset 0 0 0 1px rgba(74,224,255,0.45); color: #cbeeff; }
    .tree .tnode .to { flex: none; width: 15px; color: #4ae0ff; }
    .tree .tnode .tn { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree .tnode .tk { flex: none; font-size: 10px; color: #ffb347; }        /* ● 与出厂不同 */
    .tree .tnode .tk.p { color: #4ae0ff; }                                   /* ✎ 有未保存草稿 */
    /* 模板行：非用户创建，只能「从模板新建」出自己的副本，所以整行压暗一档以示只读 */
    .tree .tnode.tpl .tn { color: #9fb0d6; }
    .tree .tnode.tpl .to { color: #6d7fa6; }
    /* 中间：可换视图的面板（dsplistview / dspview），宽度自适应 */
    .mid { flex: 1 1 420px; min-width: 0; position: relative; }   /* relative：给标签条的自绘滚动条当定位基准 */
    /* 右栏编辑器（dspEditorView）外壳：背景/圆角/描边/纵向流。
       .etop/.erow/.dsc 是编辑头（改标题说明），画布是"当前链的最终结果"，再往下是工具条与逐级卡。 */
    .lab { box-sizing: border-box; background: #0e1630; border-radius: 8px; border: 1px solid rgba(255,255,255,0.22); display: flex; flex-direction: column; padding: 6px 8px 8px; flex: 0 1 var(--w-lab, 372px); max-width: var(--w-lab, 372px); min-width: 0; align-self: flex-start; position: relative; }
    /* 面板之间的拖拽分割条（VSCode 那套）：拖左栏 / 右栏宽度，中间面板自动吃剩余；双击复位。
       命中区 10px（好抓），可见的只是中间 2px 那根线（平时透明，hover / 拖动时亮起）。 */
    .split { position: relative; flex: 0 0 10px; align-self: stretch; cursor: col-resize; user-select: none; touch-action: none; }
    .split::after { content: ''; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; border-radius: 1px; }
    .split:hover::after, .split.drag::after { background: rgba(74,224,255,0.45); }
    .wrap.narrow .split { display: none; }        /* 换行了就没有可拖的边界 */
    /* 吸附 + 栏内滚动只在三栏并排时启用：能否并排由 applySplits() 按实际宽度算（宽度可调后固定媒体查询不再准） */
    .wrap:not(.narrow) .tree, .wrap:not(.narrow) .lab { position: sticky; top: 10px; max-height: calc(100vh - 24px); overflow-y: auto; scrollbar-gutter: stable; }
    .wrap:not(.narrow) .split { position: sticky; top: 10px; align-self: flex-start; height: calc(100vh - 24px); }
    .lab .pipe { flex: none; margin: 2px 0 4px; font-size: 11px; color: #8fa2c8; font-family: Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    canvas.mx { flex: none; display: block; width: 100%; height: 132px; background: #0a1022; border-radius: 6px; }
    /* 顶栏的全局播放控制：与全局参数条同族，放在它们右边 */
    .gctl { display: inline-flex; align-items: center; gap: 4px; }
    .gctl button { background: #141d34; color: #8fa2c8; border: 1px solid rgba(255,255,255,0.10); border-radius: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer; }
    .gctl button:hover { background: #263a60; color: #fff; }
    /* 下半身的工具条（保存 / 级联编排 / 复制 / 导入导出；删除与恢复出厂在格子的 ⋯ 菜单里） */
    .ltools { flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
    .lbtn.primary { border-color: rgba(74,224,255,0.45); color: #cbeeff; }
    .lbtn:disabled { opacity: 0.35; cursor: default; }
    .lbtn.danger:hover { background: #6b2440; }
    .lbtn { background: #141d34; color: #8fa2c8; border: 1px solid rgba(255,255,255,0.10); border-radius: 6px; font-size: 12px; padding: 3px 12px; cursor: pointer; }
    .lbtn:hover { background: #263a60; color: #fff; }
    /* 级联逐级出图，且每张卡自带全部编排控件（收起也可用）：
       头部 = 收起 / 启用 / 选算子 / 参数 hint / 上移下移删除；身体 = 参数控件 + 该级输出画布 */
    .lcharts { display: flex; flex-direction: column; gap: 6px; }
    .lcharts:empty::after { content: '（暂无级联，点上方"+ 加一级"开始）'; font-size: 12px; color: #5a6c94; }
    .lcard { background: #0a1022; border-radius: 6px; padding: 4px 6px 6px; border: 1px solid rgba(255,255,255,0.22); }
    .lcard-hd { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8fa2c8; }
    .lcard-hd .caret { flex: none; width: 16px; height: 18px; padding: 0; background: none; border: 0; color: #8fa2c8; font-size: 11px; line-height: 1; cursor: pointer; transition: transform 0.12s; }
    .lcard.collapsed .lcard-hd .caret { transform: rotate(-90deg); }
    .lcard-hd .en { flex: none; margin: 0; width: 13px; height: 13px; accent-color: #4ae0ff; cursor: pointer; }
    .lcard-hd .sel { flex: 0 1 auto; min-width: 0; max-width: 128px; background: #070c1a; color: #bcc8e8; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; font-size: 11px; padding: 1px 2px; cursor: pointer; }
    .lcard-hd .ord { flex: none; font-weight: 700; color: #e8eefc; }
    .lcard-hd .op { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: Consolas, monospace; color: #5a6c94; }
    .lcard.skip .lcard-hd .op { text-decoration: line-through; }
    .lcard.skip { opacity: 0.5; }                          /* 该级已停用：出图与上一级相同 */
    .lcard-hd .sops { flex: none; display: flex; gap: 3px; }
    .lcard-hd .sops button { width: 22px; height: 20px; padding: 0; background: #141d34; color: #8fa2c8; border: 1px solid rgba(255,255,255,0.10); border-radius: 4px; font-size: 11px; line-height: 1; cursor: pointer; }
    .lcard-hd .sops button:hover:not(:disabled) { background: #263a60; color: #fff; }
    .lcard-hd .sops button:disabled { opacity: 0.3; cursor: default; }
    .lcard-hd .sops button.del:hover { background: #6b2440; }
    .lcard-body { margin-top: 4px; }
    .lcard.collapsed .lcard-body { display: none; }
    .lctl { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-bottom: 4px; }
    /* 右栏编辑器头部：状态位 + 关闭按钮（关掉就回到"没在编辑任何一格"的空态） */
    .lab .etop { flex: none; display: flex; gap: 6px; align-items: center; margin-bottom: 4px; font-size: 11px; color: #8fa2c8; }
    .lab .dirty { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ffb347; }
    .lab .xbtn { flex: none; width: 20px; height: 18px; padding: 0; background: none; border: 1px solid transparent; border-radius: 4px; color: #8fa2c8; font-size: 12px; line-height: 1; cursor: pointer; }
    .lab .xbtn:hover { background: #263a60; color: #fff; border-color: rgba(255,255,255,0.15); }
    /* 通用标签条（VSCode 那套，右栏编辑器与中间内容面板共用）：
       整条是一条"头"——细底线 + 一排站在线上的页签；活跃页签用顶部亮线 + 淡底标出，与下方内容连成一体。
       一个条目 = 一个打开着的目标，点击切换、✕ / 中键关闭；栏宽不够就横向自己滚。 */
    .panetabs {
        flex: none; display: flex; align-items: stretch; gap: 2px;
        margin-bottom: 6px;
        border-bottom: 1px solid rgba(255,255,255,0.10);
        overflow-x: auto; overflow-y: hidden;
        /* 30px 的头里塞一条横向滚动条会把"页签 → 底线"的关系撑断（滚动条夹在中间），所以隐藏原生条，
           滚动交给滚轮（见 makeTabStrip 里的 wheel 处理） */
        scrollbar-width: none;
        overscroll-behavior-x: contain;     /* 横向滚到头别触发浏览器的"后退"手势 */
    }
    .panetabs::-webkit-scrollbar { height: 0; }
    .panetabs[hidden] { display: none; }
    /* 右栏是带内边距的卡片：让标签条贴到卡片两边，看起来像真标题栏 */
    .lab > .panetabs { margin: -6px -8px 6px; padding: 5px 4px 0; }
    .panetab {
        flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
        max-width: 190px; box-sizing: border-box; padding: 5px 6px 5px 9px;
        background: transparent; border: 1px solid transparent; border-bottom: 0;
        border-radius: 6px 6px 0 0;
        color: #7d8db3; font-size: 12px; line-height: 1.35; white-space: nowrap;
        cursor: pointer; transition: background 0.12s, color 0.12s;
    }
    .panetab:hover { background: rgba(255,255,255,0.045); color: #bcc8e8; }
    .panetab.on {
        background: rgba(74,224,255,0.10);
        border-color: rgba(74,224,255,0.28);
        box-shadow: inset 0 2px 0 #4ae0ff;
        color: #e8eefc;
    }
    .panetab .ti { flex: none; font-size: 10px; line-height: 1; opacity: 0.9; }        /* 类型图标（目录 / 文件 / 对比） */
    .panetab .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panetab .td { flex: none; width: 5px; height: 5px; border-radius: 50%; background: #ffb347; }   /* 有未保存改动 */
    .panetab .tx {
        flex: none; width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center;
        border-radius: 3px; color: #5a6c94; font-size: 10px; line-height: 1; opacity: 0.35;
        transition: opacity 0.12s, background 0.12s;
    }
    .panetab:hover .tx, .panetab.on .tx { opacity: 1; }                               /* 悬停 / 活跃才把 ✕ 亮出来 */
    .panetab .tx:hover { background: rgba(255,255,255,0.16); color: #fff; }
    /* 标签条的单行横向滚动条：3px 细条，正好压在标签条那条分隔线上。
       原生横向滚动条夹在"页签"与"分隔线"之间，会把两者撑开、破坏站线的观感，所以自己画一条：
       它是 .panetabs 的兄弟（绝对定位），不随内容滚动，长度按 scrollLeft / scrollWidth 实时算。 */
    .panebar {
        position: absolute; height: 3px; border-radius: 2px; z-index: 3;
        background: rgba(74,224,255,0.35); opacity: 0.55; cursor: grab;
        transition: opacity 0.15s, background 0.15s;
    }
    .panebar[hidden] { display: none; }
    /* 看得见的只有 3px，但可抓的高度放大到 ~11px（上下各外扩 4px），否则鼠标根本点不中 */
    .panebar::before { content: ''; position: absolute; left: 0; right: 0; top: -4px; bottom: -4px; }
    .panetabs:hover ~ .panebar, .panebar.hot { opacity: 1; background: rgba(74,224,255,0.78); }
    .panebar.hot { cursor: grabbing; }
    /* 内容面板：一块 host 装 N 个 pane（每条标签一个），非活跃的整块 hidden —— 内容与滚动位置一并留着 */
    .panehost { min-width: 0; }
    .tabpane[hidden] { display: none; }
    /* 空态：没有打开任何编辑目标时只留提示块（含「自由探索」入口），其余控件全部收起 */
    .lab .idle { display: none; padding: 22px 12px; font-size: 12px; line-height: 1.8; color: #5a6c94; text-align: center; }
    .lab.idle .idle { display: block; }
    .lab.idle .erow, .lab.idle .dsc, .lab.idle .pipe, .lab.idle .mx, .lab.idle .ltools, .lab.idle .lcharts { display: none; }
    .lab .idle button { margin-top: 10px; }
    /* 自由探索提示：DRAFT 是自由草稿时显示一条说明（没内容时整块收起） */
    .lab .rohint { flex: none; margin: 2px 0 4px; padding: 4px 6px; background: #17223f; border-left: 2px solid #4ae0ff; border-radius: 4px; font-size: 11px; line-height: 1.6; color: #9fb0d6; }
    .lab .rohint:empty { display: none; }
    .lab .erow { flex: none; display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
    .lab .erow .ord { flex: none; color: #4ae0ff; font-size: 14px; font-weight: 700; }
    .lab input.ttl { flex: 1 1 auto; min-width: 0; box-sizing: border-box; background: #0a1022; color: #e8eefc; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; font-size: 13px; font-weight: 700; padding: 2px 4px; }
    .lab textarea.dsc { flex: none; width: 100%; box-sizing: border-box; margin-bottom: 4px; background: #0a1022; color: #8fa2c8; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; font-size: 11px; padding: 2px 4px; resize: vertical; }
    /* 页面自绘模态（不用浏览器原生 dialog / alert / confirm）：遮罩 + 面板，点遮罩或 Esc = 取消 */
    .modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(4,8,18,0.62); }
    .modal[hidden] { display: none; }
    .modal-panel { box-sizing: border-box; background: #0e1630; color: #bcc8e8; border: 1px solid rgba(255,255,255,0.22); border-radius: 8px; padding: 14px 16px 12px; min-width: 340px; max-width: 460px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
    .dlg-t { font-size: 14px; font-weight: 700; color: #e8eefc; margin-bottom: 6px; }
    .dlg-b { font-size: 12px; line-height: 1.7; color: #8fa2c8; white-space: pre-line; margin-bottom: 12px; }
    .dlg-b[hidden] { display: none; }
    .dlg-f { display: flex; gap: 8px; justify-content: flex-end; }
    /* 格子右上角 ⋯ 弹出的格级菜单：编辑 / 另存为 / 删除。挂在 body 上（格内浮层会被 grid 行布局挤变形），
       position:fixed + getBoundingClientRect 用视口坐标，不用管滚动量 */
    .cmenu { position: fixed; z-index: 30; min-width: 132px; padding: 4px; background: #0e1630; border: 1px solid rgba(255,255,255,0.22); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.55); }
    .cmenu button { display: block; width: 100%; padding: 4px 8px; background: none; border: 0; border-radius: 4px; color: #bcc8e8; font-size: 12px; text-align: left; cursor: pointer; }
    .cmenu button:hover { background: #263a60; color: #fff; }
    .cmenu button.danger:hover { background: #6b2440; }
    /* 中心面板：标签条 + 面包屑 + 各标签一块 pane（.dsplist 目录列表 / .dspview 单文件链路），装什么由 open() 决定 */
    .crumb { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 8px; font-size: 12px; color: #8fa2c8; }
    .crumb .seg { padding: 1px 7px; background: #141d34; border: 1px solid rgba(255,255,255,0.10); border-radius: 5px; color: #8fa2c8; cursor: pointer; }
    .crumb .seg:hover { background: #263a60; color: #fff; }
    .crumb .seg.now { cursor: default; color: #cbeeff; background: rgba(74,224,255,0.10); border-color: rgba(74,224,255,0.45); }
    .crumb .sp { color: #45557a; }
    /* 播放按钮行与参数条：模板条目（.tcard / .dspview）用这一套 —— 标题 → 管道 → 画布 → 参数条+播放按钮 */
    .prow { display: flex; justify-content: flex-end; gap: 4px; margin-top: 3px; }
    .prow button { flex: none; min-width: 22px; height: 18px; padding: 0 5px; background: #141d34; color: #8fa2c8; border: 1px solid rgba(255,255,255,0.10); border-radius: 5px; font-size: 11px; line-height: 1; cursor: pointer; }
    .prow button:hover { background: #263a60; color: #fff; }
    .foot { margin-top: auto; }          /* 参数条 + 播放按钮贴底，各卡画布位置一致 */
    .tcard.paused canvas.mx, .dspview.paused canvas.mx { opacity: 0.55; }
    .tcard.paused .ttitle { color: #7d8db3; }
    /* dsplistview：某个目录的列表视图，一格一个文件，小画布即取即看 */
    .dsplist { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; align-content: start; }
    /* 对比视图的标题条：横跨整行（.dsplist 是网格布局，得让它占满一行） */
    .cmpv-head { grid-column: 1 / -1; padding: 2px 2px 4px; font-size: 12px; color: #8fa2c8; }
    .dsplist .tcard.cmpv { border-style: dashed; }        /* 对比视图卡片：虚线边框，与 DSP 卡片区分 */
    /* 缺失目标的占位卡：压暗 + 橙色标题，不可点（不绑任何事件） */
    .dsplist .tcard.missing { border-style: dotted; opacity: 0.55; cursor: default; }
    .dsplist .tcard.missing .ttitle { color: #ffb347; }

    /* dspview：单个文件的链路视图 —— 大画布 + 逐级算子 + 入口按钮 */

<!-- DSP 处理核心：运行时 → 编译器 → 各算子模块（顺序有意义，模块必须在 Compile.js 之后） -->
<script src="/content/Functions/Processor.js"></script>
<script src="/content/Functions/Compile.js"></script>
<script src="/content/Functions/Id.js"></script>
<script src="/content/Functions/Inv.js"></script>
<script src="/content/Functions/Log.js"></script>
<script src="/content/Functions/Log01.js"></script>
<script src="/content/Functions/Pow.js"></script>
<script src="/content/Functions/Rank.js"></script>
<script src="/content/Functions/Rescale.js"></script>
<script src="/content/Functions/Tanh.js"></script>
<script src="/content/Functions/Zscore.js"></script>
<script src="/content/Functions/TopK.js"></script>
<script>
(function () {
    'use strict';

    // ---------- 常量（与主面板同一数据口径） ----------
    const CHART_SEC = 5, CHART_HZ = 50, CHART_N = CHART_SEC * CHART_HZ, SFM_PC = 12;
    const KEY_LO = 21, KEY_HI = 108;
    // A4 音准参考：以主面板的 localStorage['a4Ref'] 为准（同源跨页共享），本页不重复提供切换控件。
    // 主面板改 A4 后 storage 事件在同源其他页面触发 → 跟随；pcBins 缓存键含 A4，下一帧自动重建映射。
    let A4 = (() => { try { return parseFloat(localStorage.getItem('a4Ref')) || 440; } catch (e) { return 440; } })();
    window.addEventListener('storage', (ev) => {
        if (ev.key !== 'a4Ref') return;
        const v = parseFloat(ev.newValue) || 440;
        if (v !== A4) A4 = v;
    });
    const SFM_SPAN = 70;   // 字节→dB 映射跨度（MIN_DB -100 / MAX_DB -30）
    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    // 十二音级配色（OKLCH 等亮度，逐字复制自主面板）
    const SEMI_L = 0.75, SEMI_C = 0.13;
    function oklchRgb(L, C, Hdeg) {
        const h = Hdeg * Math.PI / 180;
        const A = C * Math.cos(h), B = C * Math.sin(h);
        const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3;
        const m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3;
        const s = (L - 0.0894841775 * A - 1.2914855480 * B) ** 3;
        const gm = (x) => { x = Math.max(0, Math.min(1, x)); return x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055; };
        return [
            Math.round(gm(+4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s) * 255),
            Math.round(gm(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s) * 255),
            Math.round(gm(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s) * 255)
        ];
    }
    const SEMI_RGB = Array.from({ length: SFM_PC }, (_, i) => oklchRgb(SEMI_L, SEMI_C, i * 30));
    // ---------- 管道计算（纯函数区，可独立数值测试） ----------
    // 管道：1-v（反相）→ 按序执行 ch.stages 的每一级 → OUTPUT
    // 变换注册表 OPS，两种 kind：
    //   scalar：逐音级独立映射 f(x,p)→x'（幂/log/tanh…）
    //   vector：拿整条 12 音级向量 f(a,p)→a（就地改写）。min/max、μ/σ、排秩这类必须跨音级看全貌的
    //           归一化只有靠跨音级上下文才能算，通用链装不下，所以显式区分而不是硬塞进 scalar。
    // 每级自带 params spec（{key,label,type,min,max,step,def}），由 buildParams 统一渲染成控件。
    // 一级 = { id, on, p }：id 指向 OPS，on=false 跳过，p 存该级实参（默认值由 buildParams 填）。
    const OPS = {
        // 反相：原本写死在 computeChart 里的固定第一步，现在降级为普通可选算子（可删、可换序、可重复）。
        inv:  { label: '1-v 反相', kind: 'scalar', f: (x) => 1 - x, params: [] },
        id:    { label: '恒等', kind: 'scalar', f: (x) => x, params: [] },
        pow:   { label: '幂', kind: 'scalar', f: (x, p) => Math.pow(Math.max(0, x), p.n),
                 params: [{ key: 'n', label: 'n', type: 'range', min: 0.1, max: 4, step: 0.1, def: 2 }] },
        log:   { label: 'log', kind: 'scalar', f: (x) => Math.log(Math.max(0, x) + 1e-3), params: [] },
        tanh:  { label: 'tanh', kind: 'scalar', f: (x, p) => 0.5 + 0.5 * Math.tanh(p.k * (x - 0.5)) / Math.tanh(p.k / 2),
                 params: [{ key: 'k', label: 'k', type: 'range', min: 1, max: 20, step: 0.5, def: 6 }] },
        // log01：0~1 上做 log 后线性重映射回 0~1（0→0、1→1）
        log01: { label: 'log(0~1)', kind: 'scalar', f: (x) => { const e = 1e-3; return (Math.log(e + (1 - e) * x) - Math.log(e)) / -Math.log(e); }, params: [] },
        rescale: { label: '重缩放', kind: 'vector', f: (a) => {
            let mn = Infinity, mx = -Infinity;
            for (let i = 0; i < SFM_PC; i++) { const v = a[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
            const rg = mx - mn;
            for (let i = 0; i < SFM_PC; i++) a[i] = rg > 1e-9 ? (a[i] - mn) / rg : 0.5;   // 极差≈0 → 居中
        }, params: [] },
        zscore: { label: 'z-score', kind: 'vector', f: (a, p) => {
            let sum = 0;
            for (let i = 0; i < SFM_PC; i++) sum += a[i];
            const mean = sum / SFM_PC;
            let q = 0;
            for (let i = 0; i < SFM_PC; i++) { const d = a[i] - mean; q += d * d; }
            const sd = Math.sqrt(q / SFM_PC), zm = p.zMax || 2;
            for (let i = 0; i < SFM_PC; i++) {          // 均值/σ 先算完再写，避免边写边读
                const z = sd > 1e-9 ? (a[i] - mean) / sd : 0;
                a[i] = (Math.max(-zm, Math.min(zm, z)) + zm) / (2 * zm);
            }
        }, params: [{ key: 'zMax', label: '±z', type: 'range', min: 1, max: 4, step: 0.1, def: 2 }] },
        rank: { label: '分位秩', kind: 'vector', f: (a) => {
            let mn = Infinity, mx = -Infinity;
            for (let i = 0; i < SFM_PC; i++) { const v = a[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
            if (mx - mn <= 1e-9) { for (let i = 0; i < SFM_PC; i++) a[i] = 0.5; return; }
            for (let i = 0; i < SFM_PC; i++) rankTmp[i] = a[i];   // 排秩要读原值：先快照再写回
            for (let i = 0; i < SFM_PC; i++) {
                const x = rankTmp[i];
                let less = 0, equal = 0;
                for (let q = 0; q < SFM_PC; q++) {
                    if (rankTmp[q] < x - 1e-12) less++;
                    else if (rankTmp[q] <= x + 1e-12) equal++;
                }
                a[i] = (less + (equal - 1) / 2) / (SFM_PC - 1);   // 并列取平均秩
            }
        }, params: [] },
    };

    // ---------- 文档模型：一份可序列化 JSON = 视图状态 + 「我的图」的内存镜像 ----------
    // { v, charts: [ {id, title, desc, stages:[{id,on,p,collapsed}]}], view }
    //   id      = 文件名（'untitled'、'untitled-2'…），与 content/My dsps/<id>.json 一一对应
    //   stages  按 id 查 OPS 注册表；非法 id / 越界参数在 sanitizeStages 里就地纠正
    // 内容真相全在 content/ 下：Templates/ 只读预设、My dsps/ 我的图；DOC 只跟磁盘同步 + 存视图状态。
    // lastSaved 是最近一次存进服务端的 JSON；两者不等 = 状态位报"未落盘"。
    const DOC_V = 1, LEGACY_BROWSER_KEY = 'matrixDoc';
    const MAX_STAGES = 8;                        // 与"加一级"上限一致
    // 历史内置 id（旧文档里的 c1…c8 / lab / input）：加载时丢弃，也不当"我的图"处理
    const BUILTIN_IDS = new Set(['input', 'lab', 'c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8']);
    const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
    function ordLabel(n) { return n >= 1 && n <= 20 ? CIRCLED[n - 1] : '(' + n + ')'; }
    const cloneStage = (s) => ({ id: s.id, on: s.on, p: { ...s.p }, collapsed: s.collapsed });
    // 存档比对用的规范形式：p 的键排序，避免同一份数据仅因键序不同被误判成"改过"
    function sortObj(o) { const r = {}; for (const k of Object.keys(o).sort()) r[k] = o[k]; return r; }
    function entryJson(e) {
        return JSON.stringify({
            id: e.id, title: e.title, desc: e.desc,
            stages: e.stages.map((s) => ({ id: s.id, on: s.on, p: sortObj(s.p), collapsed: !!s.collapsed })),
        });
    }
    // 「自由探索」草稿（dspEditorView 的默认内容）：反相 → 幂 → 重缩放 → log(0~1)，演示三种 kind 的位置差异。
    // 它**不是** DOC 条目、不落盘：只是右栏编辑器里的一条临时链，按「保存」才另存为一条「我的图」。
    // 声明放在这里而不是编辑器段：初始化时就可能用到，放到后面会撞 TDZ
    const SCRATCH_ID = '@scratch';
    const SCRATCH_STAGES = [{ id: 'inv', on: true, p: {} }, { id: 'pow', on: true, p: {} }, { id: 'rescale', on: true, p: {} }, { id: 'log01', on: true, p: {} }];
    function defaultScratchEntry() {
        return {
            id: SCRATCH_ID, title: '自由探索 · 级联',
            desc: '随手拼一条链看效果；不落盘 —— 按「保存」会另存为一条「我的图」',
            stages: labDefaultCollapse((sanitizeStages(SCRATCH_STAGES) || []).map((s) => ({ ...s }))),
        };
    }
    function defaultDoc() {
        return {
            v: DOC_V,
            charts: [],        // 内容真相在磁盘：charts 由 mergeDspsIntoDoc() 从 content/My dsps/ 填
            view: emptyView(),
        };
    }
    // 视图状态独立于内容：暂停名单 + 每块画布的画面快照（PNG 落盘在 content/Snapshots/，这里只记地址）+ 右栏开着哪些标签。
    // 放在根上而不是每格里 —— 只读的原始输入格与模板条目也归它管，而且它跟标题/级联这种"内容"不是一回事。
    // 暂停/快照的 key 有两种：格子 id（input / c1… / untitled…）与文件路径（content/Templates/x.json 等），
    // 模板条目也能暂停、也存快照，所以两种 key 都要在清洗时留下。
    // 两类条目都能暂停/存快照，key 就是各自的路径；清单是异步拉的，清洗那一刻可能还是空的
    // → 只能按形态认：content/ 下的 .json / .cmpv（文件）、content/ 下以 / 结尾的目录（收起状态）。
    const DIR_TPL = 'content/Templates/', DIR_DSP = 'content/My dsps/', CMPV_DIR = 'content/Compares/';
    const CONTENT_ROOT = 'content/';     // 内容根（= ROOT）：显示路径时省略这段前缀，content 本身不写出来
    const FILE_KEY_RE = /^content\/(?:[^/]+\/)*[^/]+\.(?:json|cmpv)$/;
    const DIR_KEY_RE = /^content\/(?:[^/]+\/)*$/;
    function isFileKey(k) { return typeof k === 'string' && FILE_KEY_RE.test(k); }
    function dirOf(file) { const i = file.lastIndexOf('/'); return i < 0 ? '' : file.slice(0, i + 1); }
    function stemOf(file) { const i = file.lastIndexOf('/'); const n = i < 0 ? file : file.slice(i + 1); return n.replace(/\.[^./]+$/, ''); }
    // content/ = ROOT：显示路径时省掉这段前缀与结尾的斜杠（'content/Templates/' → 'Templates'）
    function relToRoot(path) {
        const p = path.indexOf(CONTENT_ROOT) === 0 ? path.slice(CONTENT_ROOT.length) : path;
        return p.replace(/\/+$/, '');
    }
    function isDspFile(file) { return dirOf(file) === DIR_DSP; }
    function isCmpvFile(file) { return typeof file === 'string' && file.endsWith('.cmpv'); }   // 对比视图
    // 各面板的标签状态：面板名 → { tabs: 打开顺序, active: 活跃那个 }。
    //   center（内容面板）的 key = content/ 下的路径（文件或目录）；right（编辑器）的 key = 条目 id。
    function emptyPanels() { return { center: { tabs: [], active: '' }, right: { tabs: [], active: '' } }; }
    // expanded：目录的展开清单（目录默认收起，只记展开的）；paused/shots/panels 同理，都是视图状态
    function emptyView() { return { paused: [], shots: {}, expanded: [], panels: emptyPanels() }; }
    function sanitizeView(raw, ids) {
        const v = emptyView();
        if (!raw || typeof raw !== 'object') return v;
        const set = new Set(ids);
        const known = (k) => set.has(k) || isFileKey(k);
        if (Array.isArray(raw.paused)) {
            v.paused = raw.paused.filter(known).slice(0, 64);
        }
        // 展开的目录：只认 content/ 下以 / 结尾的路径（目录来自磁盘，形态即可判定）
        // 老存档里的 collapsed（语义相反）直接忽略 —— 读不到 expanded 就是默认全收起
        if (Array.isArray(raw.expanded)) {
            v.expanded = raw.expanded.filter((d) => typeof d === 'string' && DIR_KEY_RE.test(d) && d !== 'content/');
        }
        // 各面板的标签：center 收 content/ 下的路径（文件或目录），right 只收这一份存档认得的条目 id。
        // 去重 + 截断都做一遍（存档是手写 / 老版本产的，形态不可信）；active 落空就退回第一个。
        const dedup = (list, ok) => {
            const seen = new Set(), out = [];
            for (const k of (Array.isArray(list) ? list : [])) {
                if (!ok(k) || seen.has(k)) continue;
                seen.add(k); out.push(k);
            }
            return out.slice(0, 24);
        };
        const pathOk = (k) => typeof k === 'string' && (isFileKey(k) || (DIR_KEY_RE.test(k) && k !== CONTENT_ROOT));
        const idOk = (k) => typeof k === 'string' && set.has(k);
        const pIn = (raw.panels && typeof raw.panels === 'object') ? raw.panels : null;
        const cIn = (pIn && pIn.center && typeof pIn.center === 'object') ? pIn.center : null;
        const rIn = (pIn && pIn.right && typeof pIn.right === 'object') ? pIn.right : null;
        // 只有一根 openedTabs 的老存档：那时只有右栏有标签 → 整根迁到 panels.right
        const rSrc = rIn ? rIn.tabs : raw.openedTabs;
        const cTabs = dedup(cIn ? cIn.tabs : [], pathOk);
        const rTabs = dedup(rSrc, idOk);
        const pick = (list, want) => (list.indexOf(want) >= 0 ? want : (list[0] || ''));
        v.panels = {
            center: { tabs: cTabs, active: pick(cTabs, cIn && cIn.active) },
            right: { tabs: rTabs, active: pick(rTabs, rIn && rIn.active) },
        };
        if (raw.shots && typeof raw.shots === 'object') {
            for (const [k, url] of Object.entries(raw.shots)) {
                // 只收本项目认得的 key + 指向 /api/shots/ 的地址：图本身在 content/Snapshots/，存档里不塞二进制
                if (known(k) && typeof url === 'string' && url.startsWith('/api/shots/')) {
                    v.shots[k] = url;
                }
            }
        }
        return v;
    }
    // 整份存档的入口校验：非对象 / charts 非数组 → 判无效（退回默认）。
    // 单格：title 空 → "未命名"、超长截断；desc 非字符串 → 空串；id 缺失或重复 → 丢这一格（宁可少一格也不错配）
    function sanitizeDoc(raw) {
        if (!raw || typeof raw !== 'object' || !Array.isArray(raw.charts)) return null;
        const seen = new Set(), charts = [];
        for (const c of raw.charts) {
            if (!c || typeof c !== 'object') continue;
            if (typeof c.id !== 'string' || !c.id || seen.has(c.id)) continue;
            if (BUILTIN_IDS.has(c.id)) continue;         // 历史内置 id（c1…c8 / lab / input）不再是文档条目
            seen.add(c.id);
            const title = typeof c.title === 'string' ? c.title.trim().slice(0, 60) : '';
            charts.push({
                id: c.id,
                title: title || '未命名',
                desc: typeof c.desc === 'string' ? c.desc.slice(0, 400) : '',
                stages: (sanitizeStages(c.stages) || []).slice(0, MAX_STAGES),
            });
        }
        const ids = charts.map((c) => c.id);
        return { v: DOC_V, charts, view: sanitizeView(raw.view, ids) };
    }
    function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    // ---------- 存档：走后端 /api/doc，落点是 content/ViewState/dsp-lab.json ----------
    // 左栏 = 带预览的文件列表，右栏 = 编辑器标签页；文档本体只有一份，跟着项目走。
    // 这里是异步的，所以页面先用出厂配置把 UI 立起来，拿到文档再整块重建。
    let DOC = defaultDoc();
    let lastSaved = entryDocJson(DOC);   // 已存盘基线；出厂配置先当基线，避免刚进来就报"未落盘"
    let storeState = 'load';              // load → ok | offline | error，用于状态位与提示
    let storeMsg = '';
    function entryDocJson(d) { return JSON.stringify({ v: DOC_V, charts: d.charts, view: d.view || emptyView() }); }
    async function loadDocFromServer() {
        let res;
        try {
            res = await fetch('/api/doc', { cache: 'no-store' });
        } catch (e) {
            storeState = 'offline'; storeMsg = '连不上后端，本次改动只在内存里';
            return { doc: legacyOrDefault(), migrate: null };
        }
        let body = null;
        try { body = await res.json(); } catch (e) { body = null; }
        if (res.ok && body && body.exists && body.doc) {
            const doc = sanitizeDoc(body.doc);
            if (doc) {
                storeState = 'ok';
                return { doc, migrate: null };
            }
            storeState = 'error'; storeMsg = '服务端文档结构不对，已退回出厂配置';
            return { doc: defaultDoc(), migrate: null };
        }
        if (res.ok && body && body.exists === false) {
            // 服务端还没有文档：把浏览器里旧版本地存档顶上去（迁移只做一次），没有就用出厂配置
            const legacy = legacyOrDefault();
            const fromBrowser = sanitizeDoc(parseMaybe(safeGet(LEGACY_BROWSER_KEY)));
            storeState = 'ok';
            return { doc: legacy, migrate: fromBrowser || null };
        }
        storeState = 'error';
        storeMsg = (body && body.error) ? String(body.error).slice(0, 80) : `服务端返回 ${res.status}`;
        return { doc: legacyOrDefault(), migrate: null };
    }
    function parseMaybe(s) { try { return JSON.parse(s || 'null'); } catch (e) { return null; } }
    // 老版本地存档（matrixDoc）→ 出厂配置
    function legacyOrDefault() {
        return sanitizeDoc(parseMaybe(safeGet(LEGACY_BROWSER_KEY))) || defaultDoc();
    }
    // 保存：整份覆盖写到服务端。先落内存基线（界面立刻变干净），失败再退回"未落盘"并说明原因。
    // quiet：后台顺手写的视图状态（暂停 / 开着的标签）——不动"保存中…"这个给用户按保存看的状态位
    let saving = false;
    async function saveDocToServer(doc, quiet) {
        if (!quiet) { saving = true; refreshDirty(); }
        try {
            const res = await fetch('/api/doc', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(doc),
            });
            const body = await res.json().catch(() => null);
            if (!res.ok) throw new Error((body && body.error) || `HTTP ${res.status}`);
            storeState = 'ok'; storeMsg = '';
            return true;
        } catch (e) {
            storeState = 'error';
            storeMsg = `保存失败：${(e && e.message ? e.message : e).toString().slice(0, 80)}`;
            return false;
        } finally {
            saving = false;
            refreshDirty();
        }
    }
    function adoptDoc(doc) {
        DOC = doc;
        lastSaved = entryDocJson(DOC);

        // right 同理，活跃的那个默认取第一个，一个都不剩就回空态。
        // charts 此刻还可能是空的（本文档的 charts 由 mergeDspsIntoDoc 从磁盘填）——那种情况下先原样收下，
        // 等 mergeDspsIntoDoc() 里的 pruneTabs() 拿真实条目清单清掉已删的那些。
        const pv = (doc.view && doc.view.panels) || null;
        restoreCenter(pv && pv.center);
        const wantTabs = ((pv && pv.right && pv.right.tabs) || (doc.view && doc.view.openedTabs) || []).slice();
        openTabs = DOC.charts.length ? wantTabs.filter((id) => !!entryOf(id)) : wantTabs;
        selected = (pv && pv.right && openTabs.indexOf(pv.right.active) >= 0) ? pv.right.active : (openTabs[0] || '');
        bindDraft();
        syncEditorInputs();
        labSync(true);
        applyView();          // 还原播放状态 + 把存档里的快照画回画布
        refreshDirty();
    }


    // ---------- 每格一份待写回的草稿（右栏的 editingObject） ----------
    // drafts: id → { d: 该格的深拷贝, base: 克隆那一刻 DOC 的快照 JSON }
    //   按需建（没点过的格子不占内存）、切换目标不清（在 ② ③ 之间来回切，两边改动各自留着）
    //   每份草稿连各级 p 都是新对象 —— 右栏永远碰不到 DOC 里的原始对象
    // 声明放在这里（编辑器初始化之前）：刷新编辑器状态要用 draftDirty() 判断草稿是否脏
    const drafts = new Map();
    let DRAFT = null;             // 当前选中格那一份草稿的引用，省得逐级卡/输入框到处按 id 取
    function cloneEntry(e) { return { id: e.id, title: e.title, desc: e.desc, from: e.from, stages: e.stages.map(cloneStage), readonly: !!e.readonly }; }
    function draftOf(id) {
        let r = drafts.get(id);
        if (!r) {

            if (!e) return null;
            r = { d: cloneEntry(e), base: entryJson(e) };   // 基线也走 entryJson：cloneEntry 带了 readonly 标记，
                                                           // 直接 JSON.stringify 两边键集不同 → 每格恒判为脏
            drafts.set(id, r);

    }
    function bindDraft() { const r = draftOf(selected); DRAFT = r ? r.d : null; }
    function draftDirty(id) { const r = drafts.get(id || selected); return !!r && entryJson(r.d) !== r.base; }
    function pendingIds() { const out = []; for (const id of drafts.keys()) if (draftDirty(id)) out.push(id); return out; }

    const chartCount = CHART_N;   // 固定满窗（滚动示波器式，与主面板一致）
    const pipeTmp = new Float64Array(SFM_PC);   // 单点 12 音级工作区（computeChart 同步调用，不可跨图复用）
    const rankTmp = new Float64Array(SFM_PC);   // rank 就地改写前先快照原值

    // 旧的整窗批算：sfmLines（12×CHART_N，窗口序）→ ch.out（同布局，0~1 归一值）
    // 现役渲染已经不用它了（见下面的 stepChart）；它保留下来当 dspSelfTest 的**基准实现**，
    // 用来证明新链路逐点等价。stages 是唯一事实来源，两条路径读的是同一份。
    function computeChart(ch, sfmLines) {
        const out = ch.out, stages = ch.stages;
        for (let p = 0; p < chartCount; p++) {
            // 1) 取原始 SFM（不再预反相）
            for (let pc = 0; pc < SFM_PC; pc++) pipeTmp[pc] = sfmLines[pc * CHART_N + p];
            // 2) 按序执行各级：scalar 逐音级映射，vector 整条一起看
            for (let s = 0; s < stages.length; s++) {
                const st = stages[s];
                if (!st.on) continue;
                const op = OPS[st.id];
                if (op.kind === 'scalar') for (let pc = 0; pc < SFM_PC; pc++) pipeTmp[pc] = op.f(pipeTmp[pc], st.p);
                else op.f(pipeTmp, st.p);
            }
            // 3) 夹到 0~1 上屏（归一化后变换也在此之前跑完，与旧实现同序）
            for (let pc = 0; pc < SFM_PC; pc++) out[pc * CHART_N + p] = Math.max(0, Math.min(1, pipeTmp[pc]));
        }
    }

    // ---------- 现役处理核心：逐列推进（取代每帧整窗重算） ----------
    // 数据布局与 sfmDisp 一致：**绝对环形下标**。第 i 列的输入 = sfmDisp[pc*CHART_N + i]，
    // 输出写回 ch.out[pc*CHART_N + i]；画图时用 ringMap 把窗口位置 p 映射回绝对下标。
    //
    // 为什么可以逐列：现有算子都是"逐帧纯函数"，第 i 列的输出只取决于第 i 列的输入。
    // 旧模型每帧把 250 列全重算一遍（等于同样结果算 60 次/秒）；现在只在 chartWrite 前进时
    // 算新进来的那几列。将来接有状态的算子（WIN/BUF 包络、延迟线）时，这个模型才是对的
    // —— 状态天然"一列推进一次"。
    const ringMap = new Uint16Array(CHART_N);    // ringMap[p] = (chartWrite + p) % CHART_N
    let ringMapAt = -1;
    function syncRingMap() {
        if (ringMapAt === chartWrite) return;    // chartWrite 20ms 才动一次，不必每帧重算
        ringMapAt = chartWrite;
        for (let p = 0; p < CHART_N; p++) ringMap[p] = (chartWrite + p) % CHART_N;
    }

    // 级联签名：结构（算子 id / 启停 / 参数）一变就要重编译并整窗重算
    function stageSig(stages) {
        let s = '';
        for (let i = 0; i < stages.length; i++) {
            const st = stages[i];
            s += st.id + ':' + (st.on === false ? 0 : 1) + ':' + JSON.stringify(st.p || {}) + '|';
        }
        return s;
    }

    // 这一格"应该"编出几个实例（停用的级不算；注册表还没就绪就返回 -1，别瞎判）
    function wantInstances(stages) {
        if (typeof getFunction !== 'function') return -1;
        let n = 0;
        for (const s of stages) if (s.on !== false && getFunction(s.id)) n++;
        return n;
    }

    // 确保这一格有可用处理器；结构变了就重编译并清空历史
    function prepChart(ch) {
        const stages = ch.stages || [];
        const sig = stageSig(stages);
        if (ch.pipeSig === sig && (ch.proc || ch.procFailed)) {
            if (!ch.proc) return;                       // 编译失败过，不用重试
            // 编译产物必须和"启用着的级数"对得上。对不上说明这份 proc 是在另一个结构下编的
            // （典型：首帧 stages 还是空的、编出个整条旁路的空链），拿它继续写 ring 会把
            // 原始 SFM 当结果画出来 —— 强制重编 + 整窗重算。
            const want = wantInstances(stages);

        ch.procFailed = false;

            // 直接把 INPUT 原样返回，等于整条链被旁路（所有画布画成同一张原始 SFM）。
            ch.st.DSP_ARR = [proc];
        } catch (e) {

    // 算一列（绝对下标 idx）：取输入 → DSPRun → 夹紧写回 ch.out
    function runColumn(ch, idx) {
        const inp = new Float64Array(SFM_PC);        // 旧实现工作区是 Float64，保持同一精度路径
        for (let pc = 0; pc < SFM_PC; pc++) inp[pc] = sfmDisp[pc * CHART_N + idx];

        try { r = DSPRun(ch.st); }
        catch (e) { ch.procErr = String((e && e.message) || e); return; }
        if (ch.st.ERROR) { ch.procErr = ch.st.ERROR.key + ' ' + ch.st.ERROR.msg; return; }
        const out = ch.out;
        for (let pc = 0; pc < SFM_PC; pc++) out[pc * CHART_N + idx] = Math.max(0, Math.min(1, r[pc]));
    }

    // 模运算下"落后正好 250 帧"和"没有新数据"都是 0，会让停过一阵的画布永远落后一整圈。
    function stepChart(ch) {
        if (!ch.proc) return;
        const full = () => {
            for (let i = 0; i < CHART_N; i++) runColumn(ch, i);
            ch.lastIdx = chartWrite;
            ch.lastSeq = chartSeq;
        };
        if (ch.lastSeq === null || ch.lastSeq === undefined) { full(); return; }
        const lag = chartSeq - ch.lastSeq;
        if (lag <= 0) return;                        // 真的没有新样本
        if (lag > 8) { full(); return; }             // 落后一整段（暂停恢复 / 长时间隐藏）→ 整窗重算
        for (let k = 0; k < lag; k++) {

    }
    // ---------- 参数控件工厂（可复用：fn/norm 只声明 params spec 即得控件，防代码膨胀） ----------
    // specs: [{key,label,type:'range'|'number'|'select',min,max,step,def,options,dst}]
    //   dst = 参数写入的目标对象（如某一级 stage.p）；onChg 修改后回调（刷新管道摘要等）
    function buildParams(container, specs, onChg) {
        container.innerHTML = '';
        for (const spec of specs) {
            // 幂等：只在缺键时填默认值。实验台每次重绘都会重跑本函数，
            // 若每次都重置，用户调好的参数会被旁路的改动（停用/换序）冲掉。
            if (!(spec.key in spec.dst)) spec.dst[spec.key] = spec.def;
            const lab = document.createElement('label');
            lab.className = 'ctl';
            lab.textContent = spec.label + ' ';
            let input;
            if (spec.type === 'select') {
                input = document.createElement('select');
                for (const o of spec.options) {
                    const op = document.createElement('option');
                    op.value = o.v; op.textContent = o.t; input.appendChild(op);
                }
            } else {
                input = document.createElement('input');
                input.type = spec.type === 'number' ? 'number' : 'range';
                if (spec.min != null) input.min = spec.min;
                if (spec.max != null) input.max = spec.max;
                if (spec.step != null) input.step = spec.step;
            }
            // 控件初值取 dst 里已有的值（存档 / 上一轮编辑），不是 spec.def：
            // 一律写 def 会让"存档里 n=3.5"的滑杆显示 2，而管道里跑的是 3.5 —— 控件与实际不符
            const initV = spec.dst[spec.key];
            input.value = initV;

                    if (spec.min != null) v = Math.max(spec.min, v);
                    if (spec.max != null) v = Math.min(spec.max, v);

                valEl.textContent = typeof v === 'number' ? (+v).toFixed(2) : String(v);

            lab.appendChild(valEl);

        }
    }
    // 某图的全部参数 spec：按 stages 顺序把每级的 params 摊平（级位由顺序表达，不再加位置前缀）
    function chartParamSpecs(ch) {
        const specs = [];
        for (const st of ch.stages) {
            for (const s of OPS[st.id].params) specs.push({ ...s, dst: st.p, label: s.label });
        }
        return specs;
    }
    // 管道摘要（图标题下方等宽小字，参数/顺序/启用状态改动即时刷新）
    // vector 级加花括号标出（整条链的跨音级断点），停用级用删除线标出（不参与执行）
    function pipeSummary(ch) {
        if (!ch.stages.length) return '原始 SFM → OUTPUT';   // 0 号输入：stages 为空 = 不做任何变换
        const parts = [];
        for (const st of ch.stages) {
            const op = OPS[st.id];
            const fp = Object.entries(st.p).map(([k, v]) => `${k}=${(+v).toFixed(1)}`).join(',');
            const txt = fp ? `${op.label}(${fp})` : op.label;
            const wrapped = op.kind === 'vector' ? `{${txt}}` : `[${txt}]`;
            parts.push(st.on ? wrapped : `~~${txt}~~`);
        }
        return parts.join(' → ') + ' → OUTPUT';
    }
    // ---------- 数据源：与主面板相同的 SSE 流（/stream），逐音级 SFM 滑窗合成 ----------
    const statusEl = document.getElementById('status');
    let freqData = null, binFreqs = null;
    let pcBins = null, pcBinsKey = '';
    function ensurePcBins() {
        if (!freqData || !binFreqs) return;
        const key = binFreqs.length + ':' + A4;
        if (pcBinsKey === key && pcBins) return;
        pcBinsKey = key;
        // 统一按"bin → 最近的音 → 音级"分拣（与后端 OnsetGate / 主面板 CQT 口径一致）
        pcBins = Array.from({ length: SFM_PC }, () => []);
        for (let i = 0; i < binFreqs.length; i++) {
            const note = Math.round(69 + 12 * Math.log2(binFreqs[i] / A4));
            if (note < KEY_LO || note > KEY_HI) continue;
            pcBins[((note % 12) + 12) % 12].push(i);
        }
    }
    // 每采样逐音级 SFM 统计量（Σln m / Σm / n）环形缓冲；显示端按窗 K 滑窗合成 SFM
    const sfmSl = new Float64Array(SFM_PC * CHART_N);
    const sfmSa = new Float64Array(SFM_PC * CHART_N);
    const sfmN  = new Float32Array(SFM_PC * CHART_N);
    const sfmLines = new Float32Array(SFM_PC * CHART_N);   // 显示序缓存 = 冻结的 sfmDisp 重排
    const sfmDisp = new Float32Array(SFM_PC * CHART_N);    // 写入时冻结的显示 SFM（通道主序，下标 pc*CHART_N+idx）
    let sfmWinK = 10;                 // 平坦度时间窗（采样数，50Hz；由全局控件改秒数；写入时冻结，改窗只影响新采样）
    let chartWrite = 0, chartAccum = 0, isRunning = false, lastTs = 0;
    // 累计写入了多少列（单调递增）。判断"某块画布落后多少"只认它：
    // 用 (chartWrite - lastIdx + N) % N 会把"落后正好 250 帧"和"没有新数据"都算成 0。
    let chartSeq = 0;
    // 写入时冻结合成：idx 采样的显示 SFM 按当时窗 K 算一次，此后永不变。
    // 旧的显示端滑窗在左边界截断（最左 K−1 个点窗口不满、随点左移窗口继续变短 →
    // 历史值被改写、左端图像变形），且老样本的历史槽位已被新数据覆盖、显示端无法补算，故移除。
    function freezeSfmDisp(idx) {
        const K = Math.max(1, Math.min(CHART_N, sfmWinK));
        for (let pc = 0; pc < SFM_PC; pc++) {
            let sl = 0, sa = 0, n = 0;
            const base = pc * CHART_N;
            for (let k = 0; k < K; k++) {
                const o = base + ((idx - k + CHART_N) % CHART_N);
                sl += sfmSl[o]; sa += sfmSa[o]; n += sfmN[o];

            sfmDisp[base + idx] = n ? Math.exp(sl / n) / (sa / n) : 0;

    function updateBuffers(dt) {

        while (chartAccum >= 1 / CHART_HZ) {
            chartAccum -= 1 / CHART_HZ;
