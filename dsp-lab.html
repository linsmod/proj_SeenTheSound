    function pendingIds() { const out = []; for (const id of drafts.keys()) if (draftDirty(id)) out.push(id); return out; }
    // 未保存提示按格归属：只报"当前这一格"的草稿状态。
    // 之前是一盏全局灯：改完 ② 再去点 ③，右边还挂着"未保存"，读起来像是 ③ 没保存 —— 其实脏的是 ②。
    // 别的格的待写回状态各有各的位置：卡片上是 ✎、树上是 ✎；右栏在空态时补一句"N 格待写回"当提醒。
    // 成品侧（卡片调参 / 增删格，内存里已生效但磁盘上没有）单独用"未落盘"区分开。
    function refreshDirty() {
        const mine = !!selected && draftDirty(selected);
        const others = pendingIds().filter((id) => id !== selected);
        const n = pendingIds().length;
        const unsaved = entryDocJson(DOC) !== lastSaved;      // 成品侧没存进服务端（草稿不算：那是"未保存"）
        labDirtyEl.textContent = storeState === 'error' ? '存盘失败'
            : storeState === 'offline' ? '离线'
            : saving ? '保存中…'
            : !selected ? (n ? `${n} 处待写回` : (unsaved ? '未落盘' : ''))
            : mine ? `${ordOf(selected)} 未保存` : (unsaved ? '未落盘' : '');
        labDirtyEl.hidden = !labDirtyEl.textContent;
        labDirtyEl.title = storeMsg || (mine && others.length
            ? `另有 ${others.length} 处待写回：${others.map(ordOf).join(' ')}`
            : (!selected && n ? '还有未写回的草稿' : ''));
        labCloseEl.hidden = !selected;        // 空态没有"正在编辑的东西"可关
        labSaveEl.hidden = false;             // 自由探索也允许保存（= 另存为我的图）
        renderTabs();                        // 标签栏：活跃态 / 脏点 / 标题跟着刷
        syncTreeFiles();                     // 树上文件行的选中态也跟着刷
    }
    // 草稿 → 输入框。正在输入的那个框跳过，避免打字时被回写打断
    function syncEditorInputs() {
        if (!DRAFT) return;
        labOrdEl.textContent = ordOf(DRAFT.id);
        labTitleEl.readOnly = false;
        labDescEl.readOnly = false;
        if (document.activeElement !== labTitleEl) labTitleEl.value = DRAFT.title;
        if (document.activeElement !== labDescEl) labDescEl.value = DRAFT.desc;
    }
    // 打开 / 切到某一格（文件行的「编辑」菜单 / dspview 的「✎ 编辑」按钮 / 新建后 / 点标签）。
    // 没开过就压进标签栏；草稿在 drafts 里，切走切回两边改动各自留着。
    function selectChart(id) {
        if (id === selected || !entryOf(id)) return;
        const clean = !archiveDirty();   // 必须先取：改 openedTabs 本身就会让 DOC 与基线不等
        if (!openTabs.includes(id)) openTabs.push(id);
        selected = id;
        savePanels();
        bindDraft();
        syncEditorInputs();
        labSync(true);
        refreshDirty();
        viewAutoSave(clean);
    }
    // 视图状态（暂停 / 快照 / 开着的标签）就在 DOC 里，这类改动本身也算"未落盘"。
    // 成品侧此刻没有别的待落盘改动时顺手写盘；有的话留着 —— 不能替用户把待保存的删格/调参一起交了。
    function viewAutoSave(clean) { if (clean) saveDoc(false); }
    // 各面板的标签状态进存档：内容面板照抄，右栏剔除自由草稿（它不是文档条目）。
    // 活跃项也一起记：重开时回到上次看到的那一条。
    function savePanels() {
        const v = viewOf();
        if (!v.panels) v.panels = emptyPanels();
        v.panels.center = { tabs: center.tabs.slice(), active: center.active };
        v.panels.right = {
            tabs: openTabs.filter((x) => x !== SCRATCH_ID),
            active: openTabs.indexOf(selected) >= 0 ? selected : '',
        };
    }
    // 条目在磁盘上没了（文件为准的合并 / 删除）→ 连带它的标签一起摘；摘到的正是活跃那个就顺位到第一个
    function pruneTabs() {
        openTabs = openTabs.filter((id) => !!entryOf(id));
        if (!entryOf(selected)) selected = openTabs[0] || '';
        savePanels();
    }
    // 关标签（VSCode 那套）：干净的直接关；脏的先问 保存 / 丢弃 / 取消。
    // 关掉的是活跃标签 → 激活它右边那个，右边没有就退到左边；都不剩就回空态。
    async function closeTab(id) {
        if (id !== selected && !openTabs.includes(id)) return;
        if (!entryOf(id) || !draftDirty(id)) { dropTab(id); return; }
        const pick = await ask({
            title: `${ordOf(id)} 未保存`,
            body: `「${tabTitle(id)}」还有没保存的改动。\n保存 = 写回并落盘（自由探索会另存为一条「我的图」）；丢弃 = 只丢掉这份草稿。`
                + (archiveDirty() ? '\n另外还有改动没落盘（参数调整 / 增删图），保存会一并写盘。' : ''),
            buttons: [
                { text: '保存并关闭', cls: 'primary', value: 'save' },
                { text: '丢弃改动', value: 'drop' },
                { text: '取消', value: '' },
            ],
        });
        if (pick === 'save') { await saveDoc(); dropTab(id); }
        else if (pick === 'drop') { drafts.delete(id); dropTab(id); }
    }
    // 从标签栏摘掉（不再问）。删除条目 / 保存时自由草稿让位也走这条
    function dropTab(id) {
        const i = openTabs.indexOf(id);
        if (i < 0) return;
        const clean = !archiveDirty();
        openTabs.splice(i, 1);
        if (selected === id) selected = openTabs[i] || openTabs[i - 1] || '';
        savePanels();
        bindDraft();                 // → 顺位那条的草稿，或 null（右栏回到空态）
        syncEditorInputs();
        labSync(true);
        viewAutoSave(clean);
    }
    // 右上 ✕ = 关掉当前活跃标签
    async function closeEditor() { if (selected) await closeTab(selected); }
    // 提交：把待写回的草稿深拷贝回各自 DOC 条目，再整份存到服务端。
    // 自由探索草稿先另存为一条「我的图」（会建文件并跳到它）。存盘失败不吞：lastSaved 保持旧值 → 状态位继续报"未落盘"。
    async function saveDoc(commitDrafts) {
        const commit = commitDrafts !== false;      // 播放控制触发的存盘只写视图状态，不动草稿
        if (commit) {
            if (drafts.has(SCRATCH_ID)) {           // 自由探索 → 另存为一条「我的图」
                const r = drafts.get(SCRATCH_ID);
                drafts.delete(SCRATCH_ID);
                const si = openTabs.indexOf(SCRATCH_ID);   // 这份草稿变成新条目了，自由标签让位（addUserChart 会把新条目开成标签）
                if (si >= 0) openTabs.splice(si, 1);
                addUserChart({ title: r.d.title, desc: r.d.desc, stages: r.d.stages.map(cloneStage) });
            }
            for (const [id, r] of drafts) {
                const e = entryOf(id);
                if (!e) continue;                   // 条目已被删 → 没有可写回的地方
                e.title = r.d.title.trim().slice(0, 60) || '未命名';
                e.desc = r.d.desc.slice(0, 400);
                e.stages = r.d.stages.slice(0, MAX_STAGES).map(cloneStage);
            }
            drafts.clear();                                // 写回后草稿与成品同形，没必要留着
            bindDraft();
            syncEditorInputs(); labSync(true);
        }
        const prev = lastSaved;
        lastSaved = entryDocJson(DOC);                     // 先乐观置为已存：界面立刻干净
        refreshDirty();
        const ok = await saveDocToServer(DOC, !commit);     // 只写视图的后台存盘，不亮"保存中…"
        if (ok && commit) await saveAllDspFiles();          // 我的图各写各的文件（内容同源）
        lastSaved = ok ? entryDocJson(DOC) : prev;         // 失败就把基线退回去，状态位重新亮起来
        refreshDirty();
    }
    // id = 文件名（untitled、untitled-2…，与对比视图同一套命名），所以要把磁盘清单里的名字也避开
    function newChartId() {
        const used = (id) => DOC.charts.some((c) => c.id === id) || FILES.some((it) => stemOf(it.file) === id);
        if (!used('untitled')) return 'untitled';
        let i = 2;
        while (used('untitled-' + i)) i++;
        return 'untitled-' + i;
    }
    // 复制：把来源深克隆一份成新的「我的图」，并跳到该副本接着编辑。来源那一份不动。
    // srcId 缺省 = 用当前草稿（"把右栏这条链固化成一张图"）；自由探索草稿也能这样固化。
    function cloneAsNew(srcId) {
        const src = srcId ? entryOf(srcId) : DRAFT;
        if (!src) return;
        addUserChart({
            title: src.title.replace(/ 副本( \d+)?$/, '') + ' 副本',
            desc: src.desc,
            stages: src.stages,
        });
    }
    // 落一份新的我的图：深克隆 → 与来源没有任何共享引用。
    // 同步在 content/My dsps/<id>.json 建文件；文件建好后跳到那一条（新建完总得看到它）。
    function addUserChart(spec) {
        const id = newChartId();
        const e = { id, title: spec.title, desc: spec.desc, stages: spec.stages.map(cloneStage) };
        DOC.charts.push(e);
        selectChart(e.id);
        labSync(true); refreshDirty();
        postDsp('/api/dsps', 'POST', { name: id, title: e.title, desc: e.desc, stages: e.stages })
            .then((b) => {
                if (!b || !b.item) return;                 // 建文件失败：内存里这一条还在，提示已经在状态位上
                upsertItem(b.item);
                open({ file: b.item.file });               // 文件就位了再跳，避免视图去取一个还没落盘的文件
            });
        return e;
    }
    // 删除：从 DOC 摘掉 + 删掉它的文件。文件删掉就是删掉，没有"刷新恢复"这回事了。
    async function deleteChart(id) {
        const e = DOC.charts.find((c) => c.id === id);
        if (!e) return;
        const lostDraft = draftDirty(id) ? '\n（这一条还有未保存的草稿，会一起丢掉）' : '';
        const ok = await ask({
            title: `删除「${e.title}」？`,
            body: `会连 content/My dsps/${id}.json 一起删掉。` + lostDraft,
            buttons: [
                { text: '删除', cls: 'danger', value: true },
                { text: '取消', value: false },
            ],
        });
        if (!ok) return;
        removeChart(id);
        if (lostDraft) await ask({ title: '已删除', body: '该条未保存的草稿一并丢弃' + lostDraft, buttons: [{ text: '知道了', cls: 'primary', value: true }] });
    }
    // 批量删除（树里多选后走这条）：只弹一次确认，我的图与对比视图各按自己的删法逐条删，最后清空选择
    async function deleteTreeSelection(ids, cmpvs) {
        const list = ids.filter((id) => DOC.charts.some((c) => c.id === id));
        const cmps = cmpvs.filter(isCmpvFile);
        if (!list.length && !cmps.length) return;
        const body = [
            list.length ? '会连 content/My dsps/ 下对应的 .json 一起删掉，未保存的草稿也一并丢弃。' : '',
            cmps.length ? '对比视图只删这份视图本身，被引用的 DSP 文件不动。' : '',
        ].filter(Boolean).join('\n');
        const ok = await ask({
            title: `删除选中的 ${list.length + cmps.length} 项？`,
            body,
            buttons: [
                { text: '删除', cls: 'danger', value: true },
                { text: '取消', value: false },
            ],
        });
        if (!ok) return;
        for (const id of list) removeChart(id);
        for (const f of cmps) await removeCmpv(f);
        setTreeSel([]);              // 选中的都删了 → 清空选择
    }
    // 真正执行删除（不弹窗）：从 DOC / 磁盘清单摘掉、删掉文件、必要时退回列表
    function removeChart(id) {
        const i = DOC.charts.findIndex((c) => c.id === id);
        if (i < 0) return;
        DOC.charts.splice(i, 1);
        drafts.delete(id);
        const fi = FILES.findIndex((it) => stemOf(it.file) === id);
        if (fi >= 0) FILES.splice(fi, 1);
        dropTab(id);                          // 删的那条若开着 → 标签一起摘（活跃的顺位到邻位，不剩就回空态）
        if (center.panes.has(DIR_DSP + id + '.json')) centerClose(DIR_DSP + id + '.json');   // 正开着它 → 连标签一起关
        if (!center.tabs.length) open({ file: DIR_DSP });                                    // 关空了 → 落回「我的图」目录
        postDsp('/api/dsps/' + encodeURIComponent(id + '.json'), 'DELETE');
        buildTree();
        syncEditorInputs(); labSync(true); refreshDirty();
    }
    // 备好第一份草稿：右栏所有画布（输出图 / 逐级卡）都从 DRAFT 取数据，必须早于它们建对象
    bindDraft();

    // 输出图：就是右栏上半身那块画布（HTML 里已就位，高度与左格画布一致）。
    // 数值上必然等于末级卡（都是跑完全部 N 级），但它不随逐级收起/展开，也不随滚动移出视野，
    // 所以单独留在上半身当"当前这一格的最终结果"。不需要卡片包裹，也没有额外标签。
    const labOut = { stages: [], out: new Float32Array(SFM_PC * CHART_N), w: 0, h: CH, hidden: false };
    labOut.cv = document.getElementById('labCanvas');
    labOut.ctx = labOut.cv.getContext('2d');
    labOut.stages = DRAFT ? DRAFT.stages.slice() : [];   // 空态下没有草稿，逐级卡与画布都空转
    labOut.w = fitCanvas(labOut.cv, CH);
    charts.push(labOut);
    // 逐级出图 + 级联操作合到同一张卡片：一张卡 = 一级 = 一张图。
    // 第 k 张图的 stages = 前 k 级。k=0 即输入（1-v 后、任何变换前），共 N+1 张。
    // 复用 computeChart 而不做增量快照：每张就是"只跑前 k 级"的独立计算，
    // 与单独建一张同款图完全等价 —— 各中间值天然一致，不会与主链路分叉。
    //
    // 卡片分工：
    //   头部（收起也可见）= 身份与编排：caret 收起 / 启用 / 选算子 / 参数 hint / 上移下移删除
    //   身体（收起隐藏）  = 作用与结果：参数控件 + 该级输出画布
    // 收起时头部足以判断"这是第几级、什么算子、参数多少、在链上什么位置"，且仍可编排。
    const labCharts = [];
    function rebuildLabCharts() {
        const S = DRAFT ? DRAFT.stages : [];     // 草稿副本的级联；空态下没有草稿，逐级卡清空
        labOut.stages = S.slice();               // 输出图跟着最新级联走（元素同引用，参数改动即时生效）
        for (const c of labCharts) { const i = charts.indexOf(c); if (i >= 0) charts.splice(i, 1); }
        labCharts.length = 0;
        const host = document.getElementById('labCharts');
        host.innerHTML = '';
        const last = S.length;                  // 末级索引 = 最后一张图
        // 只画第 1..N 级（第 0 级是原始输入，不在这里重复出图）
        for (let k = 1; k <= last; k++) {
            const st = S[k - 1];
            const collapsed = !!st.collapsed;    // 缺省见 labDefaultCollapse：只展开末级
            const card = document.createElement('div');
            card.className = 'lcard' + (collapsed ? ' collapsed' : '');

            const hd = document.createElement('div');
            hd.className = 'lcard-hd';
            const caret = document.createElement('button');
            caret.type = 'button';
            caret.className = 'caret';
            caret.textContent = '▾';
            caret.title = '收起/展开这一级（收起后仍保留标题、参数与全部编排按钮）';
            hd.appendChild(caret);

            const en = document.createElement('input');
            en.type = 'checkbox';
            en.className = 'en';
            en.checked = st.on;
            en.title = '启用/停用这一级（停用不参与执行，出图与上一级相同）';
            en.addEventListener('change', () => { st.on = en.checked; labSync(false); });
            hd.appendChild(en);

            const sel = document.createElement('select');
            sel.className = 'sel';
            sel.title = OPS[st.id].kind === 'vector' ? '整条 12 音级一起算（跨音级上下文）' : '逐音级独立映射';
            for (const key of Object.keys(OPS)) {
                const o = document.createElement('option');
                o.value = key;
                o.textContent = (OPS[key].kind === 'vector' ? '⧉ ' : '') + OPS[key].label;
                sel.appendChild(o);
            }
            sel.value = st.id;
            sel.addEventListener('change', () => {
                st.id = sel.value; st.p = {};      // 换算子 → 参数回到该算子的默认值
                labSync(true);
            });
            hd.appendChild(sel);

            // 参数 hint：收起后唯一能看到参数的地方
            const opEl = document.createElement('span');
            opEl.className = 'op';
            hd.appendChild(opEl);

            const ops = document.createElement('span');
            ops.className = 'sops';
            const mkBtn = (txt, title, fn, cls) => {
                const b = document.createElement('button');
                b.type = 'button'; b.textContent = txt; b.title = title;
                if (cls) b.className = cls;
                b.addEventListener('click', fn);
                ops.appendChild(b);
                return b;
            };
            mkBtn('↑', '上移一级（改变执行顺序）', () => {
                if (k <= 1) return;
                [S[k - 2], S[k - 1]] = [S[k - 1], S[k - 2]];
                labSync(true);
            }).disabled = k === 1;
            mkBtn('↓', '下移一级（改变执行顺序）', () => {
                if (k > last) return;
                [S[k], S[k - 1]] = [S[k - 1], S[k]];
                labSync(true);
            }).disabled = k === last;
            mkBtn('✕', '删除这一级', () => { S.splice(k - 1, 1); labSync(true); }, 'del');
            hd.appendChild(ops);

            const body = document.createElement('div');
            body.className = 'lcard-body';
            // 参数跟图走：控件在本级卡片里、画布正上方，改完立刻看结果
            const ctl = document.createElement('div');
            ctl.className = 'lctl';
            body.appendChild(ctl);
            // 只刷 hint 不重建卡片，否则拖动滑杆时焦点/拖拽会被打断
            buildParams(ctl, OPS[st.id].params.map((s) => ({ ...s, dst: st.p })), () => labSync(false));
            const cv = document.createElement('canvas');
            cv.className = 'mx';
            body.appendChild(cv);
            card.appendChild(hd); card.appendChild(body);
            host.appendChild(card);

            const ch = {
                stages: S.slice(0, k),             // 前 k 级；元素是同一批对象引用，改参数即时生效
                stagesRef: S,                      // 记住建卡时的级联数组：折叠/hint 刷新只读它，不依赖当前选中项
                out: new Float32Array(SFM_PC * CHART_N),
                w: 0, h: LAB_C_H,
                cv, ctx: cv.getContext('2d'),
                card, caret, opEl, enEl: en, selEl: sel, labK: k,
                hidden: collapsed,                 // 主循环跳过收起的图
            };
            caret.addEventListener('click', () => {
                st.collapsed = !st.collapsed;
                applyCollapse(ch);
                refreshDirty();                                    // 折叠态也是存档内容，跟着草稿走
                if (!ch.hidden) ch.w = fitCanvas(cv, LAB_C_H);   // 收起时 display:none 无布局宽度，展开必须重量
                labelLabCharts();                                 // 收起后头部仍要显示 title + 参数 hint
            });
            if (!collapsed) ch.w = fitCanvas(cv, LAB_C_H);        // 收起的不测宽，留 0 等展开时重测
            else cv.style.height = LAB_C_H + 'px';                // 但 CSS 高照样定死，避免展开瞬间被 132px 撑一下
            charts.push(ch);      // 塞进同一个列表：主循环自动 compute + draw，无需特判
            labCharts.push(ch);
        }
        labelLabCharts();
    }
    // 收起态只由各级的 collapsed 决定。
    // 越界保护：labCharts 与当前级联由 rebuildLabCharts 保持同长，
    // 这里再兜一层，避免任何漏 rebuild 的路径把整页打挂（标题刷新是纯展示，不该抛异常）
    function applyCollapse(ch) {
        const st = ch.stagesRef[ch.labK - 1];
        if (!st) { ch.hidden = true; return; }
        ch.card.classList.toggle('collapsed', !!st.collapsed);
        ch.hidden = ch.card.classList.contains('collapsed');
    }
    // 只刷新 hint / 勾选 / skip 标记，不重建 DOM（拖参数滑杆、启停切换时用）
    function labelLabCharts() {
        labOut.stages = DRAFT ? DRAFT.stages.slice() : [];
        for (const ch of labCharts) {
            applyCollapse(ch);
            const st = ch.stagesRef[ch.labK - 1];
            if (!st) continue;
            const fp = Object.entries(st.p).map(([key, v]) => `${key}=${(+v).toFixed(1)}`).join(',');
            ch.opEl.textContent = fp ? `(${fp})` : '—';
            ch.enEl.checked = st.on;
            ch.card.classList.toggle('skip', !st.on);
        }
    }
    // 唯一的编辑收口：空态切换 + 刷管道摘要 + 刷"未保存" + 重建或只刷标签
    function labSync(rebuild) {
        labEl.classList.toggle('idle', !DRAFT);
        // 自由探索草稿：提示它不落盘（按「保存」会另存为一条「我的图」）
        labRoHintEl.textContent = DRAFT && DRAFT.id === SCRATCH_ID
            ? '自由探索：临时链，不落盘 —— 按「保存」会另存为一条「我的图」。' : '';
        labPipeEl.textContent = DRAFT ? pipeSummary({ stages: DRAFT.stages }) : '';
        labOut.hidden = !DRAFT;               // 空态时画布不参与绘制（display:none 画了也白画）
        refreshDirty();
        if (rebuild) rebuildLabCharts();
        else labelLabCharts();
    }

    // ---- 工具条接线（全部写草稿；写回磁盘要等「保存」） ----
    labTitleEl.addEventListener('input', () => {
        if (!DRAFT) return;
        DRAFT.title = labTitleEl.value.slice(0, 60);
        refreshDirty();                       // 卡片标题不动 —— 保存时才写回
    });
    labDescEl.addEventListener('input', () => {
        if (!DRAFT) return;
        DRAFT.desc = labDescEl.value.slice(0, 400);
        refreshDirty();
    });
    document.getElementById('labSave').addEventListener('click', saveDoc);
    document.getElementById('labScratch').addEventListener('click', () => selectChart(SCRATCH_ID));
    document.getElementById('labAdd').addEventListener('click', () => {
        if (!DRAFT) return;
        const S = DRAFT.stages;
        if (S.length >= MAX_STAGES) return;               // 12 音级 × 250 点，8 级已远超需要
        const pick = S.length ? S[S.length - 1].id : 'pow';
        // 新增的一级默认收起：它在链中间/末尾但不是"末级默认展开"那条，除非整条链只有它
        S.push({ id: pick, on: true, p: {}, collapsed: S.length !== 0 });
        labSync(true);
    });
    document.getElementById('labClear').addEventListener('click', () => { if (DRAFT) { DRAFT.stages.length = 0; labSync(true); } });
    // 关闭：干净就直接关，脏的先弹自绘模态（保存 / 丢弃 / 取消；点遮罩或 Esc = 取消）
    labCloseEl.addEventListener('click', closeEditor);
    // 全局播放控制
    document.getElementById('gPlay').addEventListener('click', () => setAllPaused(!allPaused()));
    syncEditorInputs();
    rebuildLabCharts();
    labSync(true);
    applyView();          // 起手就按存档里的播放状态冻结（并把快照画回来）

    function drawChart(ch) {
        const c = ch.ctx, W = ch.w, H = ch.h;
        c.clearRect(0, 0, W, H);
        c.fillStyle = '#0a1022';
        c.fillRect(0, 0, W, H);
        const padL = 14, padR = 4, padT = 5, padB = 12;
        const iw = W - padL - padR, ih = H - padT - padB;
        c.font = '9px sans-serif';
        c.textAlign = 'left';
        for (let v = 0; v <= 1.001; v += 0.25) {
            const y = Math.round(padT + ih * (1 - v)) + 0.5;
            c.beginPath(); c.moveTo(padL, y); c.lineTo(W - padR, y);
            c.strokeStyle = (v === 0 || v === 1) ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.06)';
            c.lineWidth = 1; c.stroke();
            if (v === 0 || v === 0.5 || v === 1) {
                c.fillStyle = 'rgba(114,134,173,0.65)';
                c.fillText(v.toFixed(1), 2, y + 3);
            }
        }
        // X 轴分辨率自适应：可用宽 iw 决定能分辨几个时间片。
        // 每个像素列装不下一个采样点时（窄画布），按列取 min/max 画竖向包络：
        //   直接连线会因欠采样丢峰，丝带的上下缘（重缩放图永远贴边）会被抹平，包络则如实保留。
        // 画得够宽时（每列 ≥1 个采样点）仍逐点连线，不做任何降采样。
        const cols = Math.max(1, Math.round(iw));
        const step = chartCount / cols;          // 每像素列平均装几个采样点
        const decimated = step > 1.5;
        const xOf = (p) => padL + iw * p / (CHART_N - 1);
        const yOf = (v) => padT + ih * (1 - Math.max(0, Math.min(1, v)));
        const rm = ringMap;                  // 窗口位置 p → 绝对环形下标（out 现在按绝对下标存）
        for (let pc = 0; pc < SFM_PC; pc++) {
            const base = pc * CHART_N, col = SEMI_RGB[pc];
            c.beginPath();
            if (decimated) {
                for (let ci = 0; ci < cols; ci++) {
                    const p0 = Math.floor(ci * step), p1 = Math.min(chartCount, Math.floor((ci + 1) * step));
                    if (p1 <= p0) continue;
                    let mn = Infinity, mx = -Infinity;
                    for (let p = p0; p < p1; p++) { const v = ch.out[base + rm[p]]; if (v < mn) mn = v; if (v > mx) mx = v; }
                    const x = padL + ci;           // 整数 x：列与像素对齐，逐帧不抖
                    c.moveTo(x, yOf(mn));
                    c.lineTo(x, yOf(mx));
                }
            } else {
                for (let p = 0; p < chartCount; p++) c.lineTo(xOf(p), yOf(ch.out[base + rm[p]]));
            }
            c.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},0.85)`;
            c.lineWidth = 1;
            c.stroke();
        }
    }

    // ---------- 主循环 ----------
    function loop(ts) {
        if (isRunning) {
            if (!lastTs) lastTs = ts;
            const dt = Math.min((ts - lastTs) / 1000, 0.25);
            lastTs = ts;
            updateBuffers(dt);
        }
        sfmFillLines();
        // hidden = 右栏里收起的级：画布 display:none，画了也看不见，白算白画
        // paused = 用户按了暂停：冻结在这最后一帧上，连推进都省了
        // 正常状态下每帧每格只推进 0~1 列（chartWrite 20ms 才动一次），不是重算整窗
        for (const ch of charts) {
            if (ch.hidden || ch.paused) continue;
            // 单块画布出错不能把整个动画循环带走（否则一行异常 = 整页停摆，而且看不出是它）
            try {
                prepChart(ch);
                stepChart(ch);
                drawChart(ch);
            } catch (e) {
                const msg = String((e && e.message) || e);
                if (ch.errMsg !== msg) { ch.errMsg = msg; console.warn('[chart] 渲染出错：' + msg); }
            }
        }
        requestAnimationFrame(loop);
    }
    // 所有画布的逻辑宽都随容器实测（含右栏），窗口/缩放变化时逐块重量。
    // 重量会重建位图（位图一重建，上一帧就没了）→ 暂停中的画布要把存档里的快照重画回来。
    function refitAll() {
        for (const ch of charts) { if (ch.hidden) continue; ch.w = fitCanvas(ch.cv, ch.h); }
        for (const ch of charts) {
            if (ch.hidden || !ch.paused) continue;
            paintShot(ch);      // 暂停中的画布把存档里的快照重画回位图
        }
    }
    window.addEventListener('resize', refitAll);
    // 系统缩放变化 / 跨屏拖动（dpr 变化）时重建位图，否则位图按旧 dpr 拉伸 → 文字发虚
    if (window.matchMedia) {
        const mq = window.matchMedia(`(resolution: ${(window.devicePixelRatio || 1)}dppx)`);
        if (mq.addEventListener) mq.addEventListener('change', refitAll);
        else if (mq.addListener) mq.addListener(refitAll);   // 旧版 Safari
    }
    connectSSE();
    // 文档从服务端拉（异步）：先用出厂配置把 UI 立起来，拿到再整块换掉。
    // 服务端还没有文档时，把浏览器里的旧 localStorage 存档顶上去（迁移只发生一次）。
    (async () => {
        const { doc, migrate } = await loadDocFromServer();
        if (JSON.stringify(doc) !== JSON.stringify(DOC)) adoptDoc(doc);
        if (migrate) {
            storeState = 'load';
            const ok = await saveDocToServer(migrate);
            if (ok) adoptDoc(migrate);
        }
        await loadTree();          // content/ 的目录树 + .json 清单（树 / 模板 / 我的图一次拉回）
        mergeDspsIntoDoc();        // 文件为准 → 并进 DOC（右栏编辑器照旧按 id 找得到）
        renderCenter();            // 挂上内容面板当前活跃的那条标签（没存档时就是 Templates 目录列表）
        refreshDirty();
    })();
    // ---------- 新处理核心自检：旧 computeChart vs 新 compileChart + DSPRun ----------
    // 只读：不碰任何画布、不改 DOC。口径与 content/Functions/_equiv.js 完全一致
    // （整窗 CHART_N 帧、末端 clamp(0,1) 后落进 Float32 再逐点比）。
    // 覆盖两批：「我的图」（DOC.charts）+ content/Templates/ 的只读预设。
    // 模板不在 DOC 里，得单独列一遍 —— 但它们恰好把 8 个算子的组合都覆盖了，是最好的用例。
    // 控制台敲 dspSelfTest() 随时重跑；页面加载后约 6 秒自动跑一次（那时已收满一整窗）。
    function selfTestChart(ch) {
        const stages = (ch.stages || []).map((s) => ({ id: s.id, on: s.on !== false, p: s.p || {} }));
        const oldOut = new Float32Array(SFM_PC * CHART_N);
        computeChart({ out: oldOut, stages }, sfmLines);   // 旧路径（复用 pipeTmp/rankTmp；同步执行，打完即回）

        let proc;
        try { proc = compileChart({ stages }, 'selftest/' + (ch.id || 'x')); }
        catch (e) { return { err: '编译失败：' + e.message }; }
        if (proc.warnings.length) return { err: proc.warnings.join('; ') };

        const st = createFrameState({});
        st.DSP_ARR = [proc];
        const newOut = new Float32Array(SFM_PC * CHART_N);
        for (let p = 0; p < CHART_N; p++) {
            const inp = new Float64Array(SFM_PC);          // 旧实现内部工作区是 Float64，保持一致
            for (let pc = 0; pc < SFM_PC; pc++) inp[pc] = sfmLines[pc * CHART_N + p];
            st.INPUT = inp;
            let r;
            try { r = DSPRun(st); } catch (e) { return { err: `第 ${p} 帧：${e.message}` }; }
            if (st.ERROR) return { err: `第 ${p} 帧：${st.ERROR.key} ${st.ERROR.msg}` };
            for (let pc = 0; pc < SFM_PC; pc++) newOut[pc * CHART_N + p] = Math.max(0, Math.min(1, r[pc]));
        }

        // 落盘布局是 out[pc * CHART_N + p]，所以最差点的下标要反解成（音级, 帧）
        let bad = 0, maxd = 0, at = -1;
        for (let i = 0; i < oldOut.length; i++) {
            const d = Math.abs(oldOut[i] - newOut[i]);
            if (d > maxd) { maxd = d; at = i; }
            if (oldOut[i] !== newOut[i]) bad++;
        }
        return { points: oldOut.length, bad, maxd, at };
    }

    // 每次改自检就 bump 一下：控制台第一行会打出来，一眼分清"新构建"还是"缓存的旧页面"
    const ST_BUILD = 'r4';
    window.dspSelfTest = function (opts) {
        const quiet = !!(opts && opts.quiet);
        const withTpl = !(opts && opts.templates === false);
        if (!quiet) console.info(`[selftest] build=${ST_BUILD}`);
        if (typeof compileChart !== 'function' || typeof DSPRun !== 'function') {
            console.warn('[selftest] 新运行时没加载 —— 检查 /content/Functions/*.js 是否 404');
            return null;
        }

        // 输入活跃度：全是 0 时"一致"没有说服力，先把这件事摆到台面上
        let live = 0;
        for (let i = 0; i < sfmLines.length; i++) if (sfmLines[i] !== 0) live++;
        const livePct = (live / sfmLines.length * 100).toFixed(1);
        if (!live && !quiet) {
            console.info('[selftest] 输入全是 0（没有音频数据），这一轮只能证明"零输入下两边一致"');
        }

        const rows = [];
        let bad = 0, total = 0, n = 0;
        const run = (label, group, ch) => {
            n++;
            const r = selfTestChart(ch);
            if (r.err) {
                rows.push({ 图: label, 分组: group, 点数: 0, 不一致: '-', 最大差: r.err, 最差处: '' });
                bad++;
                return;
            }
            total += r.points; bad += r.bad;
            // at 是扁平下标：pc = at / CHART_N，帧 = at % CHART_N
            const where = r.bad ? `帧 ${r.at % CHART_N} · ${NOTE_NAMES[Math.floor(r.at / CHART_N)]}` : '—';
            rows.push({
                图: label, 分组: group, 点数: r.points, 不一致: r.bad,
                最大差: r.maxd.toExponential(2), 最差处: where,
            });
        };

        for (const ch of DOC.charts) run(ch.id, '我的图', ch);

        if (withTpl) {
            // 模板来自磁盘（只读）。$schema.json 是 schema 文档不是处理链（服务端给它的是空 stages），跳过。
            for (const it of FILES) {
                if (dirOf(it.file) !== DIR_TPL || !Array.isArray(it.stages)) continue;
                const nm = stemOf(it.file);
                if (nm.charAt(0) === '$') continue;
                run(it.title || nm, '模板', { stages: stagesOfItem(it) });
            }
        }

        // 再验一遍**现役渲染路径**：各画布逐列累积出来的 ring，映射回窗口序后必须与整窗批算逐点相同。
        // 只查正在跑的画布 —— hidden / paused 的 ring 本来就不推进，比了必错。
        let liveN = 0, liveBad = 0, liveStale = 0;
        const liveRows = [];
        for (const ch of charts) {
            if (ch.hidden || ch.paused) continue;
            try {
                prepChart(ch);
                stepChart(ch);   // 先同步追平：别把"刚切过来、还没跑一帧"当成不一致
                if (!ch.proc) continue;
                const stages = (ch.stages || []).map((s) => ({ id: s.id, on: s.on !== false, p: s.p || {} }));
                const ref = new Float32Array(SFM_PC * CHART_N);
                computeChart({ out: ref, stages }, sfmLines);

                const diff = () => {
                    for (let pc = 0; pc < SFM_PC; pc++) {
                        for (let p = 0; p < CHART_N; p++) {
                            const ii = pc * CHART_N + ringMap[p];
                            if (ch.out[ii] !== ref[pc * CHART_N + p]) return { pc, p, lv: ch.out[ii], rv: ref[pc * CHART_N + p] };
                        }
                    }
                    return null;
                };

                liveN++;
                const a = diff();
                if (!a) continue;

                // 强制整窗重算再看一次：能分开"增量落后"和"映射/数据真错"两种原因
                ch.lastSeq = null;
                stepChart(ch);
                const b = diff();
                if (b) liveBad++; else liveStale++;

                // 把这一列的输入和两边输出都摆出来 —— 一眼能看出是"输错了"还是"链没跑对"
                const col = (chartWrite + a.p) % CHART_N;
                const dump = (get) => Array.from({ length: SFM_PC }, (_, pc) => +get(pc).toFixed(3)).join(' ');
                if (!quiet) {
                    console.log(`[selftest] 差异画布 ${keyOf(ch) || '(右栏)'} · 链 ${stages.map((s) => s.id + (s.on ? '' : '·off')).join('+') || '(空链)'} · 帧 ${a.p} / 列 ${col} / ${NOTE_NAMES[a.pc]}`
                        + ` · 编译实例 [${ch.proc.instances.map((b) => b.id).join('+') || '0 个 → 整条旁路'}]`
                        + ` · lastSeq=${ch.lastSeq} / chartSeq=${chartSeq}`);
                    console.log('  该列输入 sfmDisp :', dump((pc) => sfmDisp[pc * CHART_N + col]));
                    console.log('  累积 ch.out      :', dump((pc) => ch.out[pc * CHART_N + col]));
                    console.log('  批算 ref         :', dump((pc) => ref[pc * CHART_N + a.p]));
                }
                liveRows.push({
                    画布: keyOf(ch) || '(右栏)',
                    算子链: stages.map((s) => s.id + (s.on ? '' : '·off')).join('+') || '(空链)',
                    首个差异: `帧 ${a.p} · ${NOTE_NAMES[a.pc]}`,
                    累积值: a.lv, 批算值: a.rv,
                    整窗重算后: b ? `仍差 ${b.lv} vs ${b.rv}` : '一致（增量落后）',
                });
            } catch (e) {
                liveBad++;
                liveRows.push({ 画布: keyOf(ch) || '(右栏)', 算子链: '—', 首个差异: '异常', 累积值: String((e && e.message) || e), 批算值: '', 整窗重算后: '' });
            }
        }
        if (!quiet && liveRows.length) console.table(liveRows);

        if (!n) {
            if (!quiet) console.info('[selftest] 没有可比对的对象（既没「我的图」也没模板）');
            return { ok: true, rows, total: 0, bad: 0, livePct, liveN, liveBad };
        }
        if (!quiet) console.table(rows);
        const msg = `[selftest] ${n} 张图 / ${total} 点，不一致 ${bad} 点 · 输入活跃度 ${livePct}%`;
        if (bad) console.warn(msg + ' ✗'); else console.info(msg + ' ✓');
        if (liveN) {
            const lm = `[selftest] 渲染路径：${liveN} 张画布，增量落后 ${liveStale} 张 · 整窗重算后仍不一致 ${liveBad} 张`;
            if (liveBad) console.warn(lm + ' ✗'); else console.info(lm + ' ✓');
        }
        return { ok: bad === 0 && liveBad === 0, rows, total, bad, livePct, liveN, liveBad, liveStale };
    };

    // 6 秒 ≈ 250 帧 @50Hz：等一整窗填满再比，否则比的是零输入
    setTimeout(() => {
        if (!isRunning) { console.info('[selftest] 没在接收数据，跳过自动自检（可手动 dspSelfTest()）'); return; }
        window.dspSelfTest();
    }, 6000);

    // 调试入口：控制台里 open({ file: 'content/Templates/inv+zscore.json' }) 可直接切视图
    window.dspLabOpen = open;
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
