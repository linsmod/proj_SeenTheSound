        title: docTitle,
        dirty: () => false,          // 内容面板的标签都是只读预览（改的是内存里的链，要固化走「保存 / 从模板新建」）
        // 类型图标与左栏树同一套字形：目录 / 对比视图 / 普通文件
        icon: (k) => (k.endsWith('/') ? '📁' : (isCmpvFile(k) ? '⇄' : '📄')),
        hint: (k) => k,
        activate: (k) => centerActivate(k),
        close: (k) => centerClose(k),
    });
    // Pane：一条标签的运行时。el 懒创建（首次挂载才建），非活跃时留在 DOM 里 hidden。
    function paneOf(key) {
        let p = center.panes.get(key);
        if (!p) {
            p = { key, view: viewerOf(key), el: null, mounted: false, stale: false, charts: [], sel: '', token: 0 };
            center.panes.set(key, p);
        }
        return p;
    }
    // 摘掉这一 pane 的全部画布 + 作废在途渲染。主循环只认 charts 一张表，不摘就会一直空算。
    function paneDetach(p) {
        if (!p) return;
        for (const ch of p.charts) { const i = charts.indexOf(ch); if (i >= 0) charts.splice(i, 1); }
        p.charts.length = 0;
        p.token = ++center.mark;
    }
    // 画布登记进 pane：同时记进主循环的 charts；不在活跃标签上就先挂 hidden（不 compute / 不 draw）
    function addPaneChart(p, ch) {
        p.charts.push(ch);
        charts.push(ch);
        ch.hidden = center.active !== p.key;
    }
    function paneShow(p, on) {
        if (!p) return;
        if (p.el) p.el.hidden = !on;
        for (const ch of p.charts) ch.hidden = !on;
    }
    // view 名 → 样式类名（view 名是路由用的，类名沿用原来的 .dsplist / .dspview，样式不用改）
    const VIEW_CLASS = { dsplistview: 'dsplist', dspview: 'dspview' };
    // 挂载 / 重挂：从 pane.key + pane.view 把 DOM 与画布整块重建
    function paneMount(p) {
        paneDetach(p);
        if (!p.el) { p.el = document.createElement('div'); midHostEl.appendChild(p.el); }
        p.el.className = 'tabpane ' + (VIEW_CLASS[p.view] || 'dspview');
        p.el.textContent = '';
        p.token = ++center.mark;
        p.mounted = true;
        p.stale = false;
        paneShow(p, center.active === p.key);   // 先定显隐再出图：隐藏着的容器量不出宽度（fitCanvas 会退回 80）
        if (p.view === 'dspview') renderOne(p);
        else if (isCmpvFile(p.key)) renderCmpvList(p);   // 对比视图：把 .cmpv 的目标渲染成卡片列表
        else renderList(p);
    }
    // 唯一的路由入口：开 / 切到某条标签（已开过就激活，没开过就新建）
    function open(spec) {
        const s = spec || {};
        let file = typeof s.file === 'string' ? s.file.trim() : '';
        if (!file) file = HOME_DIR;                              // 空 file = 回默认落地目录
        if ((s.panel || 'center') !== 'center') return;           // 目前只有中间面板参与
        let v = s.viewer || viewerOf(file);
        if (VIEWS.indexOf(v) < 0) v = viewerOf(file);             // viewer 名不认识 → 按 file 重推
        const p = paneOf(file);
        if (p.view !== v) { p.view = v; p.mounted = false; paneDetach(p); }   // 同一条换 view：先摘旧的
        if (center.tabs.indexOf(file) < 0) center.tabs.push(file);
        if (v === 'dspview') p.sel = file;   // 打开过的那一条，退回列表时保持选中
        // 树里同步选中：多选状态下打开其中一条不打断整批选择，其它来源（列表/面包屑）打开则单选它
        if (!treeSel.has(file)) { setTreeSel([file]); treeAnchor = file; }
        centerActivate(file);
        revealInTree(file);      // 展开沿路目录并滚到它：新建的条目打开后要能在树里看见
    }
    function centerActivate(key) {
        if (center.tabs.indexOf(key) < 0) return;
        const clean = !archiveDirty();   // 先取：写 panels 本身就会让 DOC 与基线不等
        for (const [k, p] of center.panes) if (k !== key) paneShow(p, false);
        center.active = key;
        const p = paneOf(key);
        if (!p.mounted || p.stale) paneMount(p);
        else paneShow(p, true);
        refitAll();              // 刚从 display:none 出来（或刚挂上），位图得按实测宽度重建
        renderCrumb();
        renderCenterTabs();
        updateCenterEmpty();
        savePanels();
        syncTreeFiles();
        syncGlobalPlay();        // 换了一批可暂停的画布，全局按钮文案要重算
        refreshDirty();
        viewAutoSave(clean);     // 切标签 = 视图状态变了，顺手落盘（成品侧没有别的待存改动时才写）
    }
    // 关闭某条标签（内容面板的标签都是只读预览，没有"要不要保存"可问，直接关）
    function centerClose(key) {
        const i = center.tabs.indexOf(key);
        if (i < 0) return;
        const clean = !archiveDirty();
        const p = center.panes.get(key);
        paneDetach(p);
        if (p && p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
        center.panes.delete(key);
        center.tabs.splice(i, 1);
        if (center.active === key) {
            center.active = '';
            const next = center.tabs[i] || center.tabs[i - 1] || '';
            if (next) centerActivate(next);
            else { renderCrumb(); renderCenterTabs(); updateCenterEmpty(); savePanels(); syncGlobalPlay(); refreshDirty(); }
        } else { renderCenterTabs(); updateCenterEmpty(); savePanels(); }
        viewAutoSave(clean);
    }
    // 数据变了（磁盘清单 / 条目内容）：所有 pane 标脏，活跃那个立刻按新数据重挂，其余等被激活时再重挂
    let centerBusy = false;
    function centerInvalidate() {
        for (const [, p] of center.panes) p.stale = true;
        if (centerBusy) return;
        centerBusy = true;
        try { renderCenter(); } finally { centerBusy = false; }
    }
    // 重挂当前活跃 pane（刷新数据 / 还原参数 / 改名后调）—— 等价于旧版的"整块重画中间面板"
    function renderCenter() {
        const key = center.active;
        if (key && center.tabs.indexOf(key) >= 0) paneMount(paneOf(key));
        renderCrumb();
        renderCenterTabs();
        updateCenterEmpty();
    }
    // 标签全关掉后的空态提示（中间区域不至于一片空白）
    function updateCenterEmpty() {
        const hint = midHostEl.querySelector('.pane-empty');
        if (!center.tabs.length) {
            if (hint) return;
            const d = document.createElement('div');
            d.className = 'tpl-empty pane-empty';
            d.textContent = '左栏点文件行 / 目录行即可在这里打开 —— 可以同时开多条标签';
            midHostEl.appendChild(d);
        } else if (hint) hint.remove();
    }
    // 磁盘上已经没有的文件（被删 / 改名）→ 连标签一起摘。目录不算（空目录也允许开着）。
    // 清单没拉到（离线）时一律不动 —— 宁可留一条打不开的标签，也不要清掉用户开着的视图。
    function pruneCenter() {
        if (!FILES.length) return;
        const keep = center.tabs.filter((k) => k.endsWith('/') || !!itemOf(k));
        if (keep.length === center.tabs.length) return;
        for (const k of center.tabs) {
            if (keep.indexOf(k) >= 0) continue;
            const p = center.panes.get(k);
            paneDetach(p);
            if (p && p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
            center.panes.delete(k);
        }
        center.tabs = keep;
        if (center.tabs.indexOf(center.active) < 0) center.active = center.tabs[0] || '';
        if (!center.tabs.length) { center.tabs = [HOME_DIR]; center.active = HOME_DIR; }
        renderCenterTabs();
        savePanels();
    }
    // 按存档还原内容面板的标签（只摆状态不挂载：活跃那条由随后的 renderCenter() 挂上，其余等被点开再挂）
    function restoreCenter(pc) {
        for (const [, p] of center.panes) {
            paneDetach(p);
            if (p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
        }
        center.panes.clear();
        center.tabs = (pc && Array.isArray(pc.tabs)) ? pc.tabs.filter((k) => typeof k === 'string').slice() : [];
        center.active = (pc && center.tabs.indexOf(pc.active) >= 0) ? pc.active : (center.tabs[0] || '');
        if (!center.tabs.length) { center.tabs = [HOME_DIR]; center.active = HOME_DIR; }   // 空档 → 落回出厂预设目录
        renderCenterTabs();
        updateCenterEmpty();
    }
    // 面包屑：相对 ROOT（content/）的路径 —— 目录 › 文件。点前面任一段 = 往上一级（最后一段是当前位置，不可点）
    function renderCrumb() {
        crumbEl.textContent = '';
        const key = center.active;
        if (!key) return;
        const seg = (txt, file, now, title) => {
            const b = document.createElement('span');
            b.className = 'seg' + (now ? ' now' : '');
            b.textContent = txt;
            b.title = title || '';
            if (!now) b.addEventListener('click', () => open({ file }));
            crumbEl.appendChild(b);
            return b;
        };
        const sp = () => { const s = document.createElement('span'); s.className = 'sp'; s.textContent = '›'; crumbEl.appendChild(s); };
        // content/ = ROOT：面包屑就是相对根的路径（目录 › 文件），根段本身不写出来。
        // 当前是"某个文件"时（链路视图，或卡片列表渲染的 .cmpv 对比），最后一段是这个文件本身，前面的目录段可点回列表。
        const dir = dirOf(key);
        const onFile = viewerOf(key) === 'dspview' || isCmpvFile(key);
        seg(relToRoot(dir) || './', dir, !onFile, dir + ' 的列表视图');
        if (onFile) { sp(); seg(fileNameOf(key), key, true, key); }
    }
    // 文件条目的"底部一条"= 参数条 + 播放按钮（画面在上、控件在下）。
    // 参数改的是内存里这一条链：模板是只读文件（要固化就「从模板新建」）；
    // 我的图直接改到 DOC 那一格上（文件就是它自己的存档），按「保存」才落盘。
    function buildFileFoot(host, t, ch) {
        const foot = document.createElement('div'); foot.className = 'foot';
        const pbar = document.createElement('div'); pbar.className = 'pbar';
        pbar.title = isDspFile(t.file)
            ? '改的是这一条的参数，按「保存」才写回文件'
            : '调的是内存里的预览参数，不写回 content/Templates/ 里的文件';
        // 参数条上的点击不该冒泡成"打开这条"（卡片整体可点 = 打开链路视图）
        pbar.addEventListener('click', (ev) => ev.stopPropagation());
        const prow = document.createElement('div'); prow.className = 'prow';
        const playBtn = document.createElement('button');
        playBtn.type = 'button'; playBtn.className = 'pb';
        playBtn.addEventListener('click', (ev) => { ev.stopPropagation(); setPaused(t.file, !isPaused(t.file)); });
        const rstBtn = document.createElement('button');
        rstBtn.type = 'button'; rstBtn.className = 'pb'; rstBtn.textContent = '↺';
        rstBtn.title = '把调过的参数还原成文件里写的那些';
        rstBtn.addEventListener('click', (ev) => { ev.stopPropagation(); resetItemParams(t); });
        prow.append(playBtn, rstBtn);
        foot.append(pbar, prow);
        host.appendChild(foot);
        ch.pbar = pbar; ch.playBtn = playBtn;
        buildParams(pbar, chartParamSpecs(ch), () => {
            ch.pipeEl.textContent = pipeSummary(ch);
            // 我的图的参数是直接改 DOC 那一格的（成品改动）→ 状态位要报"未落盘"，等「保存」写回文件
            if (isDspFile(t.file)) refreshDirty();
        });
        renderPlayBtn(ch);
        return foot;
    }
    // 还原：把文件里写的链写回 DOC 里对应的那一条（模板只丢内存里那份预览）
    function resetItemParams(t) {
        const e = isDspFile(t.file) ? entryOf(stemOf(t.file)) : null;
        if (e) e.stages = sanitizeStages(t.stages) || [];
        delete t._stages;
        renderCenter();
        if (e) { bindDraft(); labSync(true); refreshDirty(); }
    }
    // 视图重建出来的画布要接回存档里的暂停状态：置 paused（主循环跳过）+ 把快照画回位图
    function bindViewPause(ch) {
        ch.paused = isPaused(keyOf(ch));
        if (ch.paused) paintShot(ch);
        renderPlayBtn(ch);
    }
    // dsplistview 卡片：单击 = 只选中（不切视图），双击才打开这一条的链路视图。
    // 选中态是 pane 自己的（同一条 DSP 在别的标签里选中与这里无关）。
    function setPaneSel(p, file) {
        if (file === p.sel) return;
        p.sel = file;
        if (!p.el) return;
        for (const c of p.el.children) {
            if (c.classList && c.classList.contains('tcard')) c.classList.toggle('sel', c.dataset.file === p.sel);
        }
    }
    // 一张卡片 = 一个文件：路径 / 标题 / 管道摘要 / 实时画布 / 参数条 + 播放按钮。
    // 目录列表与对比视图共用这套（对比视图只是数据源换成 .cmpv 里列的 targets）。
    function buildListCard(p, t) {
        const stages = stagesOfItem(t);
        const card = document.createElement('div');
        card.className = 'tcard' + (t.file === p.sel ? ' sel' : '');
        card.dataset.file = t.file;      // 单击选中时就地刷高亮用
        const nf = document.createElement('div'); nf.className = 'tfile'; nf.textContent = t.file;
        const tt = document.createElement('div'); tt.className = 'ttitle'; tt.textContent = t.title;
        const pp = document.createElement('div'); pp.className = 'pipe'; pp.textContent = pipeSummary({ stages });
        const cv = document.createElement('canvas'); cv.className = 'mx';
        const ds = document.createElement('div'); ds.className = 'tdesc';
        ds.textContent = t.desc || '（无说明）';
        card.append(nf, tt, pp, cv);
        card.title = t.file + '\n单击：选中；双击：打开这一条（链路视图）';
        card.addEventListener('click', (ev) => { if (ev.detail > 1) return; setPaneSel(p, t.file); });
        card.addEventListener('dblclick', () => open({ file: t.file }));
        p.el.appendChild(card);
        const ch = {
            file: t.file, stages, out: new Float32Array(SFM_PC * CHART_N), w: 0, h: LIST_C_H,
            cv, ctx: cv.getContext('2d'), pipeEl: pp, card, isView: true,
        };
        buildFileFoot(card, t, ch);
        card.appendChild(ds);
        ch.w = fitCanvas(cv, LIST_C_H);
        bindViewPause(ch);
        addPaneChart(p, ch);
        return ch;
    }
    // 目录列表里的对比视图（.cmpv）：虚线卡片，双击才打开它（打开后是"目标卡片列表"）。
    // 它自己不跑任何链路，所以没有画布、也没有参数条。
    function buildCmpvCard(p, t) {
        const n = Array.isArray(t.targets) ? t.targets.length : 0;
        const card = document.createElement('div');
        card.className = 'tcard cmpv' + (t.file === p.sel ? ' sel' : '');
        card.dataset.file = t.file;
        const nf = document.createElement('div'); nf.className = 'tfile'; nf.textContent = t.file;
        const tt = document.createElement('div'); tt.className = 'ttitle'; tt.textContent = t.title || stemOf(t.file);
        const pp = document.createElement('div'); pp.className = 'pipe'; pp.textContent = `对比 ${n} 项`;
        const ds = document.createElement('div'); ds.className = 'tdesc';
        ds.textContent = t.desc || '（无说明）';
        card.append(nf, tt, pp, ds);
        card.title = t.file + '\n单击：选中；双击：打开这份对比（被引用的 DSP 文件不动）';
        card.addEventListener('click', (ev) => { if (ev.detail > 1) return; setPaneSel(p, t.file); });
        card.addEventListener('dblclick', () => open({ file: t.file }));
        p.el.appendChild(card);
    }
    // dsplistview：某个目录的列表。一格 = 一个文件，小画布用实时数据跑同一条链
    function renderList(p) {
        const dir = dirOf(p.key);
        const items = itemsOf(dir);
        const host = p.el;
        host.textContent = '';
        if (!items.length) {
            const e = document.createElement('div'); e.className = 'tpl-empty';
            e.textContent = dir + ' 下还没有文件'
                + (dir === DIR_DSP ? '（右键这一行「新建 DSP」，或在 content/Templates/ 的某一行上右键「从模板新建」）' : '');
            host.appendChild(e);
            return;
        }
        for (const t of items) (Array.isArray(t.targets) ? buildCmpvCard : buildListCard)(p, t);
    }
    // 缺失目标的占位卡片：目标文件已被删 / 改名时在原位占个位（不可点、不跑链路）
    function buildMissingCard(file, host) {
        const card = document.createElement('div');
        card.className = 'tcard missing';
        card.dataset.file = file;
        const nf = document.createElement('div'); nf.className = 'tfile'; nf.textContent = file;
        const tt = document.createElement('div'); tt.className = 'ttitle'; tt.textContent = '（缺失）';
        const ds = document.createElement('div'); ds.className = 'tdesc';
        ds.textContent = '目标文件不在了（已删除或改名）';
        card.append(nf, tt, ds);
        card.title = file + '\n目标文件不存在';
        host.appendChild(card);
    }
    // 对比视图（.cmpv）：读它列的目标文件，用同一套卡片渲染。
    // 个别目标不在 → 在原位给一张缺失占位卡；全都找不到才只给一句提示。
    async function renderCmpvList(p) {
        const file = p.key, tok = p.token, host = p.el;
        host.textContent = '';
        const tip = document.createElement('div'); tip.className = 'tpl-empty'; tip.textContent = '读取 ' + file + ' …';
        host.appendChild(tip);
        const doc = await getItem(file);
        // 期间标签被重挂 / 关掉 → 这次渲染作废（token 是这条 pane 每挂一次就换一个的代号）
        if (!doc || p.token !== tok) return;
        host.textContent = '';
        const targets = Array.isArray(doc.targets) ? doc.targets : [];
        const loaded = [];
        for (const tf of targets) loaded.push([tf, await getItem(tf)]);
        if (p.token !== tok) return;
        const missing = loaded.filter(([, t]) => !t).length;
        const head = document.createElement('div');
        head.className = 'cmpv-head';
        head.textContent = `${doc.title || doc.name} · 对比 ${targets.length} 项` + (missing ? ` · 缺失 ${missing}` : '');
        head.title = '来自 ' + file;
        host.appendChild(head);
        if (!targets.length) {
            const e = document.createElement('div'); e.className = 'tpl-empty';
            e.textContent = '这份对比里还没有目标';
            host.appendChild(e);
            return;
        }
        if (missing === targets.length) {           // 全都缺失：只给一句提示，不铺一屏占位
            const e = document.createElement('div'); e.className = 'tpl-empty';
            e.textContent = '这份对比里引用的文件都不在了';
            host.appendChild(e);
            return;
        }
        for (const [tf, t] of loaded) {
            if (t) buildListCard(p, t);
            else buildMissingCard(tf, host);        // 个别缺失 → 原位占位
        }
        if (center.active === p.key) refitAll();     // 这一挂发生在切走之后：位图当时按 0 宽量的，补一次
    }
    // dspview：单个文件的预览视图 —— 大画布 + 参数条/播放按钮 + 逐级算子 + 入口按钮。
    // 模板只读（要固化就「从模板新建」）；我的图多了保存 / 编辑 / 复制 / 删除。
    async function renderOne(p) {
        const file = p.key, tok = p.token, host = p.el;
        host.textContent = '';
        const load = document.createElement('div'); load.className = 'tpl-empty'; load.textContent = '读取 ' + file + ' …';
        host.appendChild(load);
        const t = await getItem(file);
        // 期间标签被重挂 / 关掉 → 这次渲染作废
        if (!t || p.token !== tok) return;
        const stages = stagesOfItem(t);
        host.textContent = '';
        const nf = document.createElement('div'); nf.className = 'vfile'; nf.textContent = file;
        const vh = document.createElement('div'); vh.className = 'vh'; vh.textContent = t.title;
        const vd = document.createElement('div'); vd.className = 'vdesc'; vd.textContent = t.desc || '（无说明）';
        const pp = document.createElement('div'); pp.className = 'pipe'; pp.textContent = pipeSummary({ stages });
        const cv = document.createElement('canvas'); cv.className = 'mx';
        const stbox = document.createElement('div'); stbox.className = 'stages';
        stages.forEach((s, i) => {
            const chip = document.createElement('span');
            chip.className = 'st' + (s.on ? '' : ' off');
            const op = OPS[s.id];
            const fp = Object.entries(s.p).map(([k, v]) => `${k}=${(+v).toFixed(1)}`).join(',');
            chip.textContent = `${ordLabel(i + 1)} ${op.label}${fp ? '(' + fp + ')' : ''}${op.kind === 'vector' ? ' ⧉' : ''}`;
            chip.title = (op.kind === 'vector' ? '整条 12 音级一起算（跨音级上下文）' : '逐音级独立映射') + (s.on ? '' : ' · 这一级已停用');
            stbox.appendChild(chip);
        });
        const tools = document.createElement('div'); tools.className = 'vtools';
        const mk = (txt, title, fn, cls) => {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'lbtn' + (cls ? ' ' + cls : ''); b.textContent = txt; b.title = title;
            b.addEventListener('click', fn);
            tools.appendChild(b);
            return b;
        };
        const dir = dirOf(file), mine = dir === DIR_DSP, id = stemOf(file);
        if (mine) {
            mk('💾 保存', '把这一条（含调过的参数）写回 ' + file, () => saveDspFile(t), 'primary');
            mk('✎ 编辑', '在右栏编辑器里改标题 / 说明 / 级联', () => { if (entryOf(id)) selectChart(id); });
            mk('复制', '克隆成新的一条', () => cloneAsNew(id));
            mk('删除', '从 content/My dsps/ 里删掉这一条', () => deleteChart(id), 'danger');
        } else {
            mk('从模板新建', '按当前这份（含你调过的参数）克隆一份可编辑的「我的图」', () => newFromStagesFile(t), 'primary');
        }
        mk('← 列表', '回到 ' + dir + ' 的列表视图', () => open({ file: dir }));
        mk('✕ 关闭', '回到默认目录列表（content/Templates/）', () => open({ file: '' }));
        const ch = {
            file, stages, out: new Float32Array(SFM_PC * CHART_N), w: 0, h: ONE_C_H,
            cv, ctx: cv.getContext('2d'), pipeEl: pp, card: host, isView: true,
        };
        host.append(nf, vh, vd, pp, cv);
        buildFileFoot(host, t, ch);       // 参数条 + 播放/还原：与列表卡片同一套
        host.append(stbox, tools);
        ch.w = fitCanvas(cv, ONE_C_H);
        bindViewPause(ch);
        addPaneChart(p, ch);
        if (center.active === p.key) refitAll();   // 这一挂发生在切走之后：位图当时按 0 宽量的，补一次
    }
    // 条目的 stages：过一遍 sanitizeStages 再进管道（磁盘文件是手写的，非法 id / 越界参数在这里纠正）。
    // 我的图直接指向 DOC 里同一格 —— 预览与右栏编辑器看的是同一批对象，改哪边都是同一条链。
    function stagesOfItem(t) {
        const e = isDspFile(t.file) ? entryOf(stemOf(t.file)) : null;
        if (e) return e.stages;
        if (!t._stages) t._stages = sanitizeStages(t.stages) || [];
        return t._stages;
    }
    async function getItem(file) {
        const hit = itemOf(file) || fileCache.get(file);
        if (hit) return hit;
        try {
            const res = await fetch('/api/item?path=' + encodeURIComponent(file), { cache: 'no-store' });
            if (!res.ok) return null;
            const b = await res.json().catch(() => null);
            const t = b && b.item;
            if (!t) return null;
            fileCache.set(t.file, t);
            return t;
        } catch (e) { return null; }
    }
    // 树从后端一次拉回（磁盘为准）；失败就留空，树里显示空态
    async function loadTree() {
        try {
            const res = await fetch('/api/tree', { cache: 'no-store' });
            const b = await res.json().catch(() => null);
            const tree = (b && Array.isArray(b.tree)) ? b.tree : [];
            const files = (b && Array.isArray(b.files)) ? b.files : [];
            TREE.length = 0;
            for (const nd of tree) if (nd && typeof nd.path === 'string') TREE.push(nd);
            FILES.length = 0;
            for (const t of files) if (t && typeof t.file === 'string') FILES.push(t);
        } catch (e) { TREE.length = 0; FILES.length = 0; }
    }
    // 我的图以文件为准：把 content/My dsps/ 里的条目并进 DOC（右栏编辑器照旧按 id 找得到），
    // 文件里没有的那一格 = 已经在别处删掉了 → 从 DOC 摘掉。
    function mergeDspsIntoDoc() {
        const mine = FILES.filter((it) => isDspFile(it.file));
        const keep = new Set(mine.map((it) => stemOf(it.file)));
        DOC.charts = DOC.charts.filter((c) => keep.has(c.id));        // 文件为准：磁盘上没有的一律摘掉
        const fresh = [];        // 新文件补到末尾
        for (const it of mine) {
            const id = stemOf(it.file);
            const stages = sanitizeStages(it.stages) || [];
            const e = DOC.charts.find((c) => c.id === id);
            if (e) { e.title = it.title; e.desc = it.desc; e.stages = stages; }
            else fresh.push({ id, title: it.title, desc: it.desc, stages });
        }
        DOC.charts.push(...fresh);
        pruneTabs();                        // 磁盘上没有的条目 → 连它的标签一起摘
        pruneCenter();                      // 内容面板开着但文件已不在的标签，同理
        lastSaved = entryDocJson(DOC);      // 文件就是存档，并完不该报"未落盘"
        drafts.clear(); bindDraft();
        buildTree();                        // 左栏树按最新的磁盘清单重建
        syncEditorInputs(); labSync(true); applyView(); refreshDirty();
    }
    // 「从模板新建」：把这份文件的链克隆成一条我的图（模板文件本身不动）。
    // 不记 from —— 创建出来就是独立一条，与来源再无关系。
    function newFromStagesFile(t) {
        const stages = stagesOfItem(t).map(cloneStage);
        const title = t.title || fileNameOf(t.file);
        const dup = DOC.charts.some((c) => c.title === title);
        addUserChart({ title: title + (dup ? ' 副本' : ''), desc: t.desc || '', stages });
    }
    // ---- 我的图的文件读写：一个 id 一个文件（content/My dsps/<id>.json） ----
    async function postDsp(url, method, body) {
        try {
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: body ? JSON.stringify(body) : undefined,
            });
            const b = await res.json().catch(() => null);
            if (!res.ok) { storeState = 'error'; storeMsg = (b && b.error) || `HTTP ${res.status}`; refreshDirty(); return null; }
            return b;
        } catch (e) {
            storeState = 'error'; storeMsg = '连不上后端，改动只在内存里'; refreshDirty();
            return null;
        }
    }
    function upsertItem(item) {                  // 磁盘清单 + 左栏树同步一份（.json 与 .cmpv 通用）
        if (!item || !item.file) return;
        delete item._stages;
        const i = FILES.findIndex((x) => x.file === item.file);
        if (i >= 0) FILES[i] = item; else FILES.push(item);
        buildTree();
    }
    async function putDsp(id, body) {
        const b = await postDsp('/api/dsps/' + encodeURIComponent(id + '.json'), 'POST', body);
        const item = b && b.item;
        if (!item) return null;
        upsertItem(item);
        storeState = 'ok'; storeMsg = ''; refreshDirty();
        return item;
    }
    // ---- 对比视图（.cmpv）：多选 → content/Compares/untitled.cmpv，内容是所选 DSP 的路径 ----
    function nextCmpvName() {
        const used = new Set(FILES.filter((it) => dirOf(it.file) === CMPV_DIR).map((it) => it.name));
        if (!used.has('untitled')) return 'untitled';
        let i = 2;
        while (used.has('untitled-' + i)) i++;
        return 'untitled-' + i;
    }
    async function createCompare(paths) {
        const name = nextCmpvName();
        const b = await postDsp('/api/cmpv', 'POST', { name, title: '未命名对比', targets: paths });
        const item = b && b.item;
        if (!item) return;
        upsertItem(item);
        open({ file: item.file });               // 建好直接打开这份对比（卡片列表）
    }
    async function deleteCmpv(file) {
        const name = fileNameOf(file);
        const ok = await ask({
            title: `删除「${name}」？`,
            body: '只删这份对比视图本身，被引用的 DSP 文件不动。',
            buttons: [
                { text: '删除', cls: 'danger', value: true },
                { text: '取消', value: false },
            ],
        });
        if (!ok) return;
        await removeCmpv(file);
    }
    // 真正删一份对比视图（不弹窗）：摘清单 + 删文件；正看着它的话退回列表。
    // 批量删除走这里，所以确认弹窗留在上面的单份入口里。
    async function removeCmpv(file) {
        const name = fileNameOf(file);
        const b = await postDsp('/api/cmpv/' + encodeURIComponent(name), 'DELETE');
        if (!b) return false;
        const i = FILES.findIndex((it) => it.file === file);
        if (i >= 0) FILES.splice(i, 1);
        if (center.panes.has(file)) centerClose(file);          // 正开着它 → 连这条标签一起关
        if (!center.tabs.length) open({ file: CMPV_DIR });      // 关空了 → 落回对比视图目录
        buildTree(); refreshDirty();
        return true;
    }
    async function saveDspFile(t) {
        const id = stemOf(t.file), e = entryOf(id);
        if (!e) return;
        await putDsp(id, { title: e.title, desc: e.desc, stages: e.stages });
    }
    // 保存时把每一条我的图各自写回自己的文件（DOC 那份整份写 /api/doc，两者内容同源）
    async function saveAllDspFiles() {
        for (const c of DOC.charts) {
            await putDsp(c.id, { title: c.title, desc: c.desc, stages: c.stages });
        }
    }
    // ---------- 树节点：目录行 → dsplistview，文件行 → dspview ----------
    // 目录行做得像 VSCode 的文件夹：一个可点的三角 + 目录名（不带尾巴的斜杠，完整路径在 tooltip 里），
    // 三角只管展开/收起，点行本身还是"打开这个目录的列表视图"（顺手把它展开）。
    // 每个目录 = 一个 .grp（目录行 + .kids 内容容器）：目录默认收起，给 .grp 加 collapsed 时 .kids 整块隐藏。
    const dirGroups = new Map();         // dir → { box, caret }，展开/收起就地刷，不重建整棵树
    function dirLabel(dir) {
        const s = dir.replace(/\/+$/, '');
        const i = s.lastIndexOf('/');
        return i < 0 ? s : s.slice(i + 1);
    }
    // 目录默认收起：view.expanded 里记着的才是展开的（不在清单里 = 收起）
    function isDirExpanded(dir) {
        const e = DOC.view && DOC.view.expanded;
        return !!e && e.indexOf(dir) >= 0;
    }
    function toggleDirExpanded(dir) {
        const clean = !archiveDirty();   // 先取：改完 view 就取不到了
        const v = viewOf();
        if (!Array.isArray(v.expanded)) v.expanded = [];
        const i = v.expanded.indexOf(dir);
        if (i >= 0) v.expanded.splice(i, 1); else v.expanded.push(dir);
        applyDirExpand();
        viewAutoSave(clean);             // 展开状态也进存档（与暂停名单同一条路）
    }
    function applyDirExpand() {
        for (const [dir, g] of dirGroups) {
            const open = isDirExpanded(dir);
            g.box.classList.toggle('collapsed', !open);
            g.caret.textContent = open ? '▾' : '▸';
            g.caret.title = open ? `收起 ${dir}` : `展开 ${dir}`;
        }
    }
    // ---------- 树里的多选：Shift = 范围，Ctrl/Cmd = 加/减，Ctrl+A = 全选，Esc = 清空 ----------
    // treeSel 与「内容面板当前活跃的标签」解耦：普通单击 = 打开并单选；带修饰键的单击只改选择，不切视图。
    function visibleTreeFiles() {        // 当前真正看得见的行（收起目录里的行 offsetParent 为 null）
        const out = [];
        for (const [file, n] of treeFileNodes) if (n.row.offsetParent !== null) out.push(file);
        return out;
    }
    function setTreeSel(files) {
        treeSel.clear();
        for (const f of files) treeSel.add(f);
        syncTreeFiles();
    }
    function toggleTreeSel(file) {
        if (treeSel.has(file)) treeSel.delete(file); else treeSel.add(file);
        treeAnchor = file;
        syncTreeFiles();
    }
    function selectTreeRange(file) {
        const vis = visibleTreeFiles();
        const a = vis.indexOf(treeAnchor), b = vis.indexOf(file);
        if (a < 0 || b < 0) { setTreeSel([file]); treeAnchor = file; return; }
        setTreeSel(vis.slice(Math.min(a, b), Math.max(a, b) + 1));   // 锚点不动：可以接着 Shift 扩 / 缩范围
    }
    function treeSelPaths() { return [...treeSel]; }
    // ---------- 就地重命名：行内变输入框，回车提交 / Esc 取消（F2 或右键菜单触发） ----------
    // 只对可写文件开放：「我的图」（content/My dsps/*.json）与对比视图（content/Compares/*.cmpv）。
    // 只读预设 Templates 不给改 —— 它是出厂内容，"要改就从模板新建"。
    function canRename(file) { return isDspFile(file) || isCmpvFile(file); }
    function startRename(file) {
        const n = treeFileNodes.get(file);
        if (!n || n.renaming) return;
        const stem = stemOf(file);
        const ext = fileNameOf(file).slice(stem.length);   // '.json' / '.cmpv'
        n.renaming = true;
        const input = document.createElement('input');
        input.className = 'tn-edit';
        input.type = 'text';
        input.value = stem;
        input.spellcheck = false;
        n.tn.hidden = true;                  // 藏起文本，输入框顶在同一格
        n.tn.after(input);
        input.focus();
        input.select();
        let done = false;
        const finish = (commit) => {
            if (done) return;
            done = true;
            n.renaming = false;
            const val = input.value.trim();
            input.remove();
            n.tn.hidden = false;
            if (commit && val && val !== stem) doRename(file, val + ext);
        };
        input.addEventListener('keydown', (ev) => {
            ev.stopPropagation();            // 别冒泡到树行的 Enter 打开 / Esc 清空
            if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
            else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
        });
        input.addEventListener('blur', () => finish(true));
        ['click', 'dblclick', 'contextmenu'].forEach((t) => input.addEventListener(t, (ev) => ev.stopPropagation()));
    }
    async function doRename(oldPath, newName) {
        const b = await postDsp('/api/rename', 'POST', { path: oldPath, name: newName });
        const item = b && b.item;
        if (!item) { buildTree(); return; }      // 失败：重建树把行恢复原样
        renameLocal(oldPath, item);
    }
    // 改名后把各处"指向旧路径"的状态搬到新路径（我的图的 id = 文件名，所以 DOC 条目也要跟着改）
    function renameLocal(oldPath, item) {
        const newPath = item.file;
        const oldStem = stemOf(oldPath), newStem = stemOf(newPath);
        delete item._stages;
        const fi = FILES.findIndex((x) => x.file === oldPath);
        if (fi >= 0) FILES[fi] = item; else FILES.push(item);
        if (fileCache.has(oldPath)) { fileCache.set(newPath, item); fileCache.delete(oldPath); }
        const c = DOC.charts.find((x) => x.id === oldStem);
        if (c) c.id = newStem;
        if (drafts.has(oldStem)) { drafts.set(newStem, drafts.get(oldStem)); drafts.delete(oldStem); }
        const ti = openTabs.indexOf(oldStem);                // 标签栏里也跟着改名（顺序不动）
        if (ti >= 0) openTabs[ti] = newStem;
        if (selected === oldStem) selected = newStem;
        if (treeSel.has(oldPath)) { treeSel.delete(oldPath); treeSel.add(newPath); }
        if (treeAnchor === oldPath) treeAnchor = newPath;
        for (const [, p] of center.panes) if (p.sel === oldPath) p.sel = newPath;   // 列表里的选中态跟着改名
        // 内容面板的标签身份就是路径：正开着它 → key / 顺序 / 活跃项一起搬过去
        const cp = center.panes.get(oldPath);
        if (cp) { center.panes.delete(oldPath); cp.key = newPath; center.panes.set(newPath, cp); }
        const cti = center.tabs.indexOf(oldPath);
        if (cti >= 0) center.tabs[cti] = newPath;
        if (center.active === oldPath) center.active = newPath;
        savePanels();
        const v = viewOf();
        v.paused = v.paused.map((k) => (k === oldPath ? newPath : k));
        if (v.shots[oldPath]) { v.shots[newPath] = v.shots[oldPath]; delete v.shots[oldPath]; }
        lastSaved = entryDocJson(DOC);                       // 改名不改内容，基线跟着更新
        buildTree();
        bindDraft(); syncEditorInputs(); labSync(true);
        renderCenter();
        revealInTree(newPath);
        refreshDirty();
    }
    // 把某个路径"露"到树里：沿路的祖先目录全部展开（目录本身也展开），并滚入视野。
    // 新建 / 打开一条之后调它（#open），否则新文件落在收起目录里，用户看不到它。
    function revealInTree(file) {
        if (!file || !treeFileNodes.size) return;
        const parts = file.split('/').filter(Boolean);
        const upto = file.endsWith('/') ? parts.length : parts.length - 1;   // 目录自身也要展开
        const v = viewOf();
        if (!Array.isArray(v.expanded)) v.expanded = [];
        const add = [];
        let acc = '';
        for (let i = 0; i < upto; i++) {
            acc += parts[i] + '/';
            if (acc !== CONTENT_ROOT && v.expanded.indexOf(acc) < 0) add.push(acc);
        }
        if (add.length) {
            const clean = !archiveDirty();      // 先取：改完 view 就取不到了
            v.expanded.push(...add);
            applyDirExpand();
            viewAutoSave(clean);                // 展开状态进存档，刷新后仍然展开
        }
        const n = treeFileNodes.get(file);
        if (n && n.row.offsetParent) n.row.scrollIntoView({ block: 'nearest' });
    }
    function treeFileRow(file, label, cls, box, expandable) {
        const row = document.createElement('div');
        row.className = 'tnode ' + cls;
        const isDir = cls === 'dir';
        const canExpand = isDir && expandable !== false;   // 空目录没有内容可展开 → 不给三角、不绑双击
        if (isDir) {
            if (canExpand) {
                const caret = document.createElement('span');
                caret.className = 'caret';
                caret.textContent = '▸';   // 默认收起；建树后 applyDirExpand 按存档里的展开清单修正
                caret.addEventListener('click', (ev) => { ev.stopPropagation(); if (ev.detail > 1) return; toggleDirExpanded(file); });
                caret.addEventListener('dblclick', (ev) => ev.stopPropagation());   // 双击三角不冒泡成"整行双击"
                row.appendChild(caret);
                if (box) dirGroups.set(file, { box, caret });
            } else {
                const pad = document.createElement('span');   // 占位：让目录名与其它行对齐，但不可点
                pad.className = 'caret void';
                row.appendChild(pad);
            }
        }
        const to = document.createElement('span');
        to.className = 'to';
        to.textContent = isDir ? '📁' : (isCmpvFile(file) ? '⇄' : '📄');   // ⇄ = 对比视图
        const tn = document.createElement('span'); tn.className = 'tn'; tn.textContent = label;
        row.append(to, tn);
        row.tabIndex = 0;
        row.title = isDir
            ? file + (canExpand ? '\n单击：打开这个目录的列表视图；双击（或点三角）：展开 / 收起\nShift 单击 = 范围选择，Ctrl 单击 = 加选' : '\n打开这个目录的列表视图（空目录）')
            : file + '\n单击：打开这一条的链路视图；Shift 单击 = 范围选择，Ctrl 单击 = 加选';
        row.addEventListener('click', (ev) => {
            if (ev.detail > 1) return;      // 双击的第二击：不重复导航，交给下面的 dblclick
            if (ev.shiftKey) { selectTreeRange(file); return; }               // Shift = 范围选择（不切视图）
            if (ev.ctrlKey || ev.metaKey) { toggleTreeSel(file); return; }    // Ctrl/Cmd = 加选 / 减选
            setTreeSel([file]);             // 普通单击：单选
            treeAnchor = file;
            open({ file });
        });
        // 双击目录行 = 展开 / 收起；单击留给"打开列表视图"，不再顺带展开
        if (canExpand) row.addEventListener('dblclick', (ev) => { ev.preventDefault(); toggleDirExpanded(file); });
        row.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open({ file }); } });
        row.addEventListener('contextmenu', (ev) => { ev.preventDefault(); openFileMenu(row, file); });
        treeFileNodes.set(file, { row, tn });
        return row;
    }
    // 一个树节点 → 一行：文件节点直接一行；目录节点 = 目录行 + .kids 内容容器（递归子节点）。
    // 空目录（没有子目录也没有 .json）不建内容容器，也就没有展开/收起可言。
    // 只读目录（非「我的图」）下的文件行压暗一档（.tpl），提示"要改就克隆一份"。
    function buildTreeNode(nd) {
        if (nd.kind === 'file') {
            // 树里一律显示文件名（不带 title）：标题是内容属性，改名不该让树行跟着变
            return treeFileRow(nd.path, nd.name, 'file' + (isDspFile(nd.path) ? '' : ' tpl'));
        }
        const box = document.createElement('div');
        box.className = 'grp';
        const children = nd.children || [];
        box.appendChild(treeFileRow(nd.path, dirLabel(nd.path), 'dir', box, children.length > 0));
        if (children.length) {
            const kids = document.createElement('div');
            kids.className = 'kids';
            for (const c of children) kids.appendChild(buildTreeNode(c));
            box.appendChild(kids);
        }
        return box;
    }
    // 选中态：由 treeSel 决定（打开某条时 open() 会把它并进选择；Shift/Ctrl 可多选）
    function syncTreeFiles() {
        for (const [file, n] of treeFileNodes) n.row.classList.toggle('sel', treeSel.has(file));
    }
    // 树内的键盘多选：Ctrl/Cmd+A 全选（只选看得见的行）、Esc 清空（菜单开着时 Esc 先关菜单）
    treeEl.addEventListener('keydown', (ev) => {
        if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'a' || ev.key === 'A')) {
            ev.preventDefault();
            setTreeSel(visibleTreeFiles());
        } else if (ev.key === 'Escape' && menuEl.hidden) {
            setTreeSel([]);
        }
    });
    // ---------- 右键菜单（文件 / 目录行） ----------
    // 挂在 body 上：行/卡片在布局流里，浮层若作为它们的子元素会被行高/栅格布局挤压变形。
    const menuEl = document.createElement('div');
    menuEl.className = 'cmenu';
    menuEl.hidden = true;
    document.body.appendChild(menuEl);
    function closeMenu() { menuEl.hidden = true; }
    // ---------- 菜单项注册表：加一项不必再改 fileMenuItems ----------
    // 按「节点类型 × 路径」注册，值是槽位函数 —— 收到被右键那行的 item，返回这一项的描述：
    //   FOLDER.contextMenu.newFile = (item) => ({ title: '新建 DSP', hint: '…', onClick: () => … });   // 所有目录行
    //   FOLDER(DIR_DSP).newFile    = (item) => ({ … });                                               // 只这一个目录行
    //   FILE.contextMenu.xx        = (item) => () => doIt(item);                                      // 返回函数 = 直接当 onClick
    // 返回 null / undefined / false → 这一项这次不出现（可以按 item 临时决定给不给）。
    // 返回函数比返回对象更简：一项只有一个动作时，函数本体就是 onClick，标题用槽位名兜底。
    // 同名槽位后注册的覆盖先前的；显示顺序：精确路径注册的项在前，通配 '*'（FOLDER/FILE.contextMenu）的项在后。
    const menuSlots = { folder: new Map(), file: new Map() };   // kind → path → Map(槽位名 → 槽位函数)
    function menuScope(kind, path) {
        let slots = menuSlots[kind].get(path);
        if (!slots) { slots = new Map(); menuSlots[kind].set(path, slots); }
        return new Proxy(Object.create(null), {               // 支持 .slotName = fn 这种声明式写法
            get: (_, k) => slots.get(k),
            set: (_, k, v) => { slots.set(k, v); return true; },
        });
    }
    const FOLDER = (path = '*') => menuScope('folder', path);   // 目录行
    const FILE = (path = '*') => menuScope('file', path);       // 文件行
    FOLDER.contextMenu = menuScope('folder', '*');
    FILE.contextMenu = menuScope('file', '*');
    // 被右键那一行 → 上下文（槽位函数的入参，也原样交给 onClick）
    function menuCtx(file) {
        const isDir = file.endsWith('/');
        const nm = isDir ? file.replace(/\/$/, '').split('/').pop() : stemOf(file);
        return {
            file, path: file, name: nm, isDir, isFile: !isDir,
            dir: isDir ? file : dirOf(file),
            id: !isDir && isDspFile(file) ? nm : '',
            item: isDir ? null : itemOf(file),
        };
    }
    // 把注册表里匹配这一行的项收成与内置项同样的格式：[标题, 提示, 动作, 附加类]
    function contributedItems(kind, file) {
        const ctx = menuCtx(file);
        const out = [];
        for (const key of [file, '*']) {
            const slots = menuSlots[kind].get(key);
            if (!slots) continue;
            for (const [slot, fn] of slots) {
                let v = fn;
                try { if (typeof fn === 'function') v = fn(ctx); }
                catch (err) { console.warn('[menu:' + slot + ']', err); v = null; }
                if (v === null || v === undefined || v === false) continue;
                if (typeof v === 'function') out.push([slot, '', () => v(ctx), '']);   // 返回函数 = 本体就是动作
                else out.push([v.title || slot, v.hint || '', () => { if (v.onClick) v.onClick(ctx); }, v.danger ? 'danger' : '']);
            }

        return out;
    }
    // 文件行的菜单：目录行只有「打开列表」；文件行按目录给不同的动作
    //   只读文件（content/Templates/ 等）→ 从模板新建（只能克隆出自己的一条）
    //   我的图（content/My dsps/）        → 编辑 / 复制 / 删除（自己的文件，可改可删）
    //   两种行都还能由上面的 FOLDER / FILE 注册表再挂项（如「我的图」目录行上的「新建 DSP」）
    function fileMenuItems(file) {
        const t = itemOf(file);
        const isDir = file.endsWith('/');
        const cmpv = isCmpvFile(file);
        // 多选状态（Shift / Ctrl）下右键其中任意一行 → 给整批的动作
        if (!isDir && treeSel.size > 1 && treeSel.has(file)) {
            const paths = treeSelPaths();
            const ids = paths.filter((f) => isDspFile(f) && f.endsWith('.json')).map(stemOf);
            const cmpvs = paths.filter(isCmpvFile);
            const dspPaths = paths.filter((f) => f.endsWith('.json'));
            const batch = [];
            if (dspPaths.length >= 2) batch.push([`创建对比视图（${dspPaths.length} 项）`, '把这些 DSP 写进 content/Compares/ 下的一份 .cmpv，用来并排对比', () => createCompare(dspPaths), '']);
            if (ids.length || cmpvs.length) {   // 「我的图」与对比视图都在这一项里删，各自的删法不同
                const what = [];
                if (ids.length) what.push(`${ids.length} 条「我的图」`);
                if (cmpvs.length) what.push(`${cmpvs.length} 份对比视图`);
                batch.push([`删除选中的 ${ids.length + cmpvs.length} 项`,
                    `删掉 ${what.join(' + ')}：我的图连文件一起删，对比视图只删自己（被引用的 DSP 不动）`,
                    () => deleteTreeSelection(ids, cmpvs), 'danger']);
            }
            if (batch.length) return batch;
        }
        const items = [[isDir ? '打开列表' : (cmpv ? '打开对比' : '预览DSP'),
            isDir ? file + ' 的列表视图（dsplistview）'
                : (cmpv ? `打开 ${file}（卡片列表对比）` : `打开 ${file} 的链路视图（dspview）`),
            () => open({ file }), '']];
        const extra = contributedItems(isDir ? 'folder' : 'file', file);   // 注册进来的项夹在「打开」与内置管理动作之间

            own.push(['重命名', '就地改名（回车提交，Esc 取消）', () => startRename(file), '']);

            const id = stemOf(file);
            own.push(['编辑', '在右栏编辑器里改标题 / 说明 / 级联', () => { if (entryOf(id)) selectChart(id); }, '']);
            own.push(['保存', '把这一条写回文件', () => saveDspFile(t), '']);
            own.push(['重命名', '就地改名（回车提交，Esc 取消）', () => startRename(file), '']);
            own.push(['复制', '克隆成新的一条', () => cloneAsNew(id), '']);
            own.push(['删除', '从 content/My dsps/ 里删掉这一条', () => deleteChart(id), 'danger']);
        } else {
            own.push(['从模板新建', '把这份模板克隆成一份可编辑的「我的图」', () => newFromStagesFile(t), '']);
        }
        return items.concat(extra, own);

    // 「我的图」目录行：新建一份空的「我的图」（内容 = 一条空链，标题随后在右栏改）
    // 命名跟对比视图同一套：untitled、untitled-2…（文件名即 id，也即树里显示的那一行）
    FOLDER(DIR_DSP).newFile = (item) => ({
        title: '新建 DSP',

    function openFileMenu(anchor, file) { openMenuAt(anchor, fileMenuItems(file)); }
    function openMenuAt(anchor, items) {
        if (!items || !items.length) return;

    // 结构变化（增删条目 / 载入新文档 / 刷新磁盘清单）后重建左栏树；视图面板由 renderCenter 刷新
    // ---------- 播放控制：暂停 = 冻结画面（停止 compute+draw，画布保持最后一帧） ----------
    // 暂停那一刻把画布导出 PNG 落盘到 content/Snapshots/，DOC.view.shots 里只记地址 (/api/shots/<name>.png)，
    // 并顺手存一次盘（不提交任何草稿）。载入时按 DOC.view 还原：暂停的画布不再参与绘制，并把存档里的快照画回画布。
    // 暂停的粒度是"一块画布的身份 key"：格子的 key = entry.id，模板条目的 key = 文件路径。
    // 两者共用同一份 view.paused / view.shots —— 模板条目也要能暂停，与格子没有区别。
    function keyOf(ch) { return ch.file || (ch.entry && ch.entry.id) || ''; }
    function isPaused(key) { return !!key && !!(DOC.view && DOC.view.paused.includes(key)); }
    function viewOf() { if (!DOC.view) DOC.view = emptyView(); return DOC.view; }
    function chartsOfKey(key) {
        const out = [];
        if (!key) return out;
        for (const ch of charts) if (keyOf(ch) === key) out.push(ch);
        return out;                                  // 同一 key 可能有两块画布（列表小图 + 单文件大图）
    }
    // 快照文件名 = key 里除 [A-Za-z0-9._-] 外的字符全换成 _，再挂 .png：
    //   'c1' → c1.png；'content/Templates/inv+zscore.json' → content_Templates_inv_zscore.json.png
    function shotFileOf(key) { return key.replace(/[^A-Za-z0-9._-]+/g, '_') + '.png'; }
    function shotUrlOf(key) { return '/api/shots/' + encodeURIComponent(shotFileOf(key)); }
    // 暂停那一刻：把画布导出 PNG 交给后端落到 content/Snapshots/，存档里只记地址（不再往 JSON 里塞 dataURL）
    function captureShot(ch) {
        const k = keyOf(ch);
        if (!k) return false;
        try {
            const data = ch.cv.toDataURL('image/png');
            viewOf().shots[k] = shotUrlOf(k);
            fetch(shotUrlOf(k), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data }),
            }).catch(() => {});     // 落盘失败只影响这张图；存档里的暂停状态照样有效
            return true;
        } catch (e) { /* toDataURL 失败（极端情况下画布不可导出）就不存，只保留暂停状态 */ }
        return false;
    }
    function dropShotFile(key) {
        fetch(shotUrlOf(key), { method: 'DELETE' }).catch(() => {});
    }
    function paintShot(ch) {
        const k = keyOf(ch);
        const u = k && DOC.view && DOC.view.shots[k];
        if (!u) return false;
        ch.ctx.clearRect(0, 0, ch.w, ch.h);
        const img = new Image();
        img.onload = () => { ch.ctx.drawImage(img, 0, 0, ch.w, ch.h); };

        ch.shotPainted = true;
        return true;

    // 同一 key 可能对应多块画布（列表小图 / 单文件大图 / 格子），一起冻结；快照各存各的
    // 右栏是编辑器，跟左栏的播发状态无关：它永远实时跑，不受这里的暂停影响
    function setPaused(key, on, opts) {
        if (!key) return;
        const clean = !archiveDirty();   // 同上：先取，改 view 之后就取不到了
        const v = viewOf();
        v.paused = v.paused.filter((x) => x !== key);
        if (on) v.paused.push(key);
        else { delete v.shots[key]; dropShotFile(key); }   // 恢复播放 = 这张快照作废：删地址，并删掉磁盘上的 PNG

            ch.paused = on;
            if (on) captureShot(ch);
            renderPlayBtn(ch);
        }

        refreshDirty();

        if (!opts || !opts.silent) viewAutoSave(clean);
    }
    // 全部暂停 = 所有打开着的内容面板标签里"有身份的画布"（key = 文件路径，同一条去重）
    function pauseKeys() {
        const out = [];
        for (const [, p] of center.panes) {
            for (const ch of p.charts) if (ch.file && out.indexOf(ch.file) < 0) out.push(ch.file);
        }
        return out;
    }
    function allPaused() {
        const ks = pauseKeys();
        return ks.length > 0 && ks.every(isPaused);
    }
    function setAllPaused(on) {
        const clean = !archiveDirty();
        for (const k of pauseKeys()) setPaused(k, on, { silent: true });

    }
    // 播放按钮就地刷：条目把 paused 打在自己的卡片上（共用 .paused 的压暗样式）
    function renderPlayBtn(ch) {
        if (!ch.playBtn) return;
        const on = isPaused(keyOf(ch));
        ch.playBtn.textContent = on ? '▶' : '⏸';
        ch.playBtn.title = on ? '继续播放（快照会一起清掉）' : '暂停（画面停住，并存一张快照到存档）';
        if (ch.card) ch.card.classList.toggle('paused', on);
    }
    // 载入 / adoptDoc 之后：把暂停状态贴到各块画布上，并把存档里的快照画回来
    function applyView() {
        for (const ch of charts) {
            const k = keyOf(ch);
            if (!k) continue;                  // 右栏输出图 / 逐级卡没有身份，不参与
            ch.paused = isPaused(k);
            if (ch.paused) paintShot(ch);
            renderPlayBtn(ch);
        }
        labOut.paused = false;    // 右栏是编辑器，始终实时（与左栏的播发/暂停无关）
        syncGlobalPlay();
    }
    function syncGlobalPlay() {
        const b = document.getElementById('gPlay');
        const all = allPaused();

    // 全局参数：平坦度时间窗（影响所有图的数据源 sfmLines）
    const gState = {};
    buildParams(document.getElementById('globalBar'),
        [{ key: 'win', label: '平坦窗(秒)', type: 'range', min: 0.02, max: 1, step: 0.02, def: 0.2, dst: gState }],
        () => { sfmWinK = Math.max(1, Math.round(gState.win * CHART_HZ)); });

    // ---------- 级联存档的清洗（供文档模型 sanitizeDoc / defaultScratchEntry 调用） ----------
    // 存的是纯数据（id/on/p），非法 id 与越界参数在这里就地纠正。
    // 判存在必须用 hasOwnProperty：OPS 是普通对象，OPS['__proto__'] 会沿原型链拿到 Object.prototype（truthy），
    // 用真值判断会让脏存档里的 '__proto__'/'constructor' 混进来，随后取 .params 抛错、白屏。
    function sanitizeStages(raw) {
        if (!Array.isArray(raw)) return null;

        for (const s of raw) {
            if (!s || typeof s !== 'object' || !Object.prototype.hasOwnProperty.call(OPS, s.id)) continue;

                if (sp.min != null) v = Math.max(sp.min, v);

        return out;
    }

    // ---------- 右栏编辑器 dspEditorView：一份关联草稿，保存才写回 ----------
    // 编辑目标有两种：

    // ---- 自绘模态：ask({ title, body, buttons:[{ text, cls, value }] }) → Promise<value>

    const modalEl = document.getElementById('modal');

    function ask(opts) {
        return new Promise((resolve) => {

    // SCRATCH：自由探索草稿（dspEditorView 的默认内容）—— 不是 DOC 条目、不落盘
